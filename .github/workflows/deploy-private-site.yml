# Mirrors main to the private site (app.maththingsedtech.com) on every push,
# the same way GitHub Pages mirrors it to the public site.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers edit permission)
# and CLOUDFLARE_ACCOUNT_ID. Without them the job skips instead of failing.
name: Deploy private site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-private-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "ready=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 20
      - name: Deploy worker and assets
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
