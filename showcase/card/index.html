<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Math Things end card</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F5F5F7; }
  /* the rekenrek's settled last frame dissolves into the bare mat … */
  #last { position: fixed; inset: 0; width: 100%; height: 100%; }
  .go #last { animation: out 0.6s ease-in-out both; }
  /* … and the line arrives once, both parts together */
  .card { position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
    font-family: 'Lexend', sans-serif; opacity: 0; }
  .go .card { animation: in 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.65s both; }
  h1 { margin: 0; font-weight: 700; font-size: 116px; letter-spacing: -0.02em; color: #1D1D1F; }
  p { margin: 22px 0 0; font-weight: 500; font-size: 46px; color: #6E6E73; }
  @keyframes out { to { opacity: 0; } }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <img id="last" src="../out/08-rekenrek-return-last.png" alt="">
  <div class="card"><h1>Math Things.</h1><p>Math, in your hands.</p></div>
</body>
</html>
