<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>Math Things. | Double Number Line</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --text-main: #1D1D1F; --text-gray: #86868B; --text-light: #AEAEB2; --surface: #FFFFFF;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --shadow-raised: 6px 6px 14px rgba(166,171,189,0.45), -6px -6px 14px rgba(255,255,255,0.9);
      --shadow-milled: inset 3px 3px 6px rgba(166,171,189,0.9), inset -3px -3px 6px rgba(255,255,255,1);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Lexend', sans-serif; color: var(--text-main); height: 100dvh; overflow: hidden;
      display: flex; flex-direction: column; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-font-smoothing: antialiased; touch-action: none;
      background: radial-gradient(ellipse at 50% 38%, #FBF9F6 0%, #F2EFEA 58%, #E8E4DD 100%);
    }
    #surface { flex: 1; min-height: 0; }
    #board { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; overflow: visible; }
    #board text { font-family: 'Lexend', sans-serif; text-anchor: middle; dominant-baseline: central; }
    #plot { pointer-events: all; cursor: pointer; outline: none; }
    #cursor { opacity: 0; }
    #plot:focus-visible #cursor { opacity: 1; }
    #board .step { pointer-events: all; cursor: pointer; outline: none; }
    #board .step:focus-visible circle { stroke: #007AFF; stroke-width: 2.5; }
    #board .rec { opacity: 0; transition: opacity 0.3s; }
    #board.recon .rec { opacity: 1; }
    #reader { pointer-events: all; cursor: ew-resize; outline: none; }
    #reader:focus-visible rect.handle { stroke: #007AFF; stroke-width: 3; }
    .hardware { position: fixed; top: 14px; right: 16px; z-index: 20; display: flex; gap: 10px; }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 50%; background: var(--surface); border: 2px solid transparent;
      box-shadow: var(--shadow-raised); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.25s var(--spring); outline: none; color: var(--text-gray); padding: 0;
    }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn.active { box-shadow: var(--shadow-milled); color: var(--text-main); }
    .icon-btn:focus-visible { border-color: #007AFF; }
    #footer {
      flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase;
      color: var(--text-light); letter-spacing: 0.5px; background: linear-gradient(180deg, #DADCE1 0%, #E4E6EA 100%);
    }
    .footer-bead { display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--text-light); margin: 0 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
<main id="surface" aria-label="Double number line"></main>

<div class="hardware">
  <button class="icon-btn" id="recordBtn" aria-label="Show every number" aria-pressed="false">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 8s2.6-4.6 7-4.6S15 8 15 8s-2.6 4.6-7 4.6S1 8 1 8z"/><circle cx="8" cy="8" r="2.3"/></svg>
  </button>
  <button class="icon-btn" id="clearBtn" aria-label="Back to the start">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.6 6.2A5.6 5.6 0 1 1 2.4 9.6"/><path d="M2.2 2.6v3.8h3.8"/></svg>
  </button>
</div>

<div id="footer">Math Things <span class="footer-bead"></span> | Math, in your hands <span class="footer-bead"></span></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F5F7"/><stop offset="1" stop-color="#C9CCD1"/></linearGradient>
  </defs>
</svg>

<svg id="board">
  <g id="lines"></g>
  <g id="controls"></g>
  <g id="reader" tabindex="0" role="slider" aria-label="Reader. Left and Right move it along both lines."></g>
</svg>
<div id="live" class="sr-only" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  // Two number lines share their tick marks: the top counts by `a`, the bottom by `b`, so every tick pair is the ratio a : b.
  // Each space can be cut into equal parts to find a unit rate.
  const TOP = '#4169E1', BOT = '#DC143C';
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const buzz = n => { if (reduceMotion || !navigator.vibrate) return; try { navigator.vibrate(n); } catch (e) {} };
  const r2 = v => Math.round(v * 100) / 100;
  const $ = id => document.getElementById(id);
  const board = $('board'), linesG = $('lines'), controls = $('controls'), reader = $('reader'), live = $('live');
  const START = { a: 3, b: 5, n: 6, cuts: 1, pos: 2 };
  let st = { ...START }, recordOn = false;
  let X0 = 0, L = 0, YT = 0, YB = 0;
  const step = () => L / st.n;
  const gcd = (p, q) => q ? gcd(q, p % q) : p;
  // value at position p (in spaces, a multiple of 1/cuts), as a whole number, a mixed number or a fraction
  function val(per, p) {
    const num = Math.round(per * p * st.cuts), den = st.cuts, g = gcd(num, den), n = num / g, d = den / g;
    if (d === 1) return String(n);
    const w = Math.floor(n / d);
    return w ? `${w} ${n % d}/${d}` : `${n}/${d}`;
  }

  function layout() {
    const W = innerWidth, H = innerHeight - 30;
    L = Math.min(W - 120, 960);
    X0 = Math.round((W - L) / 2 + 20);
    YT = Math.round(H / 2 - 50); YB = YT + 110;
    draw();
  }

  // ═══════ DRAWING ═══════
  function line(y, color, per, above) {
    const fs = Math.max(11, Math.min(17, step() * 0.3));
    let s = `<rect x="${r2(X0 - 10)}" y="${y - 4}" width="${r2(L + 20)}" height="8" rx="4" fill="url(#rail)" stroke="${color}" stroke-opacity="0.45"/>`;
    for (let k = 0; k <= st.n; k++) {
      const x = X0 + k * step();
      s += `<path d="M${r2(x)},${y - 13}v26" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/>`;
      for (let j = 1; k < st.n && j < st.cuts; j++) s += `<path d="M${r2(x + j * step() / st.cuts)},${y - 7}v14" stroke="${color}" stroke-width="1.3" opacity="0.8"/>`;
      // 0 and the first pair are printed; the rest of the numbers are the record
      s += `<text class="${k > 1 ? 'rec' : ''}" x="${r2(x)}" y="${above ? y - 28 : y + 30}" font-size="${r2(fs)}" font-weight="800" fill="${color}">${per * k}</text>`;
    }
    return s;
  }
  function draw() {
    linesG.innerHTML = line(YT, TOP, st.a, true) + line(YB, BOT, st.b, false);
    // the reader: a glass bar across both lines
    const x = X0 + st.pos * step(), fs = Math.max(13, Math.min(18, step() * 0.32));
    reader.innerHTML = `<rect x="${r2(x - 22)}" y="${YT - 70}" width="44" height="${YB - YT + 140}" fill="transparent"/>` +
      `<rect class="handle" x="${r2(x - 3)}" y="${YT - 22}" width="6" height="${YB - YT + 44}" rx="3" fill="#1D1D1F" opacity="0.75"/>` +
      `<circle cx="${r2(x)}" cy="${(YT + YB) / 2}" r="13" fill="#fff" stroke="#1D1D1F" stroke-width="2"/><path d="M${r2(x - 5)},${(YT + YB) / 2}h10M${r2(x - 5)},${(YT + YB) / 2}l3,-3M${r2(x - 5)},${(YT + YB) / 2}l3,3M${r2(x + 5)},${(YT + YB) / 2}l-3,-3M${r2(x + 5)},${(YT + YB) / 2}l-3,3" stroke="#1D1D1F" stroke-width="1.6" stroke-linecap="round" fill="none"/>` +
      `<g class="rec"><text x="${r2(x)}" y="${YT - 54}" font-size="${r2(fs)}" font-weight="900" fill="${TOP}" style="paint-order: stroke; stroke: #FBF9F6; stroke-width: 4px">${val(st.a, st.pos)}</text>` +
      `<text x="${r2(x)}" y="${YB + 56}" font-size="${r2(fs)}" font-weight="900" fill="${BOT}" style="paint-order: stroke; stroke: #FBF9F6; stroke-width: 4px">${val(st.b, st.pos)}</text></g>`;
    reader.setAttribute('aria-valuetext', recordOn ? `${val(st.a, st.pos)} and ${val(st.b, st.pos)}` : `tick ${st.pos.toFixed(2)}`);
    drawControls();
  }
  // ‹ › for the top count, the bottom count, the length, and the cuts in each space
  function drawControls() {
    const btn = (id, x, y, glyph, can, label) => `<g class="step" tabindex="0" role="button" data-id="${id}" aria-label="${label}" aria-disabled="${!can}" opacity="${can ? 1 : 0.35}">` +
      `<circle cx="${r2(x)}" cy="${r2(y)}" r="16" fill="#FFFFFF" stroke="rgba(60,62,68,0.18)" style="filter: drop-shadow(2px 3px 4px rgba(166,171,189,0.45))"/>` +
      `<text x="${r2(x)}" y="${r2(y - 1)}" font-size="19" font-weight="600" fill="#6E7076">${glyph}</text></g>`;
    const xl = X0 - 52;
    let s = btn('a+', xl, YT - 20, '+', st.a < 50, 'Top counts by more') + btn('a-', xl, YT + 20, '−', st.a > 1, 'Top counts by less');
    s += btn('b+', xl, YB - 20, '+', st.b < 50, 'Bottom counts by more') + btn('b-', xl, YB + 20, '−', st.b > 1, 'Bottom counts by less');
    const yc = YB + 110, mid = X0 + L / 2;
    s += btn('cuts-', mid - 46, yc, '‹', st.cuts > 1, 'Fewer cuts in each space');
    s += `<g transform="translate(${r2(mid)} ${yc})">${[...Array(st.cuts + 1)].map((_, i) => `<path d="M${r2(-14 + i * 28 / st.cuts)},${i % st.cuts ? -4 : -8}v${i % st.cuts ? 8 : 16}" stroke="#6E7076" stroke-width="1.5"/>`).join('')}<path d="M-14,0h28" stroke="#6E7076" stroke-width="1.5"/></g>`;
    s += btn('cuts+', mid + 46, yc, '›', st.cuts < 10, 'More cuts in each space');
    s += btn('n-', X0 + L - 40, yc, '‹', st.n > 2, 'Shorter lines') + btn('n+', X0 + L, yc, '›', st.n < 12, 'Longer lines');
    controls.innerHTML = s;
  }

  let liveTimer = 0;
  const say = t => { clearTimeout(liveTimer); liveTimer = setTimeout(() => { live.textContent = t; }, 300); };
  const reading = () => recordOn ? `${val(st.a, st.pos)} and ${val(st.b, st.pos)}.` : `Tick ${Math.floor(st.pos)}${st.pos % 1 ? ' and a part' : ''}.`;

  function act(id) {
    const k = id.slice(0, -1), up = id.endsWith('+');
    const lim = { a: [1, 50], b: [1, 50], n: [2, 12], cuts: [1, 10] }[k];
    const v = st[k] + (up ? 1 : -1);
    if (v < lim[0] || v > lim[1]) { buzz([4, 30, 4]); return; }
    st[k] = v;
    // the reader stays on a mark: on the lines, and on a cut
    st.pos = Math.min(st.n, Math.round(st.pos * st.cuts) / st.cuts);
    buzz(5); draw(); say(k === 'a' || k === 'b' ? `${st.a} to ${st.b}.` : k === 'n' ? `${st.n} spaces.` : `${st.cuts} parts in each space.`);
  }
  controls.addEventListener('pointerdown', e => { const s = e.target.closest('.step'); if (s) { e.preventDefault(); act(s.dataset.id); } });
  board.addEventListener('keydown', e => {
    const s = e.target.closest && e.target.closest('.step');
    if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const id = s.dataset.id; act(id); const again = document.querySelector(`.step[data-id="${id}"]`); if (again) again.focus(); return; }
    if (e.target !== reader) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      st.pos = Math.max(0, Math.min(st.n, Math.round((st.pos + (e.key === 'ArrowRight' ? 1 : -1) / st.cuts) * st.cuts) / st.cuts));
      draw(); reader.focus(); say(reading());
    }
  });

  // ═══════ READER ═══════
  // drag the bar; it snaps to the ticks and the cuts between them
  let drag = null;
  reader.addEventListener('pointerdown', e => { e.preventDefault(); drag = e.pointerId; try { reader.setPointerCapture(e.pointerId); } catch (err) {} });
  reader.addEventListener('pointermove', e => {
    if (drag !== e.pointerId) return;
    const p = Math.max(0, Math.min(st.n, Math.round((e.clientX - X0) / step() * st.cuts) / st.cuts));
    if (p !== st.pos) { st.pos = p; buzz(2); draw(); }
  });
  const end = e => { if (drag === e.pointerId) { drag = null; say(reading()); } };
  reader.addEventListener('pointerup', end); reader.addEventListener('pointercancel', end);

  $('recordBtn').addEventListener('click', () => { recordOn = !recordOn; board.classList.toggle('recon', recordOn); $('recordBtn').classList.toggle('active', recordOn); $('recordBtn').setAttribute('aria-pressed', String(recordOn)); draw(); });
  $('clearBtn').addEventListener('click', () => { st = { ...START }; draw(); buzz(8); });
  let frame = 0;
  addEventListener('resize', () => { cancelAnimationFrame(frame); frame = requestAnimationFrame(layout); });
  addEventListener('contextmenu', e => e.preventDefault());
  layout();
})();
</script>
<script src="../../math-things-home.js"></script>
</body>
</html>
