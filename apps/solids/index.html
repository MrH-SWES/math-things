<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>Math Things. | Solids</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --text-main: #1D1D1F;
      --text-gray: #86868B;
      --text-light: #AEAEB2;
      --surface: #FFFFFF;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --shadow-raised: 6px 6px 14px rgba(166,171,189,0.45), -6px -6px 14px rgba(255,255,255,0.9);
      --shadow-milled: inset 3px 3px 6px rgba(166,171,189,0.9), inset -3px -3px 6px rgba(255,255,255,1);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Lexend', sans-serif;
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      /* the mat: warm, quiet ceramic */
      background: radial-gradient(ellipse at 50% 38%, #FBF9F6 0%, #F2EFEA 58%, #E8E4DD 100%);
    }

    #stage { flex: 1; min-height: 0; position: relative; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
    #stage canvas:focus-visible { box-shadow: inset 0 0 0 3px #007AFF; }
    /* ── CABINET ── */
    #dock { flex-shrink: 0; display: flex; justify-content: center; padding: 0 12px; }
    #cabinet {
      display: flex; align-items: center;
      gap: clamp(8px, 1.6vw, 16px);
      padding: 12px clamp(12px, 2vw, 20px);
      border-radius: 24px 24px 0 0;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.16) 0 1px, rgba(0,0,0,0.018) 1px 2px, transparent 2px 4px),
        linear-gradient(180deg, #EFF0F3 0%, #DADCE1 100%);
      border: 1px solid rgba(0,0,0,0.06);
      border-bottom: none;
      box-shadow: 0 -8px 22px rgba(110,95,75,0.12), inset 0 1px 0 rgba(255,255,255,0.95);
    }
    #bins { display: flex; gap: clamp(6px, 1.2vw, 12px); }
    .bin {
      width: clamp(58px, 11vw, 88px);
      height: clamp(52px, 9vw, 72px);
      border: 2px solid transparent; border-radius: 16px;
      background: linear-gradient(180deg, #ECEEF1 0%, #F6F7F9 100%);
      box-shadow: var(--shadow-raised);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.2s var(--spring), box-shadow 0.2s;
    }
    /* the chosen bin sits pressed into the cabinet */
    .bin[aria-pressed="true"] { background: linear-gradient(180deg, #DFE1E6 0%, #ECEEF1 100%); box-shadow: var(--shadow-milled); }
    .bin:active { transform: scale(0.97); }
    .bin:focus-visible { border-color: #007AFF; }
    .bin svg { width: 72%; height: 72%; overflow: visible; pointer-events: none; }
    .hardware { display: flex; flex-direction: column; gap: 10px; padding-left: clamp(4px, 1vw, 10px); border-left: 1px solid rgba(0,0,0,0.07); }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--surface); border: 2px solid transparent;
      box-shadow: var(--shadow-raised);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.25s var(--spring); outline: none;
      color: var(--text-gray); padding: 0;
    }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn.active { box-shadow: var(--shadow-milled); color: var(--text-main); }
    .icon-btn:focus-visible { border-color: #007AFF; }

    /* ── FOOTER ── */
    #footer {
      flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase;
      color: var(--text-light); letter-spacing: 0.5px;
      background: linear-gradient(180deg, #DADCE1 0%, #E4E6EA 100%);
    }
    .footer-bead { display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--text-light); margin: 0 4px; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @media (max-width: 600px) { #bins { display: grid; grid-template-columns: repeat(3, auto); } .bin { width: 70px; height: 50px; } }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body>
<main id="stage" aria-label="Mat for solid shapes"></main>

<div id="dock">
  <div id="cabinet" role="toolbar" aria-label="Bins">
    <div id="bins"></div>
    <div class="hardware">
      <button class="icon-btn" id="clearBtn" aria-label="Put every shape away">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.6 6.2A5.6 5.6 0 1 1 2.4 9.6"/><path d="M2.2 2.6v3.8h3.8"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="footer">Math Things <span class="footer-bead"></span> | Math, in your hands <span class="footer-bead"></span></div>
<div id="live" class="sr-only" aria-live="polite"></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// Six solids. "flat" says whether the top is flat enough to hold another shape, upright and lying down.
const SOLIDS = {
  cube:     { name: 'cube', color: 0xDC143C, flat: [true, true],   geo: () => new RoundedBoxGeometry(1, 1, 1, 3, 0.06) },
  box:      { name: 'box', color: 0x4169E1, flat: [true, true],    geo: () => new RoundedBoxGeometry(1.6, 0.8, 0.8, 3, 0.06) },
  sphere:   { name: 'sphere', color: 0xFF9F0A, flat: [false, false], geo: () => new THREE.SphereGeometry(0.55, 48, 32) },
  cylinder: { name: 'cylinder', color: 0x4CBB17, flat: [true, false], geo: () => new THREE.CylinderGeometry(0.45, 0.45, 1.1, 48) },
  cone:     { name: 'cone', color: 0x7B00FF, flat: [false, false], geo: () => new THREE.ConeGeometry(0.55, 1.15, 48) },
  pyramid:  { name: 'pyramid', color: 0x00A3A3, flat: [false, false], geo: () => { const g = new THREE.ConeGeometry(0.75, 1.1, 4); g.rotateY(Math.PI / 4); return g; } },
};
const MAX = 10;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz = n => { if (reduceMotion || !navigator.vibrate) return; try { navigator.vibrate(n); } catch (e) {} };
const $ = id => document.getElementById(id);
const stage = $('stage'), dock = $('dock'), live = $('live');

// ═══════ SCENE ═══════
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NeutralToneMapping;
stage.appendChild(renderer.domElement);
const canvas = renderer.domElement;
canvas.tabIndex = 0; canvas.setAttribute('role', 'application');
canvas.setAttribute('aria-label', 'Solids on a mat. Arrow keys slide the last shape touched; Space tips it over.');
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cfc2, 0.9));
const sun = new THREE.DirectionalLight(0xfff6ea, 1.6);
sun.position.set(-3, 7, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); sun.shadow.bias = -0.0005;
scene.add(sun);
// the ceramic mat is the page itself; the floor here only catches shadows
const mat = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ color: 0x2b2116, opacity: 0.2 }));
mat.rotation.x = -Math.PI / 2; mat.receiveShadow = true; scene.add(mat);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
let HALF = 4;   // half the mat's usable width, set by the screen shape

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // the camera backs off until the mat's width fits the screen
  HALF = Math.max(1.9, Math.min(3.6, 3.2 * w / h));
  const back = Math.max(7, Math.min(14, (HALF + 1) / (Math.tan(19 * Math.PI / 180) * w / h)));
  camera.position.set(0, back * 0.7, back);
  camera.lookAt(0, 0, -0.8);
  camera.updateProjectionMatrix();
  draw();
}

// ═══════ SOLIDS ═══════
const solids = [];
let last = null;
function make(kind, x = 0, z = 0) {
  if (solids.length >= MAX) { buzz([4, 30, 4]); return null; }
  const S = SOLIDS[kind];
  const mesh = new THREE.Mesh(S.geo(), new THREE.MeshPhysicalMaterial({ color: S.color, roughness: 0.35, clearcoat: 0.8, clearcoatRoughness: 0.2 }));
  mesh.castShadow = mesh.receiveShadow = true;
  const s = { kind, mesh, lying: false, x, z, y: 0, spin: new THREE.Quaternion(), roll: new THREE.Quaternion() };
  scene.add(mesh); solids.push(s); pose(s); return s;
}
// orientation: upright, or tipped onto its side; sphere and rolled shapes carry an extra roll
function pose(s) {
  const q = new THREE.Quaternion();
  if (s.lying) q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2);
  s.mesh.quaternion.copy(s.roll).multiply(q).multiply(s.spin);
  s.mesh.position.set(0, 0, 0);
  s.mesh.updateMatrixWorld();
  const box = new THREE.Box3().setFromObject(s.mesh);
  s.h = box.max.y - box.min.y; s.r = Math.max(box.max.x - box.min.x, box.max.z - box.min.z) / 2;
  s.lift = -box.min.y;
  s.mesh.position.set(s.x, s.y + s.lift, s.z);
}
const flatTop = s => SOLIDS[s.kind].flat[s.lying ? 1 : 0] && s.roll.w > 0.999;
const overlaps = (a, b) => Math.hypot(a.x - b.x, a.z - b.z) < (a.r + b.r) * 0.62;

// Every shape rests on the mat or on a flat top beneath it. A shape over a round or pointed top slides off beside it.
function settle(moved) {
  const order = [...solids].sort((a, b) => (a === moved) - (b === moved) || a.y - b.y);
  const placed = [];
  for (const s of order) {
    for (let tries = 0; tries < 6; tries++) {
      const under = placed.filter(p => overlaps(s, p));
      const roundUnder = under.find(p => !flatTop(p));
      if (roundUnder) {
        const dx = s.x - roundUnder.x || 0.01, dz = s.z - roundUnder.z, d = Math.hypot(dx, dz) || 1, need = (s.r + roundUnder.r) * 0.66;
        s.x = roundUnder.x + dx / d * need; s.z = roundUnder.z + dz / d * need;
        if (s === moved) buzz(6);
        continue;
      }
      s.y = under.length ? Math.max(...under.map(p => p.y + p.h)) : 0;
      break;
    }
    s.x = Math.max(-HALF, Math.min(HALF, s.x)); s.z = Math.max(-2.6, Math.min(2.6, s.z));
    s.mesh.position.set(s.x, s.y + s.lift, s.z);
    placed.push(s);
  }
}

// ═══════ POINTER ═══════
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
const toNdc = e => { const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, camera); };
const groundAt = (e, h = 0) => { toNdc(e); ground.constant = -h; return ray.ray.intersectPlane(ground, hit) ? hit.clone() : null; };
let drag = null;
canvas.addEventListener('pointerdown', e => {
  toNdc(e);
  const hits = ray.intersectObjects(solids.map(s => s.mesh));
  if (!hits.length) return;
  e.preventDefault();
  const s = solids.find(o => o.mesh === hits[0].object);
  last = s;
  const p = groundAt(e, s.y);
  drag = { s, id: e.pointerId, moved: false, sx: e.clientX, sy: e.clientY, ox: s.x - p.x, oz: s.z - p.z, px: s.x, pz: s.z };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
  const s = drag.s;
  if (!drag.moved) { drag.moved = true; s.y += 0.25; }
  const p = groundAt(e, s.y);
  if (!p) return;
  const nx = Math.max(-HALF, Math.min(HALF, p.x + drag.ox)), nz = Math.max(-2.6, Math.min(2.6, p.z + drag.oz));
  rollBy(s, nx - s.x, nz - s.z);
  s.x = nx; s.z = nz;
  s.mesh.position.set(s.x, s.y + s.lift, s.z);
  draw();
});
// round shapes turn as they move: a sphere any way, a cylinder on its side only across its length
function rollBy(s, dx, dz) {
  if (s.kind === 'sphere') {
    const d = Math.hypot(dx, dz); if (d < 1e-6) return;
    s.roll.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(dz, 0, -dx).normalize(), d / s.r));
    s.roll.normalize(); pose(s);
  } else if (s.kind === 'cylinder' && s.lying) {
    s.spin.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -dz / 0.45));
    pose(s);
  }
}
const end = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  const r = dock.getBoundingClientRect();
  if (d.moved && e.clientY >= r.top && e.clientX >= r.left && e.clientX <= r.right) { remove(d.s); return; }
  if (!d.moved) tip(d.s);
  else { d.s.y = Math.max(0, d.s.y - 0.25); settle(d.s); buzz(4); }
  draw();
  live.textContent = `The ${SOLIDS[d.s.kind].name}${d.s.y > 0.01 ? ' is stacked' : ''}${d.s.lying ? ', on its side' : ''}.`;
};
canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);

// a tap tips a shape onto its side, or stands it back up (a sphere just turns)
function tip(s) {
  if (s.kind === 'sphere') { rollBy(s, 0.4, 0.2); draw(); return; }
  s.lying = !s.lying; s.spin.identity();
  if (s.kind !== 'sphere') s.roll.identity();
  pose(s); settle(s); buzz(8);
  if (!reduceMotion) { const y0 = s.mesh.position.y; const t0 = performance.now(); const hop = () => { const t = (performance.now() - t0) / 220; s.mesh.position.y = y0 + Math.sin(Math.min(1, t) * Math.PI) * 0.25; draw(); if (t < 1) requestAnimationFrame(hop); }; hop(); }
}
function remove(s) {
  scene.remove(s.mesh); solids.splice(solids.indexOf(s), 1);
  if (last === s) last = null;
  settle(); buzz(6); draw();
}

// ═══════ KEYBOARD ═══════
canvas.addEventListener('keydown', e => {
  const s = last || solids[solids.length - 1]; if (!s) return;
  const mv = { ArrowLeft: [-0.25, 0], ArrowRight: [0.25, 0], ArrowUp: [0, -0.25], ArrowDown: [0, 0.25] }[e.key];
  if (mv) { e.preventDefault(); rollBy(s, mv[0], mv[1]); s.x += mv[0]; s.z += mv[1]; s.y = 0.5 + s.y; settle(s); draw(); }
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tip(s); draw(); }
  else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); remove(s); }
});

// ═══════ CABINET ═══════
const bins = $('bins');
const ART = {
  cube: '<path d="M10 14l12-6 12 6v14l-12 6-12-6z" fill="#DC143C"/><path d="M10 14l12 6 12-6M22 20v14" stroke="#fff" stroke-opacity=".5" fill="none"/>',
  box: '<path d="M4 16l10-5 26 0-10 5z" fill="#6D8CF0"/><path d="M4 16h26v12H4z" fill="#4169E1"/><path d="M30 16l10-5v12l-10 5z" fill="#2F51B8"/>',
  sphere: '<circle cx="22" cy="20" r="12" fill="#FF9F0A"/><circle cx="18" cy="15" r="4" fill="#fff" fill-opacity=".45"/>',
  cylinder: '<path d="M12 10v18a10 4 0 0 0 20 0V10" fill="#4CBB17"/><ellipse cx="22" cy="10" rx="10" ry="4" fill="#7BDB4E"/>',
  cone: '<path d="M22 6L11 28a11 4 0 0 0 22 0z" fill="#7B00FF"/><ellipse cx="22" cy="28" rx="11" ry="4" fill="#5E00C4" fill-opacity=".5"/>',
  pyramid: '<path d="M22 6L8 28l14 4z" fill="#00A3A3"/><path d="M22 6l14 22-14 4z" fill="#007A7A"/>',
};
for (const kind of Object.keys(SOLIDS)) {
  const b = document.createElement('button');
  b.className = 'bin'; b.setAttribute('aria-label', `Add a ${SOLIDS[kind].name}`);
  b.innerHTML = `<svg viewBox="0 0 44 38" aria-hidden="true">${ART[kind]}</svg>`;
  b.addEventListener('click', () => {
    // a new shape lands in the first open spot along the front of the mat
    const spots = [0, -1.8, 1.8, -3.6, 3.6, -5.4, 5.4].flatMap(x => [[x, 1.2], [x, -0.8]]).filter(([x]) => Math.abs(x) <= HALF);
    const spot = spots.find(([x, z]) => solids.every(o => Math.hypot(o.x - x, o.z - z) > 1.3)) || [0, 0];
    const s = make(kind, spot[0], spot[1]);
    if (s) { last = s; settle(s); buzz(8); draw(); live.textContent = `A ${SOLIDS[kind].name}.`; }
  });
  bins.appendChild(b);
}
$('clearBtn').addEventListener('click', () => { while (solids.length) remove(solids[0]); });

// ═══════ RENDER ═══════
let frame = 0;
function draw() { cancelAnimationFrame(frame); frame = requestAnimationFrame(() => renderer.render(scene, camera)); }
addEventListener('resize', resize);
addEventListener('contextmenu', e => e.preventDefault());
resize();
for (const [k, x, z] of [['cube', -1.8, 0.6], ['cylinder', 0, 0.6], ['cone', 1.8, 0.6]]) settle(make(k, x, z));
draw();
window.__solids = { solids, camera };   // read by the screen tests
</script>
<script src="../../math-things-home.js"></script>
</body>
</html>
