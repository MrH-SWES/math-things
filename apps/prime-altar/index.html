<script>
'use strict';
// ════════════════════════════════════════
// UTILS
// ════════════════════════════════════════
const $id = id => document.getElementById(id);
const isPrime = n => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
const allFactors = n => { const f = [1]; for (let i = 2; i <= n; i++) if (n % i === 0) f.push(i); return f; };
const properFactors = n => { const f = []; for (let i = 2; i < n; i++) if (n % i === 0) f.push(i); return f; };
const getPrimeFactors = n => { const f = []; let x = n; for (let p = 2; p * p <= x; p++) { while (x % p === 0) { f.push(p); x /= p; } } if (x > 1) f.push(x); return f; };
const haptic = p => { try { navigator.vibrate?.(p); } catch (e) {} };
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const lerp = (a, b, t) => a + (b - a) * t;
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ════════════════════════════════════════
// MOTION — tiny rAF tween engine (the only physics dependency)
// ════════════════════════════════════════
const EASES = {
  linear: t => t,
  p2out: t => 1 - (1 - t) * (1 - t),
  p2inout: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  p3out: t => 1 - Math.pow(1 - t, 3),
  heavy: t => 1 - Math.pow(1 - t, 2.4),
  backout: t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  bounceout: t => {
    const n1 = 7.5625, d1 = 2.75;
    if (t < 1 / d1) return n1 * t * t;
    if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
    if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
    return n1 * (t -= 2.625 / d1) * t + 0.984375;
  },
  elasticout: t => { const c4 = (2 * Math.PI) / 3; return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1; },
};

function tween(opts) {
  const dur = Math.max(1, (opts.dur ?? 600) * (REDUCED ? 0.45 : 1));
  const delay = (opts.delay ?? 0) * (REDUCED ? 0.45 : 1);
  const ez = typeof opts.ease === 'function' ? opts.ease : (EASES[opts.ease] || EASES.p2inout);
  const h = { done: false, cancel() { h.done = true; } };
  const begin = () => {
    if (h.done) return;
    opts.start && opts.start();
    const t0 = performance.now();
    const step = now => {
      if (h.done) return;
      const p = Math.min(1, (now - t0) / dur);
      opts.update && opts.update(ez(p), p);
      if (p < 1) requestAnimationFrame(step);
      else { h.done = true; opts.done && opts.done(); }
    };
    requestAnimationFrame(step);
  };
  if (delay > 0) { const to = setTimeout(begin, delay); const c = h.cancel; h.cancel = () => { clearTimeout(to); c(); }; }
  else begin();
  return h;
}
const after = (ms, fn) => setTimeout(fn, REDUCED ? ms * 0.45 : ms);

// ════════════════════════════════════════
// STATE + PERSISTENCE
// ════════════════════════════════════════
const S = {
  primeDex: new Set(), maxLevel: 1,
  fDone: new Set([1]), fNum: null, fDisc: new Set(), fDiscMap: {},
  segs: [], unitH: 44, unitW: 44, folding: false,
  foldDir: -1, segSize: 0,
  handleTimer: null, hingeIdleTimer: null, handleIndex: 0, handleInverted: false,
  gridMode: 'factor', bDone: new Set([1]), bNum: null, bStack: [], bProduct: 0, bAnimating: false,
  fZoom: 1, bZoom: 1, currentZoom: { fa: 1, ba: 1 },
  trayIdentityReady: true,
  _deferredRoomCelebration: null,
  _settleTw: null,
};

const SAVE_KEY = 'math-things-prime-altar-v2';
function saveState() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      primeDex: [...S.primeDex], fDone: [...S.fDone], bDone: [...S.bDone], maxLevel: S.maxLevel,
      fDiscMap: Object.fromEntries(Object.entries(S.fDiscMap).map(([k, v]) => [k, [...v]])),
    }));
  } catch (e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    S.primeDex = new Set(d.primeDex || []);
    S.fDone = new Set(d.fDone || [1]); S.fDone.add(1);
    S.bDone = new Set(d.bDone || [1]); S.bDone.add(1);
    S.maxLevel = d.maxLevel || 1;
    S.fDiscMap = {};
    Object.entries(d.fDiscMap || {}).forEach(([k, v]) => { S.fDiscMap[k] = new Set(v); });
  } catch (e) {}
}
function resetProgress() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  S.primeDex = new Set(); S.fDone = new Set([1]); S.bDone = new Set([1]);
  S.maxLevel = 1; S.fDiscMap = {};
  renderGrid(); buildDex('grid-vp');
}

// ════════════════════════════════════════
// ROOM LAYOUT — one deterministic source of truth
// ════════════════════════════════════════
function layoutRoom(roomId) {
  const altar = $id(roomId);
  if (!altar) return;
  const h = altar.clientHeight || 400;
  const obBase = Math.round(clamp(h * 0.32, 110, 300));
  const trayTop = Math.round(clamp(h * 0.1, 44, 84));
  altar.style.setProperty('--ob-base', obBase + 'px');
  altar.style.setProperty('--tray-top', trayTop + 'px');
}
function obeliskBase(roomId) {
  const altar = $id(roomId);
  return parseFloat(getComputedStyle(altar).getPropertyValue('--ob-base')) || 200;
}
function availHeight(roomId) {
  const altar = $id(roomId);
  const headroom = 88; /* keep the tip clear of the header numeral */
  return Math.max(80, (altar.clientHeight || 400) - obeliskBase(roomId) - headroom);
}
function setZoomImmediate(roomId, z) {
  S.currentZoom[roomId] = z;
  const el = roomId === 'fa' ? $id('fz') : $id('bz');
  if (el) el.style.transform = `scale(${z})`;
}
function zoomTo(roomId, z, opts = {}) {
  const from = S.currentZoom[roomId];
  return tween({ dur: opts.dur ?? 500, ease: opts.ease ?? 'p2out', delay: opts.delay ?? 0,
    update: e => setZoomImmediate(roomId, lerp(from, z, e)), done: opts.done });
}
function fitTrinketSize(count) {
  const trayW = Math.min(window.innerWidth * 0.86, 560) - 16;
  const n = Math.max(4, count);
  return clamp(Math.floor((trayW - (n - 1) * 6) / n), 22, 46);
}
function syncCSSUnit() {
  const u = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 44;
  S.unitH = u; S.unitW = u;
}

// ════════════════════════════════════════
// BLOCK + TRINKET FACTORIES
// ════════════════════════════════════════
function makeBlock(units, w, h, forceComposite = false, omitNumeral = false) {
  const isGlass = units === 1 && !forceComposite;
  const p = !forceComposite && !isGlass && isPrime(units);
  const el = document.createElement('div');
  el.className = 'blk ' + (isGlass ? 'blk-m glass-cube' : p ? 'blk-p' : 'blk-c');
  el.style.width = 'var(--u)';
  el.style.height = `calc(var(--u) * ${units})`;
  el.dataset.units = units;
  if (omitNumeral) return el;
  const num = document.createElement('div');
  if (isGlass) { num.className = 'n-mirror'; num.textContent = '1'; num.style.fontSize = Math.min(w * 0.55, h * 0.4, 34) + 'px'; }
  else if (p)  { num.className = 'n-glow';   num.textContent = units; num.style.fontSize = Math.min(w * 0.6, h * 0.45, 38) + 'px'; }
  else         { num.className = 'n-stamp';  num.textContent = units; num.style.fontSize = Math.min(w * 0.55, h * 0.4, 34) + 'px'; }
  el.appendChild(num);
  return el;
}

/* anim-overlay piece: real material, loops disabled */
function makeAnimBlock(units, w, h, matClass, withNumeral = true) {
  const cls = matClass || (units === 1 ? 'blk-m glass-cube' : isPrime(units) ? 'blk-p' : 'blk-c');
  const el = document.createElement('div');
  el.className = 'blk lite ' + cls;
  el.style.width = 'var(--u)';
  el.style.height = `calc(var(--u) * ${units})`;
  el.dataset.units = units;
  if (withNumeral) {
    const num = document.createElement('div');
    if (cls.includes('glass-cube')) { num.className = 'n-mirror'; num.textContent = '1'; num.style.fontSize = Math.min(w * 0.55, h * 0.4, 34) + 'px'; }
    else if (cls.includes('blk-p')) { num.className = 'n-glow'; num.textContent = units; num.style.fontSize = Math.min(w * 0.6, h * 0.45, 38) + 'px'; }
    else { num.className = 'n-stamp'; num.textContent = units; num.style.fontSize = Math.min(w * 0.55, h * 0.4, 34) + 'px'; }
    el.appendChild(num);
  }
  return el;
}

/** A prime, captured: a numbered mirror in a machined bezel. sizePx sets tile + type scale. */
function makeMirror(p, sizePx) {
  const m = document.createElement('div');
  m.className = 'mirror-trinket';
  if (sizePx) { m.style.width = sizePx + 'px'; m.style.height = sizePx + 'px'; m.style.fontSize = sizePx + 'px'; }
  const n = document.createElement('span'); n.className = 'mt-num'; n.textContent = p;
  const r = document.createElement('span'); r.className = 'mt-refl'; r.textContent = p;
  m.append(n, r);
  return m;
}

/** Vertical stack of glass "1" cells share one tall reflection (see .glass-cube background-size). */
function applyGlassReflectY(el, indexInStack, stackTotal) {
  if (!el || !el.classList.contains('glass-cube')) return;
  if (!stackTotal || stackTotal <= 1) el.style.setProperty('--reflect-y', '52%');
  else el.style.setProperty('--reflect-y', `${100 - (indexInStack / (stackTotal - 1)) * 100}%`);
}

// ════════════════════════════════════════
// IDLE HINTS
// ════════════════════════════════════════
const OBELISK_IDLE_HINT_MS = 3000;
function clearObeliskIdleHints() {
  clearTimeout(S.handleTimer); S.handleTimer = null;
  clearTimeout(S.hingeIdleTimer); S.hingeIdleTimer = null;
}
function scheduleObeliskIdleHints() {
  if (!S.fNum || S.folding) return;
  const stage = $id('fo');
  if (!stage) return;
  const isSolved = S.fDone.has(S.fNum);
  const numSegs = S.segs.length;
  clearObeliskIdleHints();
  if (isSolved) return;
  if (numSegs > 1) {
    S.handleTimer = setTimeout(() => {
      S.handleTimer = null;
      if (S.folding || S.segs.length <= 1 || S.fDone.has(S.fNum)) return;
      const blocks = $id('fo').querySelectorAll('.blk');
      const el = blocks[S.handleIndex];
      if (el && !el.querySelector('.drag-hint-bar')) {
        const hint = document.createElement('div');
        hint.className = 'drag-hint-bar';
        if (S.handleInverted) { hint.style.top = 'auto'; hint.style.bottom = '0'; hint.style.borderRadius = '0 0 2px 2px'; }
        el.appendChild(hint);
      }
    }, OBELISK_IDLE_HINT_MS);
  } else if (numSegs === 1 && stage.querySelector('.hz')) {
    S.hingeIdleTimer = setTimeout(() => {
      S.hingeIdleTimer = null;
      if (S.folding || S.segs.length !== 1 || S.fDone.has(S.fNum)) return;
      $id('fo')?.querySelectorAll('.hz').forEach(z => z.classList.add('nudge'));
    }, OBELISK_IDLE_HINT_MS);
  }
}
function bindAltarIdleHintReset(el) {
  if (!el || el._obeliskIdleBound) return;
  el._obeliskIdleBound = true;
  el.addEventListener('pointerdown', () => {
    clearObeliskIdleHints();
    queueMicrotask(() => scheduleObeliskIdleHints());
  }, true);
}

// ════════════════════════════════════════
// CELEBRATIONS
// ════════════════════════════════════════
function showAffirm() {
  const e = $id('affirm');
  e.classList.add('show'); haptic([20, 25, 20, 25, 40]);
  setTimeout(() => e.classList.remove('show'), 350);
}
function runAltarRoomSolvedVision(opts) {
  opts = opts || {};
  const numEl = $id('altar-numeral');
  if (!numEl) return;
  after(300, () => {
    showAffirm();
    if (opts.wasAlreadySolved) numEl.classList.remove('solved');
    numEl.classList.add('celebrate');
    haptic([20, 25, 20, 25, 40]);
    after(1400, () => {
      numEl.classList.remove('celebrate');
      numEl.classList.add('solved');
      numEl.onclick = () => goToGrid();
    });
  });
}
function flushDeferredRoomCelebration() {
  const fn = S._deferredRoomCelebration;
  S._deferredRoomCelebration = null;
  if (typeof fn === 'function') fn();
}
/* heavy thud when pieces land */
function thud(roomId) {
  const zoomEl = roomId === 'fa' ? $id('fz') : $id('bz');
  if (!zoomEl) return;
  const z = S.currentZoom[roomId];
  tween({ dur: 260, ease: 'elasticout', update: e => {
    const dip = Math.sin(e * Math.PI) * 3;
    zoomEl.style.transform = `translateY(${(1 - e) * dip}px) scale(${z})`;
  }, done: () => { zoomEl.style.transform = `scale(${S.currentZoom[roomId]})`; } });
}

// ════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════
function goToAltar(n) {
  const overlay = $id('fade-overlay');
  overlay.classList.add('fading');
  setTimeout(() => {
    $id('grid-screen').classList.add('hidden');
    $id('build-screen').classList.add('hidden');
    $id('altar-screen').classList.remove('hidden');
    layoutRoom('fa');
    enterAltar(n);
    overlay.classList.remove('fading');
  }, 400);
}
function goToBuild(n) {
  const overlay = $id('fade-overlay');
  overlay.classList.add('fading');
  setTimeout(() => {
    $id('grid-screen').classList.add('hidden');
    $id('altar-screen').classList.add('hidden');
    $id('build-screen').classList.remove('hidden');
    layoutRoom('ba');
    enterBuild(n);
    overlay.classList.remove('fading');
  }, 400);
}
function goToGrid() {
  const overlay = $id('fade-overlay');
  overlay.classList.add('fading');
  setTimeout(() => {
    $id('altar-screen').classList.add('hidden');
    $id('build-screen').classList.add('hidden');
    $id('grid-screen').classList.remove('hidden');
    renderGrid();
    buildDex('grid-vp');
    overlay.classList.remove('fading');
  }, 400);
}

$id('gmt-factor').addEventListener('click', () => {
  S.gridMode = 'factor';
  $id('gmt-factor').classList.add('active');
  $id('gmt-build').classList.remove('active');
  renderGrid();
});
$id('gmt-build').addEventListener('click', () => {
  S.gridMode = 'build';
  $id('gmt-build').classList.add('active');
  $id('gmt-factor').classList.remove('active');
  renderGrid();
});
$id('reset-btn').addEventListener('click', () => {
  if (window.confirm('Reset all Prime Altar progress?')) resetProgress();
});

// ════════════════════════════════════════
// GRID SCREEN
// ════════════════════════════════════════
function makeGridChip(f) {
  if (f !== 1 && isPrime(f)) {
    const t = makeMirror(f);
    t.classList.add('nc-t');
    t.style.fontSize = '24px';
    return t;
  }
  const t = document.createElement('div');
  t.className = 'nc-t ' + (f === 1 ? 'nc-tm' : 'nc-tc');
  t.textContent = f;
  return t;
}
function makeCellSolved(n, factors, clickFn) {
  const c = document.createElement('div'); c.className = 'nc done';
  const num = document.createElement('div'); num.className = 'nc-num'; num.textContent = n; c.appendChild(num);
  if (factors.length > 0) {
    const wrap = document.createElement('div'); wrap.className = 'nc-trinkets';
    factors.slice(0, 12).forEach(f => wrap.appendChild(makeGridChip(f)));
    if (factors.length > 12) { const ov = document.createElement('div'); ov.className = 'nc-overflow'; ov.textContent = '+'; wrap.appendChild(ov); }
    c.appendChild(wrap);
  }
  if (clickFn) c.addEventListener('click', clickFn);
  return c;
}
function renderGrid() {
  const g = $id('num-grid'); g.innerHTML = '';
  const max = S.maxLevel * 12;
  const addPlain = (i, cls, clickFn) => {
    const c = document.createElement('div'); c.className = 'nc ' + cls;
    const num = document.createElement('div'); num.className = 'nc-num'; num.textContent = i; c.appendChild(num);
    if (clickFn) c.addEventListener('click', clickFn);
    g.appendChild(c);
    return c;
  };
  if (S.gridMode === 'factor') {
    for (let i = 1; i <= max; i++) {
      if (S.fDone.has(i)) g.appendChild(makeCellSolved(i, allFactors(i), () => goToAltar(i)));
      else addPlain(i, 'avail', () => goToAltar(i));
    }
    for (let i = max + 1; i <= max + 12; i++) addPlain(i, 'locked');
  } else {
    for (let i = 1; i <= max; i++) {
      const canBuild = i === 1 || S.bDone.has(i) || (i > 1 && S.bDone.has(i - 1));
      const built = S.bDone.has(i);
      const neededPrimes = i > 1 ? getPrimeFactors(i) : [];
      const hasAllPrimes = neededPrimes.every(p => S.primeDex.has(p));
      if (built || i === 1) g.appendChild(makeCellSolved(i, i === 1 ? [1] : getPrimeFactors(i), i > 1 ? () => goToBuild(i) : null));
      else if (canBuild && hasAllPrimes) addPlain(i, 'avail', () => goToBuild(i));
      else addPlain(i, 'locked');
    }
    for (let i = max + 1; i <= max + 12; i++) addPlain(i, 'locked');
  }
}

// ════════════════════════════════════════
// PRIME DEX
// ════════════════════════════════════════
function buildDex(vpId = 'altar-dex-vp') {
  const vp = $id(vpId);
  if (!vp) return;
  vp.innerHTML = '';
  for (let i = 1; i <= 144; i++) {
    const slot = document.createElement('div');
    slot.className = 'dex-slot';
    slot.dataset.n = i;
    const wrap = document.createElement('div'); wrap.className = 'dex-trinket-wrap';
    if (i === 1) {
      slot.classList.add('has-prime');
      const g = document.createElement('div'); g.className = 'dex-glass glass-cube';
      g.style.setProperty('--reflect-y', '52%');
      const num = document.createElement('div'); num.className = 'n-mirror'; num.textContent = '1';
      g.appendChild(num); wrap.appendChild(g);
    } else if (isPrime(i) && S.primeDex.has(i)) {
      slot.classList.add('has-prime');
      const t = makeMirror(i, 36);
      t.classList.add('dex-mirror');
      wrap.appendChild(t);
    }
    slot.appendChild(wrap);
    const lbl = document.createElement('div'); lbl.className = 'dex-num'; lbl.textContent = i;
    slot.appendChild(lbl);
    vp.appendChild(slot);
  }
  vp.scrollLeft = 0;
  if (!vp._scrollBound) {
    vp._scrollBound = true;
    vp.addEventListener('scroll', () => { if (vp.scrollLeft < 0) vp.scrollLeft = 0; }, { passive: true });
  }
}
function scrollDexToSlot(n, vpId, cb) {
  const vp = $id(vpId);
  const container = vp?.closest('.dex-container');
  if (!vp || !container) { cb && cb(); return; }
  const slotW = 46 + 10;
  const targetScroll = n * slotW - container.clientWidth / 2 + slotW / 2;
  vp.scrollTo({ left: Math.max(0, targetScroll), behavior: 'smooth' });
  setTimeout(() => { cb && cb(); }, 500);
}

// ════════════════════════════════════════
// THE TWIN CEREMONY — an ignited prime cools into a mirror and drops to the dex
// ════════════════════════════════════════
function launchTrinketDrop(primeN, segCount, onDone) {
  const inBuild = S.gridMode === 'build' && !$id('build-screen').classList.contains('hidden');
  const vpId = inBuild ? 'build-dex-vp' : 'altar-dex-vp';
  const stage = $id(inBuild ? 'bo' : 'fo');
  const vp = $id(vpId);
  if (!stage || !vp) { onDone && onDone(); return; }

  const segEls = Array.from(stage.querySelectorAll('.blk'));
  let srcEl = null;
  if (segCount <= 1) srcEl = segEls[0];
  else if (segCount % 2 === 1) srcEl = segEls[Math.floor(segCount / 2)];
  else srcEl = segEls[segCount / 2 - 1];
  if (!srcEl) { onDone && onDone(); return; }

  // 1. Ignition
  if (!srcEl.classList.contains('blk-p')) {
    srcEl.classList.remove('blk-c', 'blk-m', 'glass-cube');
    srcEl.classList.add('blk-p');
    const oldStamp = srcEl.querySelector('.n-stamp, .n-mirror');
    if (oldStamp) oldStamp.className = 'n-glow';
  }

  // 2. The twin emerges — ember shell around a mirror core
  const srcRect = srcEl.getBoundingClientRect();
  const srcW = srcRect.width, srcH = srcRect.height;
  const srcCX = srcRect.left + srcW / 2, srcCY = srcRect.top + srcH / 2;
  const tw = 36, th = 36;

  const clone = document.createElement('div');
  clone.className = 'twin-clone';
  clone.style.cssText = `width:${srcW}px;height:${srcH}px;left:${srcRect.left}px;top:${srcRect.top}px;`;
  const emberLayer = document.createElement('div');
  emberLayer.className = 'cl-layer blk-p lite';
  emberLayer.style.borderRadius = '5px';
  const mirrorLayer = makeMirror(primeN, Math.max(srcW, 36));
  mirrorLayer.classList.add('cl-layer');
  mirrorLayer.style.width = '100%'; mirrorLayer.style.height = '100%';
  mirrorLayer.style.opacity = '0';
  const numEl = document.createElement('div');
  numEl.className = 'cl-num';
  numEl.textContent = primeN;
  numEl.style.fontSize = Math.min(srcW * 0.6, srcH * 0.45, 38) + 'px';
  numEl.style.color = '#fff';
  numEl.style.textShadow = '0 0 2px rgba(255,255,255,0.95), 0 0 8px rgba(255,255,255,0.9), 0 0 18px rgba(255,200,110,0.6)';
  clone.append(emberLayer, mirrorLayer, numEl);
  document.body.appendChild(clone);

  vp.querySelectorAll('.dex-slot[data-n]').forEach(sl => {
    sl.classList.toggle('dimmed', parseInt(sl.dataset.n) !== primeN);
  });
  scrollDexToSlot(primeN, vpId, null);

  // 3. Compression + cooling (ember → silvered glass)
  const compressDur = 620;
  const scaleX = tw / srcW, scaleY = th / srcH;
  tween({ dur: compressDur, ease: 'p2inout',
    update: e => {
      clone.style.transform = `scaleX(${lerp(1, scaleX, e)}) scaleY(${lerp(1, scaleY, e)})`;
      emberLayer.style.opacity = String(1 - e);
      mirrorLayer.style.opacity = String(e);
      numEl.style.opacity = String(1 - e);
    },
    done: () => {
      // 4. The float down to its socket
      after(140, () => {
        const slot = vp.querySelector(`.dex-slot[data-n="${primeN}"]`);
        const container = vp.closest('.dex-container');
        const dexRect = container.getBoundingClientRect();
        let landX = dexRect.left + dexRect.width / 2;
        let landY = dexRect.top + dexRect.height / 2;
        if (slot) {
          const r = slot.getBoundingClientRect();
          landX = r.left + r.width / 2; landY = r.top + r.height / 2;
        }
        const dropDur = 420;
        const dx = landX - srcCX, dy = landY - srcCY;
        tween({ dur: dropDur, ease: 'p2inout',
          update: e => {
            clone.style.transform = `translate(${dx * e}px, ${dy * e}px) scaleX(${scaleX}) scaleY(${scaleY})`;
          },
          done: () => {
            // 5. Registration
            haptic([15, 10, 40]);
            clone.remove();
            S.primeDex.add(primeN);
            saveState();
            buildDex(vpId);
            const targetSlot = vp.querySelector(`.dex-slot[data-n="${primeN}"]`);
            if (targetSlot) targetSlot.classList.add('land-flash');
            setTimeout(() => scrollDexToSlot(primeN, vpId, null), 50);
            after(800, () => {
              vp.querySelectorAll('.dex-slot').forEach(sl => sl.classList.remove('dimmed'));
              onDone && onDone();
            });
          } });
      });
    } });
}

// ════════════════════════════════════════
// FACTOR ALTAR
// ════════════════════════════════════════
function enterAltar(n) {
  syncCSSUnit();
  layoutRoom('fa');
  S.fNum = n; S.segSize = 0; S.handleIndex = 0; S.handleInverted = false;
  S.fDisc = S.fDiscMap[n] ? new Set(S.fDiscMap[n]) : new Set([1, n]);
  S.trayIdentityReady = n === 1; /* primes: defer identity chip until after the grow reveal */
  S._deferredRoomCelebration = null;
  S._settleTw?.cancel();
  const numEl = $id('altar-numeral');
  numEl.textContent = n;
  numEl.classList.remove('solved', 'celebrate');

  const presolvedOnEnter = (n === 1 || isPrime(n));
  if (presolvedOnEnter) { S.fDone.add(n); saveState(); }
  const isSolved = S.fDone.has(n);
  if (isSolved) numEl.classList.add('solved');
  numEl.onclick = isSolved ? () => goToGrid() : null;

  bindAltarIdleHintReset($id('altar-screen'));
  const avail = availHeight('fa');
  const neededHeight = n * S.unitH;
  S.fZoom = Math.min(1, avail / neededHeight);
  S.segs = [{ units: n }];
  buildDex('altar-dex-vp');
  renderFT();

  growFromUnits(n, () => {
    if (isPrime(n)) {
      const isNew = !S.primeDex.has(n);
      if (isNew) {
        renderSegs();
        launchTrinketDrop(n, 1, () => {
          S.trayIdentityReady = true;
          renderFT();
          runAltarRoomSolvedVision({ wasAlreadySolved: true });
        });
      } else {
        S.trayIdentityReady = true;
        renderSegs(); renderFT();
        runAltarRoomSolvedVision({ wasAlreadySolved: true });
      }
    } else {
      if (n > 1) S.trayIdentityReady = true;
      renderSegs(); renderFT();
    }
  });
}

/* Count in: n glass units stack up, flash, fuse into the numbered monolith. */
function growFromUnits(n, onComplete) {
  const stage = $id('fo');
  stage.innerHTML = '';
  stage.style.visibility = 'visible';
  stage.style.width = S.unitW + 'px';
  stage.style.marginLeft = `${-S.unitW / 2}px`;
  stage.classList.add('obelisk-pillar');
  stage.classList.remove('seg-array');
  setZoomImmediate('fa', S.fZoom);

  const uH = S.unitH, uW = S.unitW;
  const blocks = [];
  for (let i = 0; i < n; i++) {
    const blk = makeBlock(1, uW, uH, false, false);
    applyGlassReflectY(blk, i, n);
    blk.style.position = 'absolute';
    blk.style.bottom = `${i * uH}px`;
    blk.style.left = '0';
    blk.style.transform = 'scale(0)';
    stage.appendChild(blk);
    blocks.push(blk);
  }

  const stag = Math.min(150, 1500 / Math.max(1, n));
  haptic(15);
  blocks.forEach((blk, i) => {
    tween({ delay: i * stag, dur: 480, ease: 'backout',
      start: () => haptic(6),
      update: e => { blk.style.transform = `scale(${e})`; },
      done: i === n - 1 ? () => {
        const isP = isPrime(n);
        const flash = document.createElement('div');
        flash.style.cssText = `position:absolute; bottom:0; left:0; width:${uW}px; height:${n * uH}px; z-index:100; opacity:0; border-radius:4px; pointer-events:none;` +
          (isP ? 'background:#FF8C00; box-shadow:0 0 60px 20px rgba(255,215,0,0.8);'
               : 'background:#ffffff; box-shadow:0 0 50px 20px rgba(255,255,255,0.9);');
        stage.appendChild(flash);
        haptic([40, 60]);
        tween({ dur: 320, ease: 'p2inout',
          update: e => { flash.style.opacity = String(Math.sin(e * Math.PI)); },
          done: () => { flash.remove(); onComplete(); } });
      } : null });
  });
}

/* zoom that keeps the whole fold sweep in frame */
function calcSweepZoom(numPieces, segUnits) {
  const altarW = $id('fa').clientWidth;
  const avail = availHeight('fa');
  const zoomW = (altarW * 0.46) / (numPieces * S.unitW);
  const zoomH = avail / (segUnits * S.unitH);
  return Math.min(zoomW, zoomH, S.fZoom);
}
/* camera-settle zoom once the array has landed */
function postFoldZoom(numSegs, segUnits) {
  if (numSegs <= 1) return S.fZoom;
  const altarW = $id('fa').clientWidth;
  const avail = availHeight('fa');
  return Math.min((altarW * 0.72) / (numSegs * S.unitW), (avail * 0.92) / (segUnits * S.unitH), 1.5);
}
/* which side the accordion lands on (verified analytically — no DOM measuring) */
function foldLandsLeft(numPieces) {
  const falls = numPieces - 1;
  return (falls % 2 === 1) ? (S.foldDir < 0) : (S.foldDir > 0);
}

function renderSegs(opts = {}) {
  clearObeliskIdleHints();
  const stage = $id('fo');
  stage.innerHTML = '';
  if (S.segs.length === 0) return;

  const uH = S.unitH, uW = S.unitW, numSegs = S.segs.length;
  const arrayW = numSegs * uW;
  stage.style.visibility = 'visible';
  stage.style.width = arrayW + 'px';
  stage.classList.toggle('obelisk-pillar', numSegs === 1);
  stage.classList.toggle('seg-array', numSegs > 1);

  const canonicalMargin = -arrayW / 2;
  const canonicalZoom = numSegs === 1 ? S.fZoom : postFoldZoom(numSegs, S.segs[0].units);
  stage.style.setProperty('--hzs', String(clamp(0.9 / canonicalZoom, 1, 2.6)));

  const isSolved = S.fDone.has(S.fNum);
  const glassCount = S.segs.filter(s => s.units === 1).length;

  S.segs.forEach((seg, i) => {
    const h = seg.units * uH;
    const el = makeBlock(seg.units, uW, h);
    el.classList.toggle('blk-pillar', numSegs === 1);
    if (el.classList.contains('glass-cube')) {
      const idxAmongOnes = S.segs.slice(0, i + 1).filter(s => s.units === 1).length - 1;
      applyGlassReflectY(el, idxAmongOnes, glassCount);
    }
    if (numSegs === 1) {
      if (!isPrime(seg.units) && seg.units > 1) {
        properFactors(seg.units).forEach(f => {
          const zone = document.createElement('div');
          zone.className = 'hz';
          zone.style.top = (f * uH) + 'px';
          zone.addEventListener('pointerdown', e => { e.stopPropagation(); zone.classList.remove('nudge'); });
          zone.addEventListener('pointerup', e => { e.stopPropagation(); doFold(f, -1, zone); });
          el.appendChild(zone);
        });
      }
    } else if (i === S.handleIndex) {
      el.addEventListener('pointerdown', e => {
        el.querySelector('.drag-hint-bar')?.remove();
        if (!S.folding) { e.preventDefault(); haptic(12); beginUnspool(); }
      });
    }
    stage.appendChild(el);
  });

  if (opts.fromMargin != null) {
    /* piece(s) start where the physics left them, then the camera settles them home */
    stage.style.marginLeft = opts.fromMargin + 'px';
    const fromZoom = opts.fromZoom ?? S.currentZoom.fa;
    S._settleTw?.cancel();
    S._settleTw = tween({ delay: opts.settleDelay ?? 240, dur: 760, ease: 'p3out',
      update: e => {
        stage.style.marginLeft = lerp(opts.fromMargin, canonicalMargin, e) + 'px';
        setZoomImmediate('fa', lerp(fromZoom, canonicalZoom, e));
      } });
  } else {
    stage.style.marginLeft = canonicalMargin + 'px';
    setZoomImmediate('fa', canonicalZoom);
  }
  scheduleObeliskIdleHints();
}

// ════════════════════════════════════════
// FOLD PHYSICS — nested hinge tree, accordion cascade
// ════════════════════════════════════════
function buildNestTree(numPieces, segH, uW, foldDir, startFolded) {
  const hinges = [];
  const pieceUnits = S.segSize || S.fNum;
  function build(level) {
    const container = document.createElement('div');
    container.style.cssText = `position:absolute;bottom:0;left:0;width:${uW}px;height:0;`;
    const blk = makeAnimBlock(pieceUnits, uW, segH);
    blk.style.position = 'absolute';
    blk.style.bottom = '0';
    blk.style.left = '0';
    container.appendChild(blk);
    if (level < numPieces - 1) {
      const hw = document.createElement('div');
      const depth = numPieces - 1 - level;
      const dir = depth % 2 === 0 ? -foldDir : foldDir;
      const origin = dir < 0 ? '0% 100%' : '100% 100%';
      const rot = dir < 0 ? -180 : 180;
      hw.style.cssText = `position:absolute;bottom:${segH}px;left:0;width:${uW}px;height:0;transform-origin:${origin};`;
      if (startFolded) hw.style.transform = `rotate(${rot}deg)`;
      const child = build(level + 1);
      hw.appendChild(child);
      container.appendChild(hw);
      hinges.push({ hw, rot, dir, depth });
    }
    return container;
  }
  return { root: build(0), hinges };
}

function doFold(f, swipeSide, clickedZone) {
  if (S.folding || S.segs.length !== 1) return;
  const totalUnits = S.segs[0].units;
  if (totalUnits % f !== 0) return;
  S.folding = true; haptic(50);
  clearObeliskIdleHints();
  if (clickedZone) clickedZone.style.display = 'none';

  const numPieces = totalUnits / f;
  const uH = S.unitH, uW = S.unitW, segH = f * uH;
  S.foldDir = swipeSide;
  S.segSize = f;

  const stage = $id('fo');
  stage.style.visibility = 'hidden';
  const zoomEl = $id('fz');

  const overlay = document.createElement('div');
  overlay.className = 'anim-overlay';
  overlay.style.marginLeft = `${-uW / 2}px`;
  zoomEl.appendChild(overlay);

  const sweepZoom = calcSweepZoom(numPieces, f);
  if (sweepZoom < S.currentZoom.fa - 0.005) zoomTo('fa', sweepZoom, { dur: 520, ease: 'p2out' });

  const { root, hinges } = buildNestTree(numPieces, segH, uW, S.foldDir, false);
  overlay.appendChild(root);
  const sorted = [...hinges].sort((a, b) => a.depth - b.depth);

  let landed = 0;
  sorted.forEach((item, i) => {
    tween({ delay: i * 150, dur: 1150, ease: 'bounceout',
      start: () => haptic(24),
      update: e => { item.hw.style.transform = `rotate(${item.rot * e}deg)`; },
      done: () => {
        landed++;
        if (landed === sorted.length) finishFold(f, numPieces, overlay, sweepZoom);
      } });
  });
  if (sorted.length === 0) finishFold(f, numPieces, overlay, sweepZoom);
}

function finishFold(f, numPieces, overlay, sweepZoom) {
  const uW = S.unitW;
  thud('fa');

  const isNewFactor = !S.fDisc.has(f);
  const isNewPrime = isPrime(f) && !S.primeDex.has(f);
  if (isNewFactor) S.fDisc.add(f);
  if (isNewPrime) S.trayIdentityReady = false;

  renderFT();
  checkFSolved({ deferVision: isNewPrime });

  S.segs = [];
  for (let i = 0; i < numPieces; i++) S.segs.push({ units: f });

  const landsLeft = foldLandsLeft(numPieces);
  S.handleIndex = landsLeft ? 0 : numPieces - 1;
  S.handleInverted = (numPieces - 1) % 2 === 1;
  S.folding = false;

  /* analytic landing: accordion spans cols 0..n-1 (right) or -(n-1)..0 (left) from the root */
  const landedMargin = landsLeft ? (-uW / 2 - (numPieces - 1) * uW) : (-uW / 2);
  renderSegs({ fromMargin: landedMargin, fromZoom: sweepZoom });
  overlay.remove();

  if (isNewFactor) {
    after(60, () => {
      const newItems = document.querySelectorAll('#ft .fs');
      const newTrayItem = Array.from(newItems).find(el => (el.dataset.f == f) && !el.dataset.beamed);
      if (newTrayItem) {
        newTrayItem.dataset.beamed = 'true';
        newTrayItem.animate([
          { opacity: 0, filter: 'brightness(5) blur(14px)', transform: 'translateY(-50px) scale(1.5)' },
          { opacity: 1, filter: 'brightness(1) blur(0px)', transform: 'translateY(0) scale(1)' },
        ], { duration: REDUCED ? 400 : 1100, easing: 'cubic-bezier(0.22,0.8,0.3,1)' });
      }
    });
  }

  if (isNewPrime) {
    after(isPrime(f) ? 950 : 250, () => launchTrinketDrop(f, numPieces, () => {
      S.trayIdentityReady = true;
      renderFT();
      flushDeferredRoomCelebration();
    }));
  } else buildDex('altar-dex-vp');
}

// ════════════════════════════════════════
// UNSPOOL — grab the free end, roll the accordion back into the monolith
// ════════════════════════════════════════
let US = null;

function beginUnspool() {
  if (S.folding || S.segs.length <= 1) return;
  clearObeliskIdleHints();
  S.folding = true;
  S._settleTw?.cancel();
  const stage = $id('fo');
  const uW = S.unitW, numSegs = S.segs.length, segH = S.segs[0].units * S.unitH;

  const curMargin = parseFloat(stage.style.marginLeft) || (-numSegs * uW / 2);
  const landsLeft = foldLandsLeft(numSegs);
  const rootIndex = landsLeft ? numSegs - 1 : 0;
  const rootMargin = curMargin + rootIndex * uW;

  stage.style.visibility = 'hidden';
  const overlay = document.createElement('div');
  overlay.className = 'anim-overlay';
  overlay.style.marginLeft = rootMargin + 'px';
  const zoomEl = $id('fz');
  zoomEl.appendChild(overlay);

  const { root, hinges } = buildNestTree(numSegs, segH, uW, S.foldDir, true);
  overlay.appendChild(root);
  const sorted = [...hinges].sort((a, b) => a.depth - b.depth);

  const overlap = 0.5;
  const n = sorted.length;
  const windowSize = 1 / (1 + (n - 1) * (1 - overlap));
  const starts = sorted.map((_, i) => i * (1 - overlap) * windowSize);

  const totalDragDist = (numSegs - 1) * segH * 1.2;
  const startZoom = S.currentZoom.fa;
  const centerSign = landsLeft ? 1 : -1;
  const avail = availHeight('fa');

  US = { overlay, sorted, starts, windowSize, totalDragDist, startY: null, startX: null, active: true, startZoom, centerSign, rootMargin, segH, numSegs, avail };

  const onMove = e => {
    if (!US || !US.active) return;
    e.preventDefault();
    const t = e.touches ? e.touches[0] : e;
    if (US.startY === null) { US.startY = t.clientY; US.startX = t.clientX; }
    const dragY = US.startY - t.clientY;
    const dragX = (t.clientX - US.startX) * US.centerSign;
    const combined = dragY + Math.max(0, dragX) * 0.4;
    const progress = clamp(combined / US.totalDragDist, 0, 1);
    US.sorted.forEach(({ hw, rot }, i) => {
      const hProg = clamp((progress - US.starts[i]) / US.windowSize, 0, 1);
      hw.style.transform = `rotate(${rot * (1 - hProg)}deg)`;
    });
    /* fit-aware zoom: keep the rising tower in frame the whole way */
    const raisedH = US.segH * (1 + (US.numSegs - 1) * progress);
    const zFit = clamp(US.avail / raisedH, S.fZoom, US.startZoom);
    setZoomImmediate('fa', zFit);
  };
  const onUp = e => {
    if (!US || !US.active) return;
    const t = e.changedTouches ? e.changedTouches[0] : e;
    if (US.startY === null) { cancelUS(onMove, onUp); return; }
    const dragY = US.startY - t.clientY;
    const dragX = (t.clientX - US.startX) * US.centerSign;
    const combined = dragY + Math.max(0, dragX) * 0.4;
    const progress = combined / US.totalDragDist;
    if (progress >= 0.85) completeUS(onMove, onUp);
    else cancelUS(onMove, onUp);
  };
  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('pointerup', onUp);
}

function cancelUS(onMove, onUp) {
  if (!US) return;
  US.active = false;
  const { sorted, startZoom } = US;
  const fromRot = sorted.map(({ hw }) => {
    const m = /rotate\(([-\d.]+)deg\)/.exec(hw.style.transform || '');
    return m ? parseFloat(m[1]) : 0;
  });
  const fromZoom = S.currentZoom.fa;
  tween({ dur: 400, ease: 'heavy',
    update: e => {
      sorted.forEach(({ hw, rot }, i) => { hw.style.transform = `rotate(${lerp(fromRot[i], rot, e)}deg)`; });
      setZoomImmediate('fa', lerp(fromZoom, startZoom, e));
    },
    done: () => {
      US?.overlay?.remove();
      $id('fo').style.visibility = 'visible';
      S.folding = false; US = null;
      scheduleObeliskIdleHints();
    } });
  document.removeEventListener('pointermove', onMove);
  document.removeEventListener('pointerup', onUp);
}

function completeUS(onMove, onUp) {
  if (!US) return;
  US.active = false; haptic([20, 30, 20]);
  const { sorted, rootMargin } = US;
  const fromRot = sorted.map(({ hw }) => {
    const m = /rotate\(([-\d.]+)deg\)/.exec(hw.style.transform || '');
    return m ? parseFloat(m[1]) : 0;
  });
  tween({ dur: 220, ease: 'backout',
    update: e => { sorted.forEach(({ hw }, i) => { hw.style.transform = `rotate(${lerp(fromRot[i], 0, e)}deg)`; }); },
    done: () => {
      const fromZoom = S.currentZoom.fa;
      US?.overlay?.remove();
      S.segs = [{ units: S.fNum }];
      S.folding = false; US = null;
      renderSegs({ fromMargin: rootMargin, fromZoom, settleDelay: 80 });
      thud('fa');
    } });
  document.removeEventListener('pointermove', onMove);
  document.removeEventListener('pointerup', onUp);
}

function checkFSolved(opts) {
  opts = opts || {};
  const n = S.fNum;
  if (!n || S.fDone.has(n)) return;
  if (allFactors(n).every(f => S.fDisc.has(f))) {
    S.fDone.add(n);
    S.fDiscMap[n] = new Set(S.fDisc);
    checkLvl();
    saveState();
    const numEl = $id('altar-numeral');
    numEl.onclick = () => goToGrid();
    const runVision = () => runAltarRoomSolvedVision({});
    if (opts.deferVision) S._deferredRoomCelebration = runVision;
    else runVision();
  }
}
function checkLvl() {
  const max = S.maxLevel * 12;
  for (let i = 1; i <= max; i++) if (!S.fDone.has(i)) return;
  S.maxLevel++;
}

// ════════════════════════════════════════
// FACTOR TRAY (on the altar table)
// ════════════════════════════════════════
function renderFT() {
  const tray = $id('ft');
  tray.innerHTML = '';
  const n = S.fNum;
  if (!n) return;
  const factors = allFactors(n);
  const tts = fitTrinketSize(factors.length);
  tray.style.setProperty('--tts', tts + 'px');
  factors.forEach(f => {
    const disc = S.fDisc.has(f);
    const isIdentity = f === n;
    let show = disc;
    if (isIdentity && f !== 1) show = S.trayIdentityReady && (isPrime(n) || S.fDisc.has(f));
    if (f === 1) {
      const s = document.createElement('div');
      s.className = 'fs glass-cube';
      s.dataset.f = '1';
      s.style.setProperty('--reflect-y', '52%');
      const txt = document.createElement('div'); txt.className = 'n-mirror'; txt.textContent = '1';
      txt.style.fontSize = Math.round(tts * 0.38) + 'px';
      s.appendChild(txt);
      tray.appendChild(s);
      return;
    }
    if (!show) {
      const s = document.createElement('div');
      s.className = 'fs empty';
      s.dataset.f = f;
      tray.appendChild(s);
      return;
    }
    if (isPrime(f)) {
      const s = makeMirror(f, tts);
      s.classList.add('fs');
      s.dataset.f = f;
      tray.appendChild(s);
    } else {
      const s = document.createElement('div');
      s.className = 'fs fc';
      s.dataset.f = f;
      const txt = document.createElement('div'); txt.textContent = f;
      txt.style.fontSize = Math.round(tts * 0.42) + 'px';
      s.appendChild(txt);
      tray.appendChild(s);
    }
  });
}

// ════════════════════════════════════════
// BUILD ALTAR
// ════════════════════════════════════════
function enterBuild(n) {
  syncCSSUnit();
  layoutRoom('ba');
  S.bNum = n; S.bStack = []; S.bProduct = 0; S.bAnimating = false;
  const numEl = $id('build-numeral');
  numEl.textContent = n;
  numEl.classList.remove('solved', 'celebrate');
  const isSolved = S.bDone.has(n);
  if (isSolved) numEl.classList.add('solved');
  numEl.onclick = isSolved ? () => goToGrid() : null;

  const avail = availHeight('ba');
  S.bZoom = Math.min(1, avail / (n * S.unitH));
  setZoomImmediate('ba', S.bZoom);
  positionBuildCeiling();

  buildDex('build-dex-vp');
  renderBuildTray(); renderBuildStage(); renderBuildLedger(); setupBuildDexDrag();
}

function positionBuildCeiling() {
  const ceil = $id('bceil');
  if (!ceil || !S.bNum) return;
  ceil.style.bottom = `calc(${obeliskBase('ba')}px + ${S.bNum * S.unitH * S.bZoom}px)`;
  ceil.style.top = 'auto';
}

function renderBuildStage() {
  const stage = $id('bo');
  stage.innerHTML = '';
  stage.style.visibility = 'visible';
  if (S.bProduct === 0) {
    stage.classList.remove('obelisk-pillar', 'seg-array');
    stage.style.width = S.unitW + 'px';
    stage.style.marginLeft = `${-S.unitW / 2}px`;
    return;
  }
  stage.classList.add('obelisk-pillar');
  stage.classList.remove('seg-array');
  const uH = S.unitH, uW = S.unitW, h = S.bProduct * uH;
  const el = makeBlock(S.bProduct, uW, h);
  el.classList.add('blk-pillar');
  stage.style.width = uW + 'px';
  stage.style.marginLeft = `${-uW / 2}px`;

  if (S.bStack.length > 0) {
    const prev = S.bStack[S.bStack.length - 1].prevProduct;
    if (prev > 0) {
      const zone = document.createElement('div');
      zone.className = 'bundo-zone';
      zone.style.top = (prev * uH) + 'px';
      const mark = document.createElement('div'); mark.className = 'bundo-mark';
      zone.appendChild(mark);
      zone.addEventListener('pointerdown', e => { e.preventDefault(); undoBuild(); });
      el.appendChild(zone);
    }
  }
  stage.appendChild(el);
}

function renderBuildTray() {
  const tray = $id('bt');
  tray.innerHTML = '';
  const n = S.bNum;
  if (!n) return;
  const expectedPrimes = getPrimeFactors(n);
  const placedPrimes = S.bStack.filter(e => e.p !== 1).map(e => e.p);
  const tts = fitTrinketSize(Math.max(4, expectedPrimes.length));
  tray.style.setProperty('--tts', tts + 'px');

  expectedPrimes.forEach((expectedP, i) => {
    if (i < placedPrimes.length) {
      const p = placedPrimes[i];
      const s = makeMirror(p, tts);
      s.classList.add('fs');
      s.dataset.f = p;
      if (i === placedPrimes.length - 1) {
        s.classList.add('last');
        s.style.touchAction = 'none';
        s.addEventListener('pointerdown', e => {
          if (S.bAnimating) return;
          e.preventDefault();
          s.setPointerCapture(e.pointerId);
          const startY = e.clientY; let removed = false;
          const onMove = ev => { if (ev.clientY - startY > 20 && !removed) { removed = true; cleanup(); undoBuild(); } };
          const onUp = () => cleanup();
          const cleanup = () => { s.removeEventListener('pointermove', onMove); s.removeEventListener('pointerup', onUp); };
          s.addEventListener('pointermove', onMove, { passive: false });
          s.addEventListener('pointerup', onUp);
        });
      }
      tray.appendChild(s);
    } else {
      const s = document.createElement('div');
      s.className = 'fs empty';
      tray.appendChild(s);
    }
  });
}

function renderBuildLedger() {
  const led = $id('bl');
  led.innerHTML = '';
  if (S.bStack.length <= 1) return;
  S.bStack.forEach((entry, i) => {
    if (i > 0) { const x = document.createElement('span'); x.className = 'ledger-times'; x.textContent = '×'; led.appendChild(x); }
    const t = document.createElement('div'); t.className = 'ledger-factor'; t.textContent = entry.p; led.appendChild(t);
  });
  const eq = document.createElement('span'); eq.className = 'ledger-eq'; eq.textContent = '='; led.appendChild(eq);
  const prod = document.createElement('div'); prod.className = 'ledger-product'; prod.textContent = S.bProduct; led.appendChild(prod);
}

function setupBuildDexDrag() {
  const vp = $id('build-dex-vp');
  if (!vp) return;
  vp.querySelectorAll('.dex-slot[data-n]').forEach(slot => {
    const n = parseInt(slot.dataset.n);
    if (!isPrime(n) || !S.primeDex.has(n)) return;
    const trinket = slot.querySelector('.mirror-trinket');
    if (!trinket) return;
    trinket.style.touchAction = 'none';
    trinket.style.cursor = 'grab';
    trinket.addEventListener('pointerdown', e => {
      if (S.bAnimating) return;
      e.preventDefault(); e.stopPropagation();
      trinket.setPointerCapture(e.pointerId);
      startBuildDrag(e, n, trinket);
    }, { passive: false });
  });
}

function startBuildDrag(e, p, sourceEl) {
  const size = 44;
  const dexRect = $id('build-dex-container').getBoundingClientRect();
  const drag = makeMirror(p, size);
  drag.classList.add('drag-ghost');
  drag.style.left = (e.clientX - size / 2) + 'px';
  drag.style.top = (e.clientY - size / 2) + 'px';
  document.body.appendChild(drag);
  sourceEl.style.opacity = '0.35';
  const onMove = ev => {
    drag.style.left = (ev.clientX - size / 2) + 'px';
    drag.style.top = (ev.clientY - size / 2) + 'px';
  };
  const onUp = ev => {
    sourceEl.removeEventListener('pointermove', onMove);
    sourceEl.removeEventListener('pointerup', onUp);
    sourceEl.removeEventListener('pointercancel', onUp);
    sourceEl.style.opacity = '';
    drag.remove();
    if (ev.clientY < dexRect.top - 10) placeBuildPrime(p);
  };
  sourceEl.addEventListener('pointermove', onMove, { passive: true });
  sourceEl.addEventListener('pointerup', onUp);
  sourceEl.addEventListener('pointercancel', onUp);
}

function triggerShatter(rectElement, contactY) {
  haptic([60, 30, 60, 20, 80]);
  const rect = rectElement.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = contactY != null ? contactY : rect.top;
  const spawn = (cls, w, h, spread, dur) => {
    const piece = document.createElement('div');
    piece.className = 'shatter-piece ' + cls;
    const dx = (Math.random() - 0.5) * spread * 2;
    const dy = -(Math.random() * spread * 0.6) + (Math.random() - 0.5) * spread * 0.8;
    piece.style.cssText = `width:${w}px;height:${h}px;left:${cx + ((Math.random() - 0.5) * rect.width * 0.4)}px;top:${cy + ((Math.random() - 0.5) * 12)}px;--tx:translate(${dx}px,${dy}px);--rot:${(Math.random() - 0.5) * 720}deg;animation:shatterFly ${dur}s ease-out forwards;position:fixed;`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), dur * 1000 + 50);
  };
  for (let i = 0; i < 8; i++) spawn('shard', Math.random() * 8 + 3, Math.random() * 12 + 4, 250, 0.5 + Math.random() * 0.3);
  for (let i = 0; i < 12; i++) spawn('spark', Math.random() * 5 + 2, Math.random() * 5 + 2, 300, 0.4 + Math.random() * 0.4);
  for (let i = 0; i < 18; i++) spawn('ember', Math.random() * 3 + 1, Math.random() * 3 + 1, 350, 0.3 + Math.random() * 0.5);
  const flash = document.createElement('div');
  flash.style.cssText = `position:fixed;left:${cx - 40}px;top:${cy - 40}px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.9) 0%,rgba(255,200,80,0.6) 30%,rgba(255,100,20,0.3) 60%,transparent 80%);pointer-events:none;z-index:8600;opacity:1;transition:all 0.3s ease-out;`;
  document.body.appendChild(flash);
  requestAnimationFrame(() => { flash.style.transform = 'scale(3)'; flash.style.opacity = '0'; });
  setTimeout(() => flash.remove(), 350);
}

function placeBuildPrime(p) {
  if (S.bAnimating) return;
  const n = S.bNum, prevProduct = S.bProduct, newProduct = prevProduct === 0 ? p : prevProduct * p;
  S.bStack.push({ p, prevProduct });
  S.bProduct = newProduct;
  S.bAnimating = true;
  renderBuildTray(); renderBuildLedger();

  if (prevProduct === 0) {
    if (newProduct > n) {
      animateBuildFirstPrimeOvershoot(p, n, () => {
        S.bStack.pop(); S.bProduct = 0; S.bAnimating = false;
        renderBuildTray(); renderBuildStage(); renderBuildLedger();
      });
    } else {
      animateBuildFirstPrime(p, n, () => {
        S.bAnimating = false;
        renderBuildTray(); renderBuildStage(); renderBuildLedger();
        if (newProduct === n) checkBuildSolved();
      });
    }
  } else if (newProduct > n) {
    animateBuildOvershoot(prevProduct, p, newProduct, n, () => {
      S.bStack.pop(); S.bProduct = prevProduct; S.bAnimating = false;
      renderBuildTray(); renderBuildStage(); renderBuildLedger();
    });
  } else {
    animateBuildHinge(prevProduct, p, newProduct, n, () => {
      S.bAnimating = false;
      renderBuildTray(); renderBuildStage(); renderBuildLedger();
      if (newProduct === n) checkBuildSolved();
    });
  }
}

/* First mirror: count out p glass units, flash-fuse into the prime monolith. */
function animateBuildFirstPrime(p, target, onComplete) {
  const stage = $id('bo');
  const uH = S.unitH, uW = S.unitW;
  stage.innerHTML = '';
  stage.style.width = uW + 'px';
  stage.style.marginLeft = `${-uW / 2}px`;
  stage.style.visibility = 'visible';
  stage.classList.add('obelisk-pillar');

  const blocks = [];
  for (let i = 0; i < p; i++) {
    const blk = makeBlock(1, uW, uH, false, false);
    applyGlassReflectY(blk, i, p);
    blk.style.position = 'absolute';
    blk.style.bottom = `${i * uH}px`;
    blk.style.left = '0';
    blk.style.transform = 'scale(0)';
    stage.appendChild(blk);
    blocks.push(blk);
  }
  haptic(15);
  blocks.forEach((blk, i) => {
    tween({ delay: i * 160, dur: 480, ease: 'backout',
      update: e => { blk.style.transform = `scale(${e})`; },
      done: i === p - 1 ? () => {
        const flash = document.createElement('div');
        flash.style.cssText = `position:absolute; bottom:0; left:0; width:${uW}px; height:${p * uH}px; z-index:100; opacity:0; border-radius:4px; pointer-events:none; background:#FF8C00; box-shadow:0 0 60px 20px rgba(255,215,0,0.8);`;
        stage.appendChild(flash);
        haptic([40, 60]);
        tween({ dur: 320, ease: 'p2inout',
          update: e => { flash.style.opacity = String(Math.sin(e * Math.PI)); },
          done: () => { flash.remove(); onComplete(); } });
      } : null });
  });
}

/* First mirror too tall: units stack until one hits the ceiling — shatter, revert. */
function animateBuildFirstPrimeOvershoot(p, target, onRevert) {
  const stage = $id('bo');
  const uH = S.unitH, uW = S.unitW;
  stage.innerHTML = '';
  stage.style.width = uW + 'px';
  stage.style.marginLeft = `${-uW / 2}px`;
  stage.style.visibility = 'visible';

  const hitIndex = target; /* 0-based cube index that pierces the ceiling */
  const blocks = [];
  for (let i = 0; i <= Math.min(hitIndex, p - 1); i++) {
    const blk = makeBlock(1, uW, uH, false, false);
    applyGlassReflectY(blk, i, p);
    blk.style.position = 'absolute';
    blk.style.bottom = `${i * uH}px`;
    blk.style.left = '0';
    blk.style.transform = 'scale(0)';
    stage.appendChild(blk);
    blocks.push(blk);
  }
  haptic(15);
  blocks.forEach((blk, i) => {
    const isHit = i === hitIndex;
    tween({ delay: i * 160, dur: isHit ? 300 : 480, ease: isHit ? 'p2out' : 'backout',
      update: e => { blk.style.transform = `scale(${e})`; },
      done: isHit ? () => {
        after(50, () => {
          const ceilEl = $id('bceil');
          const contactY = ceilEl ? ceilEl.getBoundingClientRect().top : undefined;
          triggerShatter(stage, contactY);
          after(400, () => { stage.innerHTML = ''; onRevert(); });
        });
      } : null });
  });
}

/* Mirror multiplication: the stack sees itself p-1 more times.
   Ghost reflections hinge up out of the stack, solidify, fuse. */
function animateBuildHinge(prevH, p, finalH, target, cb) {
  const stage = $id('bo');
  const uH = S.unitH, uW = S.unitW, segH = prevH * uH;
  stage.style.visibility = 'hidden';

  const overlay = document.createElement('div');
  overlay.className = 'anim-overlay';
  overlay.style.marginLeft = `${-uW / 2}px`;
  $id('bz').appendChild(overlay);

  const isBaseComposite = !isPrime(prevH);
  const base = makeAnimBlock(prevH, uW, segH, isBaseComposite ? 'blk-c' : 'blk-p');
  base.style.position = 'absolute'; base.style.bottom = '0'; base.style.left = '0'; base.style.zIndex = '10';
  overlay.appendChild(base);

  /* the mirror activates: a sheen sweeps the existing stack */
  const mf = document.createElement('div');
  mf.className = 'mirror-flash';
  base.appendChild(mf);
  setTimeout(() => mf.remove(), 700);

  const copies = p - 1, phaseDur = 620, pause = 160, leadIn = 320;
  const arms = [];
  for (let i = 0; i < copies; i++) {
    const pivotBottom = (i + 1) * segH;
    const hw = document.createElement('div');
    hw.style.cssText = `position:absolute;bottom:${pivotBottom}px;left:0;width:${uW}px;height:0;transform-origin:50% 0%;transform:rotate(180deg);z-index:${5 - i};visibility:hidden;`;
    const blk = makeAnimBlock(prevH, uW, segH, 'blk-p');
    blk.classList.add('reflection');
    blk.style.position = 'absolute'; blk.style.bottom = '0'; blk.style.left = '0';
    hw.appendChild(blk);
    overlay.appendChild(hw);
    arms.push({ hw, blk });
  }

  arms.forEach(({ hw, blk }, i) => {
    tween({ delay: leadIn + i * (phaseDur + pause), dur: phaseDur, ease: 'p2inout',
      start: () => { hw.style.visibility = 'visible'; haptic(20); },
      update: e => { hw.style.transform = `rotate(${180 * (1 - e)}deg)`; },
      done: () => { blk.classList.remove('reflection'); haptic(12); } });
  });

  const allLandedTime = leadIn + copies * (phaseDur + pause) + 320;
  after(allLandedTime, () => {
    const totalH = finalH * uH;
    const flash = document.createElement('div');
    flash.style.cssText = `position:absolute; bottom:0; left:0; width:${uW}px; height:${totalH}px; z-index:100; opacity:0; border-radius:4px; pointer-events:none; background:#ffffff; box-shadow:0 0 50px 20px rgba(255,255,255,0.9);`;
    overlay.appendChild(flash);
    haptic([40, 60]);
    tween({ dur: 320, ease: 'p2inout',
      update: e => { flash.style.opacity = String(Math.sin(e * Math.PI)); },
      done: () => {
        overlay.remove();
        stage.style.visibility = 'visible';
        renderBuildStage();
        thud('ba');
        cb && cb();
      } });
  });
}

/* Multiplication overshoot: a reflection can't fit under the ceiling — partial hinge, shatter. */
function animateBuildOvershoot(prevH, p, finalH, target, cb) {
  const stage = $id('bo');
  const uH = S.unitH, uW = S.unitW, segH = prevH * uH, ceilPx = target * uH;
  stage.style.visibility = 'hidden';

  const overlay = document.createElement('div');
  overlay.className = 'anim-overlay';
  overlay.style.marginLeft = `${-uW / 2}px`;
  $id('bz').appendChild(overlay);

  const isBaseComposite = !isPrime(prevH);
  const base = makeAnimBlock(prevH, uW, segH, isBaseComposite ? 'blk-c' : 'blk-p');
  base.style.position = 'absolute'; base.style.bottom = '0'; base.style.left = '0'; base.style.zIndex = '10';
  overlay.appendChild(base);

  const mf = document.createElement('div');
  mf.className = 'mirror-flash';
  base.appendChild(mf);
  setTimeout(() => mf.remove(), 700);

  const copies = p - 1, phaseDur = 620, pause = 160, leadIn = 320;
  const arms = [];
  for (let i = 0; i < copies; i++) {
    const pivotBottom = (i + 1) * segH;
    const hw = document.createElement('div');
    hw.style.cssText = `position:absolute;bottom:${pivotBottom}px;left:0;width:${uW}px;height:0;transform-origin:50% 0%;transform:rotate(180deg);z-index:${5 - i};visibility:hidden;`;
    const blk = makeAnimBlock(prevH, uW, segH, 'blk-p', false);
    blk.classList.add('reflection');
    blk.style.position = 'absolute'; blk.style.bottom = '0'; blk.style.left = '0';
    hw.appendChild(blk);
    overlay.appendChild(hw);
    arms.push(hw);
  }

  /* find the reflection that strikes the ceiling */
  let collisionArm = -1, collisionAngle = 0;
  for (let i = 0; i < copies; i++) {
    const pivotY = (i + 1) * segH;
    const headroom = ceilPx - pivotY;
    if (headroom >= segH) continue;
    collisionAngle = Math.acos(clamp(headroom / segH, -1, 1)) * (180 / Math.PI);
    collisionArm = i;
    break;
  }
  const safeCount = collisionArm >= 0 ? collisionArm : copies;

  for (let i = 0; i < safeCount; i++) {
    tween({ delay: leadIn + i * (phaseDur + pause), dur: phaseDur, ease: 'p2inout',
      start: () => { arms[i].style.visibility = 'visible'; haptic(20); },
      update: e => { arms[i].style.transform = `rotate(${180 * (1 - e)}deg)`; } });
  }

  if (collisionArm >= 0) {
    const fraction = (180 - collisionAngle) / 180;
    const collisionDur = Math.max(140, Math.round(phaseDur * fraction));
    tween({ delay: leadIn + collisionArm * (phaseDur + pause), dur: collisionDur, ease: 'p2inout',
      start: () => { arms[collisionArm].style.visibility = 'visible'; haptic(20); },
      update: e => { arms[collisionArm].style.transform = `rotate(${lerp(180, collisionAngle, e)}deg)`; },
      done: () => {
        after(30, () => {
          arms.forEach(a => { a.style.display = 'none'; });
          const ceilEl = $id('bceil');
          const contactY = ceilEl ? ceilEl.getBoundingClientRect().top : undefined;
          triggerShatter(overlay.getBoundingClientRect ? base : overlay, contactY);
          after(400, () => { overlay.remove(); stage.style.visibility = 'visible'; cb && cb(); });
        });
      } });
  }
}

function undoBuild() {
  if (S.bAnimating || S.bStack.length === 0) return;
  const entry = S.bStack[S.bStack.length - 1], p = entry.p, prevProduct = entry.prevProduct;
  if (prevProduct === 0) {
    S.bStack.pop(); S.bProduct = 0; haptic(20);
    renderBuildTray(); renderBuildStage(); renderBuildLedger();
    return;
  }
  S.bAnimating = true; haptic(20);
  const stage = $id('bo');
  const uW = S.unitW, segH = prevProduct * S.unitH;
  stage.style.visibility = 'hidden';

  const overlay = document.createElement('div');
  overlay.className = 'anim-overlay';
  overlay.style.marginLeft = `${-uW / 2}px`;
  $id('bz').appendChild(overlay);

  const wasBaseComposite = !isPrime(prevProduct) || (S.bStack.length > 2);
  const base = makeAnimBlock(prevProduct, uW, segH, wasBaseComposite ? 'blk-c' : 'blk-p');
  base.style.position = 'absolute'; base.style.bottom = '0'; base.style.left = '0';
  overlay.appendChild(base);

  const copies = p - 1, phaseDur = 350, pause = 60;
  const arms = [];
  for (let i = 0; i < copies; i++) {
    const pivotBottom = (i + 1) * segH;
    const hw = document.createElement('div');
    hw.style.cssText = `position:absolute;bottom:${pivotBottom}px;left:0;width:${uW}px;height:0;transform-origin:50% 0%;transform:rotate(0deg);`;
    const blk = makeAnimBlock(prevProduct, uW, segH, 'blk-p', false);
    blk.style.position = 'absolute'; blk.style.bottom = '0'; blk.style.left = '0';
    hw.appendChild(blk);
    overlay.appendChild(hw);
    arms.push(hw);
  }
  const reversedArms = [...arms].reverse();
  reversedArms.forEach((hw, i) => {
    tween({ delay: i * (phaseDur + pause), dur: phaseDur, ease: 'p2inout',
      start: () => haptic(15),
      update: e => {
        hw.style.transform = `rotate(${180 * e}deg)`;
        if (e > 0.6) hw.firstChild.classList.add('reflection');
      } });
  });
  after(reversedArms.length * (phaseDur + pause) + 160, () => {
    overlay.remove();
    S.bStack.pop(); S.bProduct = prevProduct;
    stage.style.visibility = 'visible';
    S.bAnimating = false;
    renderBuildTray(); renderBuildStage(); renderBuildLedger();
  });
}

function checkBuildSolved() {
  const n = S.bNum;
  if (!n || S.bDone.has(n)) return;
  S.bDone.add(n);
  saveState();
  const numEl = $id('build-numeral');
  numEl.onclick = () => goToGrid();
  after(300, () => {
    showAffirm();
    numEl.classList.add('celebrate');
    haptic([20, 25, 20, 25, 40]);
    after(1100, () => { numEl.classList.remove('celebrate'); numEl.classList.add('solved'); });
  });
}

// ════════════════════════════════════════
// RESIZE
// ════════════════════════════════════════
let _resizeTO = null;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTO);
  _resizeTO = setTimeout(() => {
    ['fa', 'ba'].forEach(layoutRoom);
    if (!$id('altar-screen').classList.contains('hidden') && S.fNum) {
      const avail = availHeight('fa');
      S.fZoom = Math.min(1, avail / (S.fNum * S.unitH));
      if (!S.folding) renderSegs();
      renderFT();
    }
    if (!$id('build-screen').classList.contains('hidden') && S.bNum) {
      const avail = availHeight('ba');
      S.bZoom = Math.min(1, avail / (S.bNum * S.unitH));
      if (!S.bAnimating) { setZoomImmediate('ba', S.bZoom); renderBuildStage(); }
      positionBuildCeiling();
      renderBuildTray();
    }
  }, 120);
});

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
window.S = S; /* debug/testing handle */
loadState();
S.fDone.add(1);
buildDex('altar-dex-vp');
buildDex('grid-vp');
layoutRoom('fa');
layoutRoom('ba');
const hasHistory = S.primeDex.size > 0 || S.fDone.size > 1 || S.bDone.size > 1;
if (hasHistory) {
  $id('altar-screen').classList.add('hidden');
  $id('grid-screen').classList.remove('hidden');
  renderGrid();
  buildDex('grid-vp');
} else {
  requestAnimationFrame(() => { layoutRoom('fa'); enterAltar(12); });
}
