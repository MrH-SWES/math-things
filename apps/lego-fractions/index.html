<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math Things. | Snap Bricks</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --text-main: #1D1D1F;
    --text-gray: #86868B;
    --text-light: #AEAEB2;
    --surface: #FFFFFF;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --shadow-raised: 6px 6px 14px rgba(166,171,189,0.45), -6px -6px 14px rgba(255,255,255,0.9);
    --shadow-milled: inset 3px 3px 6px rgba(166,171,189,0.9), inset -3px -3px 6px rgba(255,255,255,1);
    --outline: #2A2C30;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Lexend', sans-serif;
    color: var(--text-main);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    /* the mat: warm, quiet ceramic */
    background: radial-gradient(ellipse at 50% 38%, #FBF9F6 0%, #F2EFEA 58%, #E8E4DD 100%);
  }

  /* ── MAT ── */
  #mat { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(28px, 7vh, 72px); padding: 64px 12px 16px; }
  .lane { display: flex; align-items: flex-end; justify-content: center; gap: clamp(6px, 1.4vw, 14px); position: relative; outline: none; }
  .lane:focus-visible .chain { filter: drop-shadow(0 0 4px #007AFF); }
  .chainbox { display: flex; justify-content: flex-start; }
  .chain { overflow: visible; touch-action: none; cursor: pointer; display: block; }

  /* partition dial: ‹ plate › */
  .dial { display: flex; align-items: center; gap: 4px; padding-bottom: 2px; }
  .dial svg.mini { width: 40px; height: 22px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface); border: 2px solid transparent;
    box-shadow: var(--shadow-raised);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.25s var(--spring); outline: none;
    color: var(--text-gray); padding: 0; flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn.active { box-shadow: var(--shadow-milled); color: var(--text-main); }
  .icon-btn:focus-visible { border-color: #007AFF; }
  .icon-btn.small { width: 34px; height: 34px; }
  .ghost {
    height: 34px; min-width: 34px; border-radius: 8px; border: 2px dashed var(--text-light); background: transparent;
    color: var(--text-light); display: flex; align-items: center; justify-content: center; cursor: pointer; outline: none; transition: all 0.2s;
  }
  .ghost:hover { border-color: var(--text-gray); color: var(--text-gray); }
  .ghost:focus-visible { border-color: #007AFF; }
  .ghost[hidden] { display: none; }
  .plates { display: flex; flex-direction: column; gap: 6px; padding-bottom: 2px; }

  /* record: the lane's fraction, stacked as written */
  .record { position: absolute; top: -46px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; opacity: 0; transition: opacity 0.3s; pointer-events: none; font-weight: 800; }
  body.rec .record { opacity: 1; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; font-size: 1.15rem; }
  .frac .bar { width: 100%; min-width: 16px; height: 2.5px; background: currentColor; border-radius: 2px; margin: 3px 0; }
  .whole { font-size: 1.5rem; }
  .eq { color: var(--text-gray); font-weight: 600; }

  /* pour: drops the top lane's bricks onto the bottom lane */
  #pourBtn { position: absolute; left: 0; top: 50%; transform: translate(-50%, -50%); z-index: 3; }
  #pourBtn:active { transform: translate(-50%, -50%) scale(0.94); }
  #between { position: relative; height: 0; }

  /* ── CABINET ── */
  #dock { flex-shrink: 0; display: flex; justify-content: center; padding: 0 12px; }
  #cabinet {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px;
    border-radius: 24px 24px 0 0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.16) 0 1px, rgba(0,0,0,0.018) 1px 2px, transparent 2px 4px),
      linear-gradient(180deg, #EFF0F3 0%, #DADCE1 100%);
    border: 1px solid rgba(0,0,0,0.06);
    border-bottom: none;
    box-shadow: 0 -8px 22px rgba(110,95,75,0.12), inset 0 1px 0 rgba(255,255,255,0.95);
  }

  /* ── FOOTER ── */
  #footer {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 6px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    color: var(--text-light); letter-spacing: 0.5px;
    background: linear-gradient(180deg, #DADCE1 0%, #E4E6EA 100%);
  }
  .footer-bead { display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--text-light); margin: 0 4px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>

<main id="mat" aria-label="Snap brick fraction mat"></main>

<div id="dock">
  <div id="cabinet" role="toolbar" aria-label="Hardware">
    <button class="icon-btn" id="recordBtn" aria-label="Show the fractions" aria-pressed="false">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 8s2.6-4.6 7-4.6S15 8 15 8s-2.6 4.6-7 4.6S1 8 1 8z"/><circle cx="8" cy="8" r="2.3"/></svg>
    </button>
    <button class="icon-btn" id="clearBtn" aria-label="Take the bricks off and start over">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.6 6.2A5.6 5.6 0 1 1 2.4 9.6"/><path d="M2.2 2.6v3.8h3.8"/></svg>
    </button>
  </div>
</div>

<div id="footer">Math Things <span class="footer-bead"></span> | Math, in your hands <span class="footer-bead"></span></div>
<div id="live" class="sr-only" aria-live="polite"></div>

<script type="module">
import { FRACTION_DENOMINATORS, fractionColor } from '../../math-things-fractions.js';

const DENS = FRACTION_DENOMINATORS.filter(d => d !== 100);   // 2 … 16
const MAX_PLATES = 3;
const NS = 'http://www.w3.org/2000/svg';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz = n => { if (reduceMotion || !navigator.vibrate) return; try { navigator.vibrate(n); } catch (e) {} };
const r2 = v => Math.round(v * 100) / 100;
const anim = (node, frames, dur, easing = 'ease-out') => reduceMotion || !node ? null : node.animate(frames, { duration: dur, easing });
const shake = node => anim(node, [0, -6, 6, -4, 4, 0].map(v => ({ transform: `translateX(${v}px)` })), 280, 'linear');
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), ch = [n >> 16, (n >> 8) & 255, n & 255];
  return '#' + ch.map(c => Math.round(f < 0 ? c * (1 + f) : c + (255 - c) * f).toString(16).padStart(2, '0')).join('');
}

const $ = id => document.getElementById(id);
const mat = $('mat'), live = $('live'), recordBtn = $('recordBtn'), clearBtn = $('clearBtn');

// Two lanes of baseplates. Every plate is one whole, the same length in both lanes; its studs are its
// parts. Bricks are one part each and fill the studs from the left, across plates.
const START = [{ d: 4, plates: 1, m: 0 }, { d: 3, plates: 1, m: 0 }];
const lanes = START.map(s => ({ ...s }));
let WHOLE = 300;   // px length of one whole

// ═══════ BUILD ═══════
const between = document.createElement('div');
between.id = 'between';
lanes.forEach((ln, i) => {
  ln.el = document.createElement('div');
  ln.el.className = 'lane';
  ln.el.tabIndex = 0;
  ln.el.setAttribute('role', 'group');
  ln.el.innerHTML = `
    <div class="record" aria-hidden="true"></div>
    <div class="dial">
      <button class="icon-btn small" data-act="fewer" aria-label="Fewer, larger parts">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg></button>
      <svg class="mini" viewBox="0 0 40 22" aria-hidden="true"></svg>
      <button class="icon-btn small" data-act="more" aria-label="More, smaller parts">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></button>
    </div>
    <div class="chainbox"><svg class="chain"></svg></div>
    <div class="plates">
      <button class="ghost" data-act="add" aria-label="Add a whole plate"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
      <button class="ghost" data-act="remove" aria-label="Take off the last plate"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"/></svg></button>
    </div>`;
  ln.chain = ln.el.querySelector('.chain');
  ln.mini = ln.el.querySelector('.mini');
  ln.rec = ln.el.querySelector('.record');
  ln.el.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    ({ fewer: () => repartition(ln, -1), more: () => repartition(ln, 1), add: () => addPlate(ln), remove: () => removePlate(ln) })[b.dataset.act]();
  });
  mat.appendChild(ln.el);
  if (i === 0) mat.appendChild(between);
});
const pourBtn = document.createElement('button');
pourBtn.className = 'icon-btn';
pourBtn.id = 'pourBtn';
pourBtn.setAttribute('aria-label', 'Pour the top bricks onto the bottom plates');
pourBtn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 16l-4.5-4.5h3.2V4h2.6v7.5h3.2z"/><rect x="5" y="18" width="14" height="2.2" rx="1.1"/></svg>';
between.appendChild(pourBtn);

// ═══════ LAYOUT ═══════
function layout() {
  const W = innerWidth, side = 40 * 2 + 8 + 40 + 34 + 4 * 14 + 24;
  const most = Math.max(...lanes.map(l => l.plates));
  WHOLE = Math.max(90, Math.min(360, (W - side) / most - 6));
  lanes.forEach(draw);
  // both lanes share one plate column, so their wholes start at the same edge and line up
  const widest = Math.max(...lanes.map(l => l.geom.w));
  lanes.forEach(l => { l.el.querySelector('.chainbox').style.width = r2(widest) + 'px'; });
  // the pour button sits under the top lane's dial, clear of the records
  const dial = lanes[0].el.querySelector('.dial').getBoundingClientRect(), box = between.getBoundingClientRect();
  pourBtn.style.left = r2(dial.left + dial.width / 2 - box.left) + 'px';
}

// ═══════ DRAWING ═══════
// A plate: grey baseplate with a stud per part. A brick: one part, in its denominator's enamel, with a stud.
function draw(ln) {
  const d = ln.d, part = WHOLE / d, gap = 6, ph = Math.max(20, Math.min(34, WHOLE * 0.1)), bh = ph * 1.05, sh = Math.max(5, ph * 0.26);
  const w = ln.plates * WHOLE + (ln.plates - 1) * gap, h = ph + bh + sh * 2 + 4;
  ln.geom = { part, gap, ph, bh, sh, w, h };
  ln.chain.setAttribute('width', r2(w));
  ln.chain.setAttribute('height', r2(h));
  ln.chain.setAttribute('viewBox', `0 0 ${r2(w)} ${r2(h)}`);
  const color = fractionColor(d), dark = shade(color, -0.45), light = shade(color, 0.35);
  const base = h - ph, top = base - bh;
  const studW = Math.max(3, Math.min(part * 0.56, 22));
  let s = '';
  for (let p = 0; p < ln.plates; p++) {
    const x0 = p * (WHOLE + gap);
    // baseplate with engraved seams between parts
    s += `<rect x="${r2(x0)}" y="${r2(base)}" width="${r2(WHOLE)}" height="${r2(ph)}" rx="3" fill="#8F9399" stroke="var(--outline)" stroke-width="1.6"/>`;
    s += `<rect x="${r2(x0 + 1.5)}" y="${r2(base + 1.5)}" width="${r2(WHOLE - 3)}" height="${r2(ph * 0.3)}" rx="2" fill="rgba(255,255,255,0.22)"/>`;
    for (let k = 1; k < d; k++) s += `<line x1="${r2(x0 + k * part)}" y1="${r2(base + 3)}" x2="${r2(x0 + k * part)}" y2="${r2(base + ph - 3)}" stroke="rgba(30,32,36,0.35)" stroke-width="1"/>`;
    for (let k = 0; k < d; k++) {
      const n = p * d + k, cx = x0 + (k + 0.5) * part;
      if (n < ln.m) {
        // a brick on this stud
        const bx = x0 + k * part, isFirst = n === 0 || k === 0, isLast = n === ln.m - 1 || k === d - 1;
        s += `<rect x="${r2(bx)}" y="${r2(top)}" width="${r2(part)}" height="${r2(bh + 1)}" fill="${color}" stroke="var(--outline)" stroke-width="1.6" rx="${isFirst || isLast ? 3 : 1}"/>`;
        s += `<rect x="${r2(bx + 1.5)}" y="${r2(top + 1.5)}" width="${r2(Math.max(1, part - 3))}" height="${r2(bh * 0.28)}" rx="1.5" fill="${light}" opacity="0.55"/>`;
        s += `<rect x="${r2(cx - studW / 2)}" y="${r2(top - sh)}" width="${r2(studW)}" height="${r2(sh + 1)}" rx="1.5" fill="${color}" stroke="var(--outline)" stroke-width="1.4"/>`;
      } else {
        s += `<rect x="${r2(cx - studW / 2)}" y="${r2(base - sh)}" width="${r2(studW)}" height="${r2(sh + 1)}" rx="1.5" fill="#9DA1A7" stroke="var(--outline)" stroke-width="1.4"/>`;
      }
    }
  }
  // a fine seam between a brick and the next marks each part, darker in the brick's own colour
  ln.chain.innerHTML = s.replace(/var\(--outline\)/g, '#2A2C30') + `<rect class="hit" x="0" y="0" width="${r2(w)}" height="${r2(h)}" fill="transparent"/>`;
  void dark;
  // the dial's little plate shows the partition
  let mini = `<rect x="1" y="10" width="38" height="10" rx="2" fill="#8F9399" stroke="#2A2C30" stroke-width="1.2"/>`;
  for (let k = 0; k < d; k++) mini += `<rect x="${r2(1 + (k + 0.5) * 38 / d - Math.min(3, 38 / d * 0.3))}" y="6" width="${r2(Math.min(6, 38 / d * 0.6))}" height="4.5" rx="1" fill="${color}" stroke="#2A2C30" stroke-width="0.8"/>`;
  ln.mini.innerHTML = mini;
  ln.el.querySelector('[data-act="add"]').hidden = ln.plates >= MAX_PLATES;
  ln.el.querySelector('[data-act="remove"]').hidden = ln.plates <= 1;
  record(ln);
  ln.el.setAttribute('aria-label', `${ln === lanes[0] ? 'Top' : 'Bottom'} plates: ${ln.plates} whole${ln.plates > 1 ? 's' : ''} cut into ${d} parts each, ${ln.m} brick${ln.m === 1 ? '' : 's'}` + (document.body.classList.contains('rec') ? `, ${spoken(ln)}` : '') + '. Left and right arrows add or take off bricks; up and down change the parts.');
}

// the record: m/d, and as a mixed number past one whole
function record(ln) {
  const { m, d } = ln, color = shade(fractionColor(d), -0.35);
  const fr = (n, dd, c = 'inherit') => `<span class="frac" style="color:${c}"><span>${n}</span><span class="bar"></span><span>${dd}</span></span>`;
  let h = fr(m, d, color);
  if (m >= d && m > 0) {
    const w = Math.floor(m / d), r = m % d;
    h += `<span class="eq">=</span><span class="whole" style="color:${color}">${w}</span>` + (r ? fr(r, d, color) : '');
  }
  ln.rec.innerHTML = h;
}
const spoken = ln => {
  const w = Math.floor(ln.m / ln.d), r = ln.m % ln.d;
  return `${ln.m} over ${ln.d}` + (ln.m >= ln.d ? `, which is ${w}${r ? ` and ${r} over ${ln.d}` : ''}` : '');
};
function announce(ln) { live.textContent = `${ln === lanes[0] ? 'Top' : 'Bottom'}: ${ln.m} brick${ln.m === 1 ? '' : 's'} on wholes cut into ${ln.d} parts` + (document.body.classList.contains('rec') ? `, ${spoken(ln)}.` : '.'); }

// ═══════ ACTIONS ═══════
// Re-cutting the plates: with bricks on, only cuts the bricks still fit exactly are allowed
// (fourths become eighths or twelfths, never thirds). Bricks split or join with the studs.
function repartition(ln, dir) {
  const i = DENS.indexOf(ln.d);
  for (let j = i + dir; j >= 0 && j < DENS.length; j += dir) {
    const d2 = DENS[j];
    if ((ln.m * d2) % ln.d === 0) {
      ln.m = ln.m * d2 / ln.d; ln.d = d2;
      draw(ln);
      anim(ln.chain, [{ transform: 'scaleY(0.94)' }, { transform: 'none' }], 220, 'cubic-bezier(0.34, 1.56, 0.64, 1)');
      buzz(6); announce(ln);
      return;
    }
  }
  shake(ln.chain); buzz([4, 30, 4]);
}
function addPlate(ln) {
  if (ln.plates >= MAX_PLATES) return;
  ln.plates++; layout(); buzz(6); announce(ln);
  ln.el.querySelector('[data-act="add"]').hidden || ln.el.querySelector('[data-act="add"]').focus();
}
function removePlate(ln) {
  if (ln.plates <= 1) return;
  if (ln.m > (ln.plates - 1) * ln.d) { shake(ln.chain); buzz([4, 30, 4]); return; }   // its bricks hold it on
  ln.plates--; layout(); buzz(6); announce(ln);
}
function setBricks(ln, m) {
  m = Math.max(0, Math.min(ln.plates * ln.d, m));
  if (m === ln.m) return;
  ln.m = m; draw(ln); buzz(3);
}
// Pouring: the top bricks drop onto the bottom plates after its bricks. They only snap onto studs their
// own size; otherwise they bounce back.
function pour() {
  const [a, b] = lanes;
  if (!a.m) { shake(pourBtn); return; }
  if (a.d !== b.d) {
    anim(a.chain, [{ transform: 'translateY(0)' }, { transform: 'translateY(18px)' }, { transform: 'translateY(-4px)' }, { transform: 'translateY(0)' }], 420, 'ease-in-out');
    buzz([4, 30, 4]);
    live.textContent = 'The bricks do not fit those studs.';
    return;
  }
  const need = Math.ceil((a.m + b.m) / b.d);
  if (need > MAX_PLATES) { shake(b.chain); buzz([4, 30, 4]); return; }
  const from = a.chain.getBoundingClientRect(), to = b.chain.getBoundingClientRect();
  const ghost = a.chain.cloneNode(true);
  ghost.style.cssText = `position:fixed;left:${from.left}px;top:${from.top}px;z-index:20;pointer-events:none;`;
  ghost.querySelectorAll('rect[fill="#8F9399"], rect[fill="#9DA1A7"], line, rect[fill^="rgba"]').forEach(n => n.remove());
  document.body.appendChild(ghost);
  const dx = to.left - from.left + (b.m % b.d) * (WHOLE / b.d) + Math.floor(b.m / b.d) * (WHOLE + 6), dy = to.top - from.top;
  const startM = a.m;
  a.m = 0; draw(a);
  const done = () => { ghost.remove(); b.plates = Math.max(b.plates, need); b.m += startM; layout(); buzz(12); announce(b); };
  const an = anim(ghost, [{ transform: 'translate(0,0)' }, { transform: `translate(${dx}px, ${dy}px)` }], 520, 'cubic-bezier(0.5, 0, 0.6, 1)');
  if (an) an.onfinish = done; else done();
}

// ═══════ POINTER ═══════
// Tap a stud to snap bricks on up to it; drag along to lay or lift; tap the last brick to lift it.
const strokes = new Map();
const studAt = (ln, clientX) => {
  const r = ln.chain.getBoundingClientRect(), x = clientX - r.left, { part, gap } = ln.geom;
  const p = Math.max(0, Math.min(ln.plates - 1, Math.floor(x / (WHOLE + gap))));
  const k = Math.max(0, Math.min(ln.d - 1, Math.floor((x - p * (WHOLE + gap)) / part)));
  return p * ln.d + k;
};
lanes.forEach(ln => {
  ln.chain.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { ln.chain.setPointerCapture(e.pointerId); } catch (err) {}
    const n = studAt(ln, e.clientX);
    strokes.set(e.pointerId, { ln, n0: n, m0: ln.m, moved: false });
    if (n >= ln.m) setBricks(ln, n + 1);
  });
  ln.chain.addEventListener('pointermove', e => {
    const s = strokes.get(e.pointerId);
    if (!s) return;
    const n = studAt(ln, e.clientX);
    if (n !== s.n0) s.moved = true;
    if (s.moved) setBricks(ln, n + 1);
  });
  const end = e => {
    const s = strokes.get(e.pointerId);
    if (!s) return;
    strokes.delete(e.pointerId);
    if (!s.moved && s.n0 < s.m0) setBricks(ln, s.n0 === s.m0 - 1 ? s.m0 - 1 : s.n0 + 1);   // tap inside: lift back to there
    announce(ln);
  };
  ln.chain.addEventListener('pointerup', end);
  ln.chain.addEventListener('pointercancel', end);
  // keyboard: arrows on a focused lane
  ln.el.addEventListener('keydown', e => {
    if (e.target !== ln.el) return;
    const act = { ArrowRight: () => setBricks(ln, ln.m + 1), ArrowLeft: () => setBricks(ln, ln.m - 1), ArrowUp: () => repartition(ln, 1), ArrowDown: () => repartition(ln, -1) }[e.key];
    if (!act) return;
    e.preventDefault(); act(); announce(ln);
  });
});
pourBtn.addEventListener('click', pour);

recordBtn.addEventListener('click', () => {
  const on = !document.body.classList.contains('rec');
  document.body.classList.toggle('rec', on);
  recordBtn.classList.toggle('active', on);
  recordBtn.setAttribute('aria-pressed', String(on));
  lanes.forEach(draw);
  if (on) live.textContent = lanes.map((l, i) => `${i ? 'Bottom' : 'Top'}: ${spoken(l)}`).join('. ') + '.';
});
clearBtn.addEventListener('click', () => {
  lanes.forEach((l, i) => Object.assign(l, START[i]));
  layout(); buzz(8); live.textContent = 'Fresh plates.';
});
let rf = 0;
