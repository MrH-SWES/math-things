<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>Math Things. | Nets</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --text-main: #1D1D1F;
      --text-gray: #86868B;
      --text-light: #AEAEB2;
      --surface: #FFFFFF;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --shadow-raised: 6px 6px 14px rgba(166,171,189,0.45), -6px -6px 14px rgba(255,255,255,0.9);
      --shadow-milled: inset 3px 3px 6px rgba(166,171,189,0.9), inset -3px -3px 6px rgba(255,255,255,1);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Lexend', sans-serif;
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      /* the mat: warm, quiet ceramic */
      background: radial-gradient(ellipse at 50% 38%, #FBF9F6 0%, #F2EFEA 58%, #E8E4DD 100%);
    }

    #stage { flex: 1; min-height: 0; position: relative; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; cursor: grab; }
    #record { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 4; font-weight: 900; font-size: clamp(18px, 2.8vw, 30px); opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
    #record.on { opacity: 1; }
    #record .op { color: var(--text-light); font-weight: 400; margin: 0 0.2em; }
    @media (max-width: 600px) { #record { top: 62px; font-size: 15px; } }
    .dims { display: flex; gap: 10px; align-items: center; }
    .dim { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .knob { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; background: var(--surface); box-shadow: var(--shadow-raised); color: var(--text-gray); font: 600 16px 'Lexend', sans-serif; cursor: pointer; padding: 0; line-height: 1; }
    .knob:disabled { opacity: 0.35; cursor: default; }
    .knob:focus-visible { border-color: #007AFF; outline: none; }
    .dim svg { width: 26px; height: 26px; }
    #fold { -webkit-appearance: none; appearance: none; width: clamp(140px, 26vw, 260px); height: 10px; border-radius: 5px; background: linear-gradient(180deg, #D5D7DB, #ECEEF1); box-shadow: var(--shadow-milled); outline: none; }
    #fold::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #A9ADB3); box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: grab; }
    #fold::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #A9ADB3); border: none; }
    #fold:focus-visible { box-shadow: 0 0 0 3px #007AFF; }
    .foldrow { display: flex; align-items: center; gap: 10px; }
    #cabinet { flex-wrap: wrap; justify-content: center; }
    /* ── CABINET ── */
    #dock { flex-shrink: 0; display: flex; justify-content: center; padding: 0 12px; }
    #cabinet {
      display: flex; align-items: center;
      gap: clamp(8px, 1.6vw, 16px);
      padding: 12px clamp(12px, 2vw, 20px);
      border-radius: 24px 24px 0 0;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.16) 0 1px, rgba(0,0,0,0.018) 1px 2px, transparent 2px 4px),
        linear-gradient(180deg, #EFF0F3 0%, #DADCE1 100%);
      border: 1px solid rgba(0,0,0,0.06);
      border-bottom: none;
      box-shadow: 0 -8px 22px rgba(110,95,75,0.12), inset 0 1px 0 rgba(255,255,255,0.95);
    }
    #bins { display: flex; gap: clamp(6px, 1.2vw, 12px); }
    .bin {
      width: clamp(58px, 11vw, 88px);
      height: clamp(52px, 9vw, 72px);
      border: 2px solid transparent; border-radius: 16px;
      background: linear-gradient(180deg, #ECEEF1 0%, #F6F7F9 100%);
      box-shadow: var(--shadow-raised);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.2s var(--spring), box-shadow 0.2s;
    }
    /* the chosen bin sits pressed into the cabinet */
    .bin[aria-pressed="true"] { background: linear-gradient(180deg, #DFE1E6 0%, #ECEEF1 100%); box-shadow: var(--shadow-milled); }
    .bin:active { transform: scale(0.97); }
    .bin:focus-visible { border-color: #007AFF; }
    .bin svg { width: 72%; height: 72%; overflow: visible; pointer-events: none; }
    .hardware { display: flex; flex-direction: column; gap: 10px; padding-left: clamp(4px, 1vw, 10px); border-left: 1px solid rgba(0,0,0,0.07); }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--surface); border: 2px solid transparent;
      box-shadow: var(--shadow-raised);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.25s var(--spring); outline: none;
      color: var(--text-gray); padding: 0;
    }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn.active { box-shadow: var(--shadow-milled); color: var(--text-main); }
    .icon-btn:focus-visible { border-color: #007AFF; }

    /* ── FOOTER ── */
    #footer {
      flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase;
      color: var(--text-light); letter-spacing: 0.5px;
      background: linear-gradient(180deg, #DADCE1 0%, #E4E6EA 100%);
    }
    .footer-bead { display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--text-light); margin: 0 4px; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @media (max-width: 600px) { #bins { display: grid; grid-template-columns: repeat(3, auto); } .bin { width: 70px; height: 50px; } }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body>
<main id="stage" aria-label="A solid and its net"></main>
<div id="record" aria-hidden="true"></div>

<div id="dock">
  <div id="cabinet" role="toolbar" aria-label="Controls">
    <div id="bins">
      <button class="bin" data-kind="box" aria-label="Rectangular prism" aria-pressed="true"><svg viewBox="0 0 44 38" aria-hidden="true"><path d="M6 14l10-6h22l-10 6z" fill="#8FB0FF"/><path d="M6 14h22v18H6z" fill="#4169E1"/><path d="M28 14l10-6v18l-10 6z" fill="#2F51B8"/></svg></button>
      <button class="bin" data-kind="prism" aria-label="Triangular prism" aria-pressed="false"><svg viewBox="0 0 44 38" aria-hidden="true"><path d="M13 12l22-6-9 18z" fill="#6D8CF0"/><path d="M4 30h22L13 12z" fill="#FF9F0A"/><path d="M26 30l9-6V6l-9 18z" fill="#2F51B8"/></svg></button>
      <button class="bin" data-kind="pyramid" aria-label="Square pyramid" aria-pressed="false"><svg viewBox="0 0 44 38" aria-hidden="true"><path d="M22 4L6 30l16 4z" fill="#FF9F0A"/><path d="M22 4l16 26-16 4z" fill="#D67F00"/></svg></button>
    </div>
    <div class="dims" id="dims"></div>
    <div class="foldrow">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 8l7-4 7 4v8l-7 4-7-4z" fill="none" stroke="#86868B" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <input id="fold" type="range" min="0" max="100" value="0" aria-label="Unfold">
      <svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true"><path d="M9 2h8v6h7v6h-7v6H9v-6H2V8h7z" fill="none" stroke="#86868B" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
    <div class="hardware">
      <button class="icon-btn" id="recordBtn" aria-label="Show the face areas" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 8s2.6-4.6 7-4.6S15 8 15 8s-2.6 4.6-7 4.6S1 8 1 8z"/><circle cx="8" cy="8" r="2.3"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="footer">Math Things <span class="footer-bead"></span> | Math, in your hands <span class="footer-bead"></span></div>
<div id="live" class="sr-only" aria-live="polite"></div>

<script type="module">
import * as THREE from 'three';

// A solid built from hinged faces. The slider turns every hinge from folded (90°, or the pyramid's lean) to flat.
const COLORS = { base: 0xE8E2D6, side: 0x4169E1, end: 0xDC143C, top: 0x4CBB17, tri: 0xFF9F0A };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz = n => { if (reduceMotion || !navigator.vibrate) return; try { navigator.vibrate(n); } catch (e) {} };
const $ = id => document.getElementById(id);
const stage = $('stage'), live = $('live'), record = $('record'), fold = $('fold');

let kind = 'box', dims = { box: { L: 4, W: 2, H: 3 }, prism: { L: 5, B: 6, S: 5 }, pyramid: { B: 4, S: 3 } }, t = 0, yaw = -0.5, recordOn = false;

// ═══════ SCENE ═══════
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const canvas = renderer.domElement;
canvas.tabIndex = 0; canvas.setAttribute('role', 'img');
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cfc2, 2.1));
const sun = new THREE.DirectionalLight(0xfff6ea, 2.0);
sun.position.set(-4, 10, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 }); sun.shadow.bias = -0.0005;
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ color: 0x2b2116, opacity: 0.18 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.01; floor.receiveShadow = true; scene.add(floor);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
const model = new THREE.Group(); scene.add(model);
let hinges = [];   // { group, axis: 'x'|'z', folded: angle }

// A face lies flat in the xz-plane, starting at its hinge (z = 0) and running out along +z.
// Rectangles are ruled into unit squares; triangles get their outline.
function face(w, d, color, tri = false) {
  const g = new THREE.Group();
  let geo;
  if (tri) { const sh = new THREE.Shape(); sh.moveTo(-w / 2, 0); sh.lineTo(w / 2, 0); sh.lineTo(0, d); sh.closePath(); geo = new THREE.ShapeGeometry(sh); }
  else geo = new THREE.PlaneGeometry(w, d).translate(0, d / 2, 0);
  geo.rotateX(Math.PI / 2);   // shape y → +z, facing down; flip so it faces up when flat
  geo.scale(1, -1, 1);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.6, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1 }));
  m.castShadow = m.receiveShadow = true; g.add(m);
  const pts = [];
  if (!tri) {
    for (let i = 0; i <= w; i++) pts.push(-w / 2 + i, 0, 0, -w / 2 + i, 0, d);
    for (let j = 0; j <= d; j++) pts.push(-w / 2, 0, j, w / 2, 0, j);
  } else pts.push(-w / 2, 0, 0, w / 2, 0, 0, w / 2, 0, 0, 0, 0, d, 0, 0, d, -w / 2, 0, 0);
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const lines = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x1D1D1F, transparent: true, opacity: 0.35 }));
  g.add(lines);
  return g;
}
// hinge a face on an edge of its parent: the pivot sits at `at`, turned by `yawTurn` so the face runs outward
function hinge(parent, at, yawTurn, folded, f) {
  const turn = new THREE.Group(); turn.position.copy(at); turn.rotation.y = yawTurn; parent.add(turn);
  const pivot = new THREE.Group(); turn.add(pivot); pivot.add(f);
  hinges.push({ pivot, folded });
  return pivot;
}

function build() {
  model.clear(); hinges = [];
  if (kind === 'box') {
    const { L, W, H } = dims.box, R = -Math.PI / 2;   // a 90° fold lifts a face straight up
    const base = face(L, W, COLORS.base); base.position.z = -W / 2; model.add(base);
    // front and back (L × H), left and right (W × H); the top rides on the back
    hinge(model, new THREE.Vector3(0, 0, W / 2), 0, R, face(L, H, COLORS.side));
    const back = hinge(model, new THREE.Vector3(0, 0, -W / 2), Math.PI, R, face(L, H, COLORS.side));
    hinge(back, new THREE.Vector3(0, 0, H), 0, R, face(L, W, COLORS.top));
    hinge(model, new THREE.Vector3(L / 2, 0, 0), Math.PI / 2, R, face(W, H, COLORS.end));
    hinge(model, new THREE.Vector3(-L / 2, 0, 0), -Math.PI / 2, R, face(W, H, COLORS.end));
  } else if (kind === 'prism') {
    // a tent: two slanted sides meet at the ridge; a triangle closes each end
    const { L, B, S } = dims.prism, lean = -(Math.PI - Math.acos((B / 2) / S)), h = triH();
    const base = face(B, L, COLORS.base); base.position.z = -L / 2; model.add(base);
    hinge(model, new THREE.Vector3(B / 2, 0, 0), Math.PI / 2, lean, face(L, S, COLORS.side));
    hinge(model, new THREE.Vector3(-B / 2, 0, 0), -Math.PI / 2, lean, face(L, S, COLORS.side));
    hinge(model, new THREE.Vector3(0, 0, L / 2), 0, -Math.PI / 2, face(B, h, COLORS.tri, true));
    hinge(model, new THREE.Vector3(0, 0, -L / 2), Math.PI, -Math.PI / 2, face(B, h, COLORS.tri, true));
  } else {
    const { B, S } = dims.pyramid, lean = -(Math.PI - Math.acos((B / 2) / S));   // each triangle leans in to meet at the top
    const base = face(B, B, COLORS.base); base.position.z = -B / 2; model.add(base);
    for (let k = 0; k < 4; k++) {
      const a = k * Math.PI / 2;
      hinge(model, new THREE.Vector3(Math.sin(a) * B / 2, 0, Math.cos(a) * B / 2), a, lean, face(B, S, COLORS.tri, true));
    }
  }
  pose(); frameCamera(); drawRecord();
}
// the height of the prism's end triangle, from its base side and slant sides
const triH = () => Math.sqrt(dims.prism.S ** 2 - (dims.prism.B / 2) ** 2);
function pose() {
  for (const h of hinges) h.pivot.rotation.x = h.folded * (1 - t);
  model.rotation.y = yaw * (1 - t);   // the net settles square to the screen
  draw();
}

// the camera rises from a three-quarter view to straight above as the net opens
function frameCamera() {
  // the flat net's extent across (x) and from front to back (z), and where its middle is
  let ex, ez, cz = 0;
  if (kind === 'box') { const { L, W, H } = dims.box; ex = L + 2 * H; ez = 2 * W + 2 * H; cz = -W / 2; }
  else if (kind === 'prism') { const { L, B, S } = dims.prism; ex = B + 2 * S; ez = L + 2 * triH(); }
  else { const { B, S } = dims.pyramid; ex = ez = B + 2 * S; }
  const w = stage.clientWidth, h = stage.clientHeight, aspect = w / h, tan = Math.tan(17.5 * Math.PI / 180);
  const flat = Math.max(ez / 2, ex / 2 / aspect) * 1.32 / tan;            // straight down, the whole net fits
  const solid = Math.max(ex, ez) * 0.58 / tan / Math.min(1, aspect);     // folded, the solid fills a good part of the screen
  const dist = solid + (flat - solid) * t;
  const a = 0.95 + t * (Math.PI / 2 - 0.96);   // from about 54° up to overhead
  const look = new THREE.Vector3(0, (1 - t) * 0.6, cz * t);
  camera.position.set(0, look.y + Math.sin(a) * dist, look.z + Math.cos(a) * dist);
  camera.lookAt(look);
  camera.updateProjectionMatrix();
}
function resize() { renderer.setSize(stage.clientWidth, stage.clientHeight, false); camera.aspect = stage.clientWidth / stage.clientHeight; frameCamera(); draw(); }

// ═══════ RECORD ═══════
// The faces' areas, added up: the surface area. Same-sized faces are listed side by side.
function drawRecord() {
  let parts;
  if (kind === 'box') { const { L, W, H } = dims.box; parts = [L * W, L * W, L * H, L * H, W * H, W * H]; }
  else if (kind === 'prism') { const { L, B, S } = dims.prism, tri = B * triH() / 2; parts = [B * L, S * L, S * L, tri, tri]; }
  else { const { B, S } = dims.pyramid; parts = [B * B, ...Array(4).fill(B * S / 2)]; }
  // an end triangle's area isn't always whole; it shows to one decimal place
  parts = parts.map(v => Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v) : Math.round(v * 10) / 10);
  const total = Math.round(parts.reduce((p, q) => p + q, 0) * 10) / 10;
  record.innerHTML = parts.join('<span class="op">+</span>') + `<span class="op">${parts.some(v => !Number.isInteger(v)) ? '≈' : '='}</span>${total}`;
}

// ═══════ CONTROLS ═══════
const DIMS = {
  box: [['L', 'length', 1, 6], ['W', 'width', 1, 6], ['H', 'height', 1, 6]],
  prism: [['L', 'length', 1, 6], ['B', 'base side', 2, 6], ['S', 'slant side', 2, 7]],
  pyramid: [['B', 'base side', 2, 6], ['S', 'slant height', 2, 7]],
};
const glyph = (k) => ({
  L: '<path d="M3 18h20M3 15v6M23 15v6" stroke="#4169E1" stroke-width="2"/>',
  W: '<path d="M6 21l14-12M4 18l4 5M18 6l4 5" stroke="#DC143C" stroke-width="2"/>',
  H: '<path d="M13 3v20M10 3h6M10 23h6" stroke="#4CBB17" stroke-width="2"/>',
  B: '<path d="M3 18h20M3 15v6M23 15v6" stroke="#8E8E93" stroke-width="2"/>',
  S: '<path d="M13 3L5 22" stroke="#FF9F0A" stroke-width="2"/><path d="M13 3l8 19" stroke="#FF9F0A" stroke-width="1" opacity="0.4"/>',
}[k]);
function drawDims() {
  $('dims').innerHTML = DIMS[kind].map(([k, name, lo, hi]) => {
    const v = dims[kind][k];
    // the slant must be longer than half the base, or the triangles can't meet
    const minV = k === 'S' ? Math.floor(dims[kind].B / 2) + 1 : lo;
    return `<div class="dim"><button class="knob" data-k="${k}" data-d="1" aria-label="Longer ${name}" ${v < hi ? '' : 'disabled'}>+</button><svg viewBox="0 0 26 26" aria-hidden="true">${glyph(k)}</svg><button class="knob" data-k="${k}" data-d="-1" aria-label="Shorter ${name}" ${v > minV ? '' : 'disabled'}>−</button></div>`;
  }).join('');
}
$('dims').addEventListener('click', e => {
  const b = e.target.closest('.knob'); if (!b || b.disabled) return;
  const k = b.dataset.k, d = +b.dataset.d, D = dims[kind];
  D[k] += d;
  if (D.S !== undefined && D.S <= D.B / 2) D.S = Math.floor(D.B / 2) + 1;
  buzz(5); build(); drawDims();
  const again = $('dims').querySelector(`.knob[data-k="${k}"][data-d="${d}"]`); if (again && !again.disabled) again.focus();
  live.textContent = Object.values(D).join(' by ') + '.';
});
document.querySelectorAll('.bin').forEach(b => b.addEventListener('click', () => {
  kind = b.dataset.kind;
  document.querySelectorAll('.bin').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
  canvas.setAttribute('aria-label', { box: 'A rectangular prism', prism: 'A triangular prism', pyramid: 'A square pyramid' }[kind]);
  build(); drawDims(); buzz(6);
}));
fold.addEventListener('input', () => {
  const was = t; t = fold.value / 100; pose(); frameCamera();
  if ((was < 1 && t === 1) || (was > 0 && t === 0)) buzz(8);
  fold.setAttribute('aria-valuetext', t === 0 ? 'folded' : t === 1 ? 'flat' : 'opening');
});
$('recordBtn').addEventListener('click', () => { recordOn = !recordOn; record.classList.toggle('on', recordOn); $('recordBtn').classList.toggle('active', recordOn); $('recordBtn').setAttribute('aria-pressed', String(recordOn)); });

// drag the mat to turn the solid around
let spin = null;
canvas.addEventListener('pointerdown', e => { spin = { id: e.pointerId, x: e.clientX, yaw }; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} });
canvas.addEventListener('pointermove', e => { if (spin && spin.id === e.pointerId) { yaw = spin.yaw + (e.clientX - spin.x) / 120; pose(); } });
canvas.addEventListener('pointerup', () => { spin = null; });
canvas.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); yaw += e.key === 'ArrowLeft' ? -0.2 : 0.2; pose(); } });

let frame = 0;
function draw() { cancelAnimationFrame(frame); frame = requestAnimationFrame(() => renderer.render(scene, camera)); }
addEventListener('resize', resize);
addEventListener('contextmenu', e => e.preventDefault());
resize(); build(); drawDims();
window.__nets = { set: v => { fold.value = v; fold.dispatchEvent(new Event('input')); } };   // used by the screen tests
</script>
<script src="../../math-things-home.js"></script>
</body>
</html>
