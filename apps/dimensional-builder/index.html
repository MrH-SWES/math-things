<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dimensional Builder | Math Things.</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#f4f1e9;
      --surface:#fbfaf6;
      --ink:#252321;
      --muted:#8d8981;
      --rail:#a8a7a2;
      --red:#DC143C;
      --red-hi:#ef4762;
      --red-dark:#971028;
      --red-side:#b51231;
      --red-top:#f06b7e;
      --metal1:#f4f5f5;
      --metal2:#a9afb2;
      --metal3:#697074;
      --shadow:rgba(51,43,31,.18);
      --spring:cubic-bezier(.34,1.56,.64,1);
    }

    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{
      font-family:Lexend,system-ui,sans-serif;
      background:
        radial-gradient(circle at 50% 8%,rgba(255,255,255,.92),transparent 42%),
        linear-gradient(180deg,#f7f4ed 0%,#ece7dc 100%);
      color:var(--ink);
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
    }

    .app{
      width:100%;
      height:100%;
      min-height:420px;
      display:grid;
      grid-template-rows:48px 1fr 36px;
    }

    header{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      padding:0 14px 0 16px;
      border-bottom:1px solid rgba(58,48,34,.09);
      background:rgba(250,249,245,.78);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      z-index:20;
    }

    .brand{
      justify-self:start;
      font-weight:900;
      font-size:13px;
      letter-spacing:-.03em;
      color:#4c4944;
      white-space:nowrap;
    }
    .brand .dot{
      display:inline-block;
      width:.34em;height:.34em;border-radius:50%;
      margin-left:.06em;vertical-align:.12em;
      background:linear-gradient(135deg,#f3f4f4,#92999c,#e8e9e9);
      box-shadow:inset 1px 1px 1px rgba(255,255,255,.9),inset -1px -1px 1px rgba(0,0,0,.18);
    }

    .dim-state{
      display:flex;
      align-items:center;
      gap:8px;
      height:28px;
      padding:0 9px;
      border-radius:14px;
      background:rgba(255,255,255,.54);
      border:1px solid rgba(60,52,42,.08);
    }
    .dim-icon{
      width:24px;height:18px;display:grid;place-items:center;
      opacity:.24;
      transition:opacity .22s ease,transform .22s var(--spring);
    }
    .dim-icon.active{opacity:.82;transform:scale(1.08)}
    .dim-icon svg{display:block}

    .controls{
      justify-self:end;
      display:flex;gap:6px;
    }
    .ctrl{
      width:32px;height:32px;border:1px solid rgba(40,36,31,.10);
      border-radius:10px;background:rgba(255,255,255,.68);
      color:#66635e;font:800 15px/1 Lexend;display:grid;place-items:center;
      box-shadow:0 2px 6px rgba(50,43,34,.05);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .ctrl:active{transform:scale(.95)}
    .ctrl.off{opacity:.38}

    .world{
      position:relative;
      min-height:0;
      overflow:hidden;
    }
    canvas{
      position:absolute;inset:0;width:100%;height:100%;
      display:block;
    }

    .handle{
      position:absolute;
      width:42px;height:42px;
      margin:-21px 0 0 -21px;
      border:0;background:transparent;
      padding:0;
      cursor:grab;
      touch-action:none;
      z-index:12;
      -webkit-tap-highlight-color:transparent;
      transition:opacity .2s ease,filter .2s ease;
    }
    .handle:active{cursor:grabbing}
    .handle.disabled{opacity:.14;pointer-events:none;filter:grayscale(1)}
    .knob{
      position:absolute;inset:5px;border-radius:50%;
      display:grid;place-items:center;
      font:800 13px/1 Lexend;color:#383a3b;
      background:
        radial-gradient(circle at 32% 26%,rgba(255,255,255,.98) 0 10%,transparent 11%),
        linear-gradient(145deg,var(--metal1) 0%,#d4d7d8 28%,var(--metal2) 56%,#e8eaea 75%,var(--metal3) 100%);
      border:1px solid #777d80;
      box-shadow:
        inset 1px 1px 1px rgba(255,255,255,.95),
        inset -2px -2px 3px rgba(45,51,54,.20),
        0 4px 8px rgba(48,43,37,.20);
      transition:transform .18s var(--spring),box-shadow .18s ease;
    }
    .handle:hover .knob,.handle:focus-visible .knob{
      transform:scale(1.08);
      box-shadow:
        inset 1px 1px 1px rgba(255,255,255,.95),
        inset -2px -2px 3px rgba(45,51,54,.20),
        0 5px 12px rgba(48,43,37,.25),
        0 0 0 4px rgba(90,97,101,.10);
    }
    .handle.bump .knob{animation:bump .2s var(--spring)}
    @keyframes bump{0%{transform:scale(1)}55%{transform:scale(1.18)}100%{transform:scale(1)}}

    .record{
      position:absolute;
      left:50%;bottom:15px;
      transform:translateX(-50%);
      z-index:10;
      min-height:42px;
      display:flex;align-items:center;justify-content:center;
      padding:7px 14px;
      border-radius:14px;
      background:rgba(255,255,255,.72);
      border:1px solid rgba(58,48,34,.08);
      box-shadow:0 4px 15px rgba(50,43,34,.06);
      backdrop-filter:blur(15px);
      -webkit-backdrop-filter:blur(15px);
      font-weight:700;
      font-size:clamp(18px,2.4vw,26px);
      letter-spacing:-.025em;
      white-space:nowrap;
      transition:opacity .2s ease,transform .2s var(--spring);
    }
    .record.hidden{opacity:0;transform:translate(-50%,8px);pointer-events:none}
    .record .times{color:#8a8781;margin:0 .34em}
    .record .equals{color:#8a8781;margin:0 .42em}
    .record .result{font-weight:900}

    footer{
      display:flex;align-items:center;justify-content:center;
      font-size:10px;font-weight:700;letter-spacing:.06em;
      color:#9a968e;
      border-top:1px solid rgba(58,48,34,.07);
      background:rgba(250,249,245,.58);
    }

    @media (max-width:620px){
      .app{grid-template-rows:44px 1fr 30px}
      header{padding:0 8px 0 10px}
      .brand{font-size:11px}
      .dim-state{gap:4px;padding:0 5px}
      .dim-icon{width:20px}
      .ctrl{width:29px;height:29px;font-size:13px}
      .handle{width:38px;height:38px;margin:-19px 0 0 -19px}
      .knob{inset:4px}
      .record{bottom:8px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Math Things<span class="dot"></span></div>

      <div class="dim-state" aria-hidden="true">
        <div class="dim-icon active" id="lineIcon">
          <svg width="22" height="14" viewBox="0 0 22 14">
            <path d="M2 7h18" stroke="#5f6264" stroke-width="2" stroke-linecap="round"/>
            <circle cx="3" cy="7" r="2.6" fill="#9da2a4"/><circle cx="19" cy="7" r="2.6" fill="#9da2a4"/>
          </svg>
        </div>
        <div class="dim-icon" id="gridIcon">
          <svg width="20" height="16" viewBox="0 0 20 16">
            <rect x="2" y="2" width="16" height="12" rx="1" fill="none" stroke="#5f6264" stroke-width="1.5"/>
            <path d="M7.3 2v12M12.7 2v12M2 8h16" stroke="#5f6264" stroke-width="1"/>
          </svg>
        </div>
        <div class="dim-icon" id="solidIcon">
          <svg width="21" height="18" viewBox="0 0 21 18">
            <path d="M4 6l8-4 6 3v8l-8 4-6-3z" fill="none" stroke="#5f6264" stroke-width="1.4"/>
            <path d="M4 6l6 3 8-4M10 9v8" fill="none" stroke="#5f6264" stroke-width="1.1"/>
          </svg>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" id="recordBtn" aria-label="show or hide number record">123</button>
        <button class="ctrl" id="resetBtn" aria-label="reset">↺</button>
      </div>
    </header>

    <main class="world" id="world">
      <canvas id="scene"></canvas>
      <button class="handle" id="xHandle" aria-label="length" tabindex="0"><span class="knob">4</span></button>
      <button class="handle" id="yHandle" aria-label="width" tabindex="0"><span class="knob">1</span></button>
      <button class="handle disabled" id="zHandle" aria-label="height" tabindex="0"><span class="knob">1</span></button>
      <div class="record" id="record"></div>
    </main>

    <footer>Math Things. &nbsp;|&nbsp; Math, in your hands.</footer>
  </div>

<script>
(() => {
  'use strict';

  const MAX = { x: 10, y: 10, z: 8 };
  const state = { x: 4, y: 1, z: 1, record: true };

  const world = document.getElementById('world');
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const handles = {
    x: document.getElementById('xHandle'),
    y: document.getElementById('yHandle'),
    z: document.getElementById('zHandle')
  };
  const record = document.getElementById('record');
  const recordBtn = document.getElementById('recordBtn');
  const resetBtn = document.getElementById('resetBtn');
  const icons = {
    line: document.getElementById('lineIcon'),
    grid: document.getElementById('gridIcon'),
    solid: document.getElementById('solidIcon')
  };

  let geom = null;
  let dpr = Math.min(2, window.devicePixelRatio || 1);
  let drag = null;
  let lastChanged = null;

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

  function resize() {
    const r = world.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    canvas.style.width = r.width + 'px';
    canvas.style.height = r.height + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const w = r.width;
    const h = r.height;
    const cell = clamp(
      Math.min(
        42,
        (w - 150) / (MAX.x + MAX.z * .42),
        (h - 150) / (MAX.y + MAX.z * .32)
      ),
      22,
      42
    );

    const vx = -cell * .40;
    const vy = -cell * .30;
    const maxW = MAX.x * cell + (MAX.z - 1) * Math.abs(vx);
    const maxH = MAX.y * cell + (MAX.z - 1) * Math.abs(vy);

    const left = Math.max(46, (w - maxW) / 2 + (MAX.z - 1) * Math.abs(vx));
    const top = Math.max(42, (h - maxH) / 2 + (MAX.z - 1) * Math.abs(vy) - 6);

    geom = { w, h, cell, vx, vy, ox:left, oy:top };
    render();
  }

  function shade(hex, amount) {
    const n = parseInt(hex.slice(1),16);
    let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    r=clamp(Math.round(r+amount),0,255);
    g=clamp(Math.round(g+amount),0,255);
    b=clamp(Math.round(b+amount),0,255);
    return 'rgb('+r+','+g+','+b+')';
  }

  function voxel(i,j,k) {
    const { cell, vx, vy, ox, oy } = geom;
    const x = ox + i * cell + k * vx;
    const y = oy + j * cell + k * vy;
    const v = { x:vx, y:vy };

    ctx.save();

    // top enamel face
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + cell, y);
    ctx.lineTo(x + cell + v.x, y + v.y);
    ctx.lineTo(x + v.x, y + v.y);
    ctx.closePath();
    const tg = ctx.createLinearGradient(x, y+v.y, x+cell, y);
    tg.addColorStop(0, '#ff93a2');
    tg.addColorStop(.5, '#ef6277');
    tg.addColorStop(1, '#d82a48');
    ctx.fillStyle = tg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(95,9,26,.34)';
    ctx.lineWidth = .7;
    ctx.stroke();

    // left/depth face
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + v.x, y + v.y);
    ctx.lineTo(x + v.x, y + cell + v.y);
    ctx.lineTo(x, y + cell);
    ctx.closePath();
    const sg = ctx.createLinearGradient(x+v.x, y, x, y);
    sg.addColorStop(0, '#8d0e26');
    sg.addColorStop(1, '#b81432');
    ctx.fillStyle = sg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(70,7,19,.40)';
    ctx.stroke();

    // front face
    const fg = ctx.createLinearGradient(x,y,x+cell,y+cell);
    fg.addColorStop(0, '#ef4964');
    fg.addColorStop(.38, '#d81738');
    fg.addColorStop(1, '#aa102d');
    roundRectPath(ctx,x,y,cell,cell,Math.max(2,cell*.07));
    ctx.fillStyle = fg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(101,9,29,.45)';
    ctx.lineWidth = .75;
    ctx.stroke();

    // enamel highlight
    ctx.beginPath();
    ctx.moveTo(x+cell*.14,y+cell*.10);
    ctx.lineTo(x+cell*.68,y+cell*.10);
    ctx.strokeStyle='rgba(255,255,255,.34)';
    ctx.lineWidth=Math.max(1,cell*.045);
    ctx.lineCap='round';
    ctx.stroke();

    ctx.restore();
  }

  function roundRectPath(c,x,y,w,h,r) {
    const rr=Math.min(r,w/2,h/2);
    c.beginPath();
    c.moveTo(x+rr,y);
    c.arcTo(x+w,y,x+w,y+h,rr);
    c.arcTo(x+w,y+h,x,y+h,rr);
    c.arcTo(x,y+h,x,y,rr);
    c.arcTo(x,y,x+w,y,rr);
    c.closePath();
  }

  function drawRail(x1,y1,x2,y2,active=true) {
    ctx.save();
    ctx.lineCap='round';
    ctx.lineWidth=5;
    const g=ctx.createLinearGradient(x1,y1,x2,y2);
    g.addColorStop(0,'rgba(115,120,122,.22)');
    g.addColorStop(.5,'rgba(220,223,223,.82)');
    g.addColorStop(1,'rgba(98,103,105,.28)');
    ctx.strokeStyle=g;
    ctx.globalAlpha=active ? .82 : .26;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.lineWidth=1;
    ctx.strokeStyle='rgba(255,255,255,.72)';
    ctx.beginPath();ctx.moveTo(x1,y1-1);ctx.lineTo(x2,y2-1);ctx.stroke();
    ctx.restore();
  }

  function drawRails() {
    const { cell, vx, vy, ox, oy } = geom;
    const frontBottom = oy + state.y*cell;
    const xY = frontBottom + 18;
    drawRail(ox, xY, ox + MAX.x*cell, xY, true);

    const yX = ox + state.x*cell + 18;
    drawRail(yX, oy, yX, oy + MAX.y*cell, true);

    const ux = vx, uy = vy;
    drawRail(ox-10, oy-10, ox-10 + (MAX.z-1)*ux, oy-10 + (MAX.z-1)*uy, state.y > 1);
  }

  function drawContactShadow() {
    const {cell,vx,vy,ox,oy}=geom;
    const left = ox + (state.z-1)*vx - 8;
    const top = oy + (state.z-1)*vy - 5;
    const width = state.x*cell - (state.z-1)*vx + 18;
    const height = state.y*cell - (state.z-1)*vy + 14;
    ctx.save();
    const g=ctx.createRadialGradient(
      left+width*.55,top+height*.62,5,
      left+width*.55,top+height*.62,Math.max(width,height)*.64
    );
    g.addColorStop(0,'rgba(54,43,29,.16)');
    g.addColorStop(1,'rgba(54,43,29,0)');
    ctx.fillStyle=g;
    ctx.fillRect(left-20,top-20,width+40,height+40);
    ctx.restore();
  }

  function render() {
    if (!geom) return;
    const {w,h}=geom;
    ctx.clearRect(0,0,w,h);

    drawContactShadow();
    drawRails();

    // far layers first; within a layer, upper rows before lower rows
    for (let k=state.z-1;k>=0;k--) {
      for (let j=0;j<state.y;j++) {
        for (let i=0;i<state.x;i++) voxel(i,j,k);
      }
    }

    positionHandles();
    updateRecord();
    updateDimensionIcons();
  }

  function positionHandles() {
    const {cell,vx,vy,ox,oy}=geom;

    placeHandle('x',
      ox + state.x*cell,
      oy + state.y*cell + 18,
      state.x
    );

    placeHandle('y',
      ox + state.x*cell + 18,
      oy + state.y*cell,
      state.y
    );

    const zEnabled = state.y > 1;
    handles.z.classList.toggle('disabled', !zEnabled);
    handles.z.setAttribute('aria-disabled', String(!zEnabled));
    placeHandle('z',
      ox - 10 + (state.z-1)*vx,
      oy - 10 + (state.z-1)*vy,
      state.z
    );
  }

  function placeHandle(axis,x,y,value) {
    const h=handles[axis];
    h.style.left=x+'px';
    h.style.top=y+'px';
    h.querySelector('.knob').textContent=String(value);
  }

  function updateRecord() {
    let html = '';
    if (state.z > 1) {
      html = '<span>'+state.x+'</span><span class="times">×</span><span>'+state.y+'</span><span class="times">×</span><span>'+state.z+'</span><span class="equals">=</span><span class="result">'+(state.x*state.y*state.z)+'</span>';
    } else if (state.y > 1) {
      html = '<span>'+state.x+'</span><span class="times">×</span><span>'+state.y+'</span><span class="equals">=</span><span class="result">'+(state.x*state.y)+'</span>';
    } else {
      html = '<span class="result">'+state.x+'</span>';
    }
    record.innerHTML=html;
    record.classList.toggle('hidden',!state.record);
    recordBtn.classList.toggle('off',!state.record);
  }

  function updateDimensionIcons() {
    icons.line.classList.toggle('active',state.y===1 && state.z===1);
    icons.grid.classList.toggle('active',state.y>1 && state.z===1);
    icons.solid.classList.toggle('active',state.z>1);
  }

  function setAxis(axis,value,withBump=true) {
    const max=MAX[axis];
    let next=clamp(Math.round(value),1,max);
    if (axis==='z' && state.y<=1) next=1;
    if (state[axis]===next) return;
    state[axis]=next;

    if (axis==='y' && state.y===1 && state.z>1) state.z=1;

    if (withBump) {
      handles[axis].classList.remove('bump');
      void handles[axis].offsetWidth;
      handles[axis].classList.add('bump');
      setTimeout(()=>handles[axis].classList.remove('bump'),220);
      if (navigator.vibrate && matchMedia('(pointer:coarse)').matches) {
        try{ navigator.vibrate(5); }catch{}
      }
    }
    lastChanged=axis;
    render();
  }

  function dragStart(axis,e) {
    if (axis==='z' && state.y<=1) return;
    e.preventDefault();
    e.stopPropagation();
    const h=handles[axis];
    h.setPointerCapture(e.pointerId);

    const {cell,vx,vy}=geom;
    const mag=Math.hypot(vx,vy);
    drag={
      axis,
      id:e.pointerId,
      x:e.clientX,
      y:e.clientY,
      start:state[axis],
      cell,
      ux:vx/mag,
      uy:vy/mag,
      depthStep:mag
    };
  }

  function dragMove(axis,e) {
    if (!drag || drag.axis!==axis || drag.id!==e.pointerId) return;
    e.preventDefault();
    const dx=e.clientX-drag.x;
    const dy=e.clientY-drag.y;
    let delta=0;
    if (axis==='x') delta=Math.round(dx/drag.cell);
    if (axis==='y') delta=Math.round(dy/drag.cell);
    if (axis==='z') delta=Math.round((dx*drag.ux+dy*drag.uy)/drag.depthStep);
    setAxis(axis,drag.start+delta,false);
  }

  function dragEnd(axis,e) {
    if (!drag || drag.axis!==axis || drag.id!==e.pointerId) return;
    drag=null;
    handles[axis].classList.remove('bump');
    void handles[axis].offsetWidth;
    handles[axis].classList.add('bump');
    setTimeout(()=>handles[axis].classList.remove('bump'),220);
  }

  Object.entries(handles).forEach(([axis,h])=>{
    h.addEventListener('pointerdown',e=>dragStart(axis,e));
    h.addEventListener('pointermove',e=>dragMove(axis,e));
    h.addEventListener('pointerup',e=>dragEnd(axis,e));
    h.addEventListener('pointercancel',e=>dragEnd(axis,e));
    h.addEventListener('keydown',e=>{
      if (axis==='z' && state.y<=1) return;
      let d=0;
      if (e.key==='ArrowRight'||e.key==='ArrowDown') d=1;
      if (e.key==='ArrowLeft'||e.key==='ArrowUp') d=-1;
      if (!d) return;
      e.preventDefault();
      setAxis(axis,state[axis]+d,true);
    });
  });

  recordBtn.addEventListener('click',()=>{
    state.record=!state.record;
    updateRecord();
  });

  resetBtn.addEventListener('click',()=>{
    state.x=4;state.y=1;state.z=1;
    render();
  });

  const ro = new ResizeObserver(resize);
  ro.observe(world);
  window.addEventListener('resize',resize);
  resize();
})();
</script>
<script src="../../math-things-home.js"></script>
</body>
</html>
