<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Teaching Table | Math Things.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.111.1/mathlive.min.js"></script>
<script>
  // MathLive looks for its fonts beside the script but resolves the folder wrongly from a CDN;
  // point it at the pinned package's fonts. Keypress sounds stay off in the classroom.
  addEventListener('DOMContentLoaded',()=>{if(window.MathfieldElement){
    MathfieldElement.fontsDirectory='https://cdn.jsdelivr.net/npm/mathlive@0.111.1/fonts';
    MathfieldElement.soundsDirectory=null;}});
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script defer src="textbooks.js"></script>
<style>
  :root{
    --glass:rgba(247,246,243,.86);
    --text-main:#1D1D1F;--text-gray:#86868B;--text-light:#AEAEB2;
    --accent:#007AFF;--border:rgba(0,0,0,.08);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --ink:#26262A;--ink-blue:#1F5FD1;
    --key:64px;            /* board-sized touch targets */
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Lexend',system-ui,sans-serif;color:var(--text-main);
    background:radial-gradient(130% 95% at 50% 40%,#FBFAF8 0%,#F3F1ED 55%,#E7E3DC 100%);
    overflow:hidden;user-select:none;-webkit-user-select:none;
    -webkit-font-smoothing:antialiased;touch-action:none;
  }
  button{font:inherit;color:inherit}
  .sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ── THE TABLE AND THE SHEET ── */
  #table{position:fixed;inset:0;overflow:hidden;cursor:default}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .sheet{
    position:absolute;left:0;top:0;background:#FFFEFB;
    box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(60,48,30,.16);
    border-radius:3px;
  }
  #sheet img.page-img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;border-radius:3px}
  /* Blank papers are printed in sheet units, so they zoom with the work. */
  .sheet.lined{background-image:linear-gradient(transparent 39px,rgba(48,96,170,.22) 39px,rgba(48,96,170,.22) 41px);
    background-size:100% 40px;background-position:0 20px}
  .sheet.grid{background-image:linear-gradient(rgba(48,96,170,.16) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(48,96,170,.16) 1.5px,transparent 1.5px);
    background-size:50px 50px;background-position:-.75px -.75px}
  .sheet.dots{background-image:radial-gradient(circle,rgba(48,64,90,.38) 2.4px,transparent 2.8px);
    background-size:50px 50px;background-position:25px 25px}
  .marks{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .marks .hit{pointer-events:stroke;stroke:transparent;fill:none;cursor:grab}
  .marks .hit.area{pointer-events:all;fill:transparent}
  .marks .sel .vis{filter:drop-shadow(0 0 3px rgba(0,122,255,.55))}
  #scratch{display:none}
  #scratch.open{display:block}

  /* ── TYPED MATH ON THE PAGE ── */
  /* An item's y is its vertical centre, so a fraction sits on the line like printed math. */
  .item{position:absolute;line-height:1;white-space:nowrap;transform:translateY(-50%)}
  .item math-field{
    display:inline-block;font-size:inherit;min-width:.8em;padding:.08em .12em;
    background:transparent;border:none;outline:none;color:var(--ink);
    --caret-color:var(--accent);--selection-background-color:rgba(0,122,255,.18);
    --contains-highlight-background-color:transparent;--placeholder-color:#B8B8BE;
  }
  .item math-field::part(menu-toggle),.item math-field::part(virtual-keyboard-toggle){display:none}
  .item .grip{position:absolute;inset:-.18em -.2em;cursor:grab;border-radius:.2em}
  .item.editing .grip{display:none}
  .item.editing{background:rgba(0,122,255,.06);box-shadow:0 0 0 2px rgba(0,122,255,.45);border-radius:.18em}
  .item.selected{box-shadow:0 0 0 2px rgba(0,122,255,.45);border-radius:.18em}
  .item.empty:not(.editing){display:none}
  /* A number box holds one or more lines; Enter starts the next line in the same box. */
  .item.math{display:flex;flex-direction:column;align-items:flex-start}
  .item.math math-field{display:block}

  /* ── COLUMN SETUPS: + − × and long division, one digit to a place ── */
  /* --u is the setup's size in page units, so carries can be small and still stay in their column. */
  .item.algo{transform:none;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);padding:calc(var(--u)*.2) calc(var(--u)*.3)}
  .arow{display:flex;justify-content:flex-end;align-items:center;gap:calc(var(--u)*.1);min-height:calc(var(--u)*1.2)}
  .arow .opc{width:calc(var(--u)*1.1);text-align:center}
  .cell{width:calc(var(--u)*1.05);height:calc(var(--u)*1.15);flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:calc(var(--u)*.16);position:relative}
  .item.algo.editing .cell{background:rgba(0,0,0,.04);cursor:pointer}
  .item.algo .cell.on{background:rgba(0,122,255,.16);box-shadow:inset 0 calc(var(--u)*-.08) 0 var(--accent)}
  .cell.dot::after{content:".";position:absolute;right:calc(var(--u)*-.2);bottom:calc(var(--u)*.02)}
  .arow.ans,.arow.part1{border-top:calc(var(--u)*.07) solid currentColor;margin-top:calc(var(--u)*.08);padding-top:calc(var(--u)*.08)}
  .arow.carry{min-height:calc(var(--u)*.8);margin-bottom:calc(var(--u)*-.06)}
  .arow.carry .cell{height:calc(var(--u)*.8);font-size:.58em;color:#1F5FD1}
  .item.algo.sub .arow.carry .cell{color:#C0392B}
  .lead,.dvsr{display:flex;gap:calc(var(--u)*.1);width:calc(var(--u)*2.2);justify-content:flex-end}
  .pad,.dvnd{display:flex;gap:calc(var(--u)*.1);padding-left:calc(var(--u)*.18);border-left:calc(var(--u)*.07) solid transparent}
  .dvnd{border-left-color:currentColor;border-top:calc(var(--u)*.07) solid currentColor;border-top-left-radius:calc(var(--u)*.16)}

  /* ── DOCK: one row of board-sized controls, within reach ── */
  #dock{
    position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;
    display:flex;align-items:center;gap:10px;padding:8px;border-radius:22px;
    background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 10px 30px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.08);
  }
  .group{display:flex;align-items:center;gap:4px;background:#E5E5EA;border-radius:16px;padding:4px}
  .db{
    width:var(--key);height:var(--key);border:none;border-radius:13px;background:transparent;
    display:flex;align-items:center;justify-content:center;color:#4A4A4F;cursor:pointer;
    transition:background .15s,box-shadow .15s,color .15s,transform .12s;
  }
  .db svg{width:30px;height:30px;display:block}
  .db:active{transform:scale(.94)}
  .db.on{background:#fff;color:var(--text-main);box-shadow:0 1px 4px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.06)}
  .db:disabled{opacity:.3;cursor:default}
  .db:focus-visible,.key:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .pageno{min-width:58px;text-align:center;font-weight:800;font-size:15px;color:#4A4A4F}
  #pager[hidden]{display:none}

  /* ── TRAYS above the dock (paper, marks) ── */
  .tray{
    position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(8px);z-index:39;
    padding:10px;border-radius:20px;background:var(--glass);
    backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
    box-shadow:0 10px 30px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.08);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .22s var(--spring);
    display:flex;gap:8px;align-items:center;
  }
  .tray.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .tile{
    width:86px;height:86px;border:none;border-radius:14px;background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06);
  }
  .tile.on{box-shadow:0 0 0 3px var(--accent)}
  .tile svg{width:46px;height:46px}
  .swatch{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;box-shadow:0 0 0 .5px rgba(0,0,0,.2) inset}
  .swatch.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent)}
  .sep{width:1px;align-self:stretch;background:rgba(0,0,0,.1);margin:4px 2px}
  /* Mini sheets: each blank paper is shown as itself. */
  .mini{width:58px;height:58px;border-radius:4px;background:#FFFEFB;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .mini.lined{background-image:linear-gradient(transparent 9px,rgba(48,96,170,.4) 9px,rgba(48,96,170,.4) 10px);background-size:100% 10px;background-position:0 4px}
  .mini.grid{background-image:linear-gradient(rgba(48,96,170,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(48,96,170,.3) 1px,transparent 1px);background-size:11px 11px}
  .duo{display:flex;gap:5px}.duo .mini{width:30px;height:42px}
  .mini.dots{background-image:radial-gradient(circle,rgba(48,64,90,.6) 1.2px,transparent 1.6px);background-size:11px 11px;background-position:5px 5px}

  /* ── KEYPAD: floats beside the spot being written ── */
  #keypad{
    position:fixed;z-index:45;padding:10px;border-radius:22px;
    background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
    box-shadow:0 14px 40px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.08);
    display:grid;grid-template-columns:repeat(5,var(--key));gap:6px;
    opacity:0;pointer-events:none;transform:scale(.96);transition:opacity .14s,transform .2s var(--spring);
  }
  #keypad.open{opacity:1;pointer-events:auto;transform:scale(1)}
  .key{
    height:var(--key);border:none;border-radius:13px;background:#fff;cursor:pointer;
    font-size:26px;font-weight:600;color:var(--text-main);
    box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.05);
    display:flex;align-items:center;justify-content:center;transition:transform .08s,background .1s;
  }
  .key:active{transform:scale(.93);background:#F2F2F7}
  .key.op{background:#F2F2F5}
  .key.soft{background:transparent;box-shadow:none;color:#5A5A5F}
  .key.done{background:var(--accent);color:#fff}
  .key.wide{grid-column:span 3;font-size:18px;gap:8px}
  /* In a column setup only digits, the point and moving about make sense. */
  #keypad.cells .key:not(.c){opacity:.25;pointer-events:none}
  .key svg{width:28px;height:28px}
  .frac-glyph{display:flex;flex-direction:column;align-items:center;line-height:1;font-size:15px;font-weight:800}
  .frac-glyph i{display:block;width:20px;height:2.5px;background:currentColor;margin:3px 0;border-radius:2px}

  /* ── SELECTION BUTTON (delete) ── */
  #trash{
    position:fixed;z-index:46;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
    background:#fff;color:#C0392B;box-shadow:0 4px 14px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.08);
    display:none;align-items:center;justify-content:center;
  }
  #trash.show{display:flex}
  #trash svg{width:26px;height:26px}
  /* The handle for moving the box being written in (or the one selected). */
  #mover{
    position:fixed;z-index:46;width:56px;height:56px;border-radius:50%;border:none;cursor:grab;touch-action:none;
    background:#fff;color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.08);
    display:none;align-items:center;justify-content:center;
  }
  #mover.show{display:flex}
  #mover:active{cursor:grabbing}
  #mover svg{width:28px;height:28px}
  #algoBar{
    position:fixed;z-index:46;display:none;gap:6px;padding:6px;border-radius:16px;
    background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
    box-shadow:0 8px 24px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.08);
  }
  #algoBar.show{display:flex}
  .ab{height:52px;padding:0 16px;border:none;border-radius:12px;background:#fff;cursor:pointer;font:inherit;font-weight:700;font-size:16px;color:var(--text-main);
    box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.05)}
  .ab:active{transform:scale(.95)}
  .ab:disabled{opacity:.35;cursor:default}
  .ab[hidden]{display:none}
  .alg-glyph{font-size:34px;font-weight:800;color:#3A3A3F;line-height:1}

  /* ── MATH THINGS ── */
  #chest{
    position:fixed;inset:0;z-index:50;background:rgba(40,36,30,.22);
    display:flex;align-items:flex-end;justify-content:center;padding:0 16px 104px;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  #chest.open{opacity:1;pointer-events:auto}
  #chest .shelf{
    width:min(1100px,100%);max-height:calc(100vh - 140px);overflow:auto;padding:18px 20px 22px;border-radius:24px;
    background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
    box-shadow:0 20px 60px rgba(0,0,0,.22);
    transform:translateY(16px);transition:transform .28s var(--spring);
  }
  #chest.open .shelf{transform:none}
  #chest h3{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-gray);margin:14px 4px 8px}
  #chest h3:first-child{margin-top:2px}
  #chest .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .app{
    min-height:var(--key);border:none;border-radius:14px;background:#fff;cursor:pointer;text-align:left;
    padding:12px 14px;font-weight:600;font-size:16px;line-height:1.2;display:flex;align-items:center;gap:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06);
  }
  .app::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--c,#AEAEB2)}

  #windows{position:fixed;inset:0;z-index:30;pointer-events:none}
  .win{
    position:absolute;pointer-events:auto;border-radius:16px;overflow:hidden;background:#fff;
    box-shadow:0 18px 50px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.1);
    display:flex;flex-direction:column;
  }
  .win .bar{
    height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;cursor:grab;touch-action:none;
    background:linear-gradient(#F7F6F3,#EDECE8);border-bottom:1px solid rgba(0,0,0,.07);
    font-weight:700;font-size:15px;color:#4A4A4F;
  }
  .win .bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .win .bar button{width:44px;height:40px;border:none;border-radius:10px;background:transparent;cursor:pointer;color:#6E6E73;display:flex;align-items:center;justify-content:center}
  .win .bar button:active{background:rgba(0,0,0,.06)}
  .win iframe{flex:1;border:0;width:100%;background:#F3F1ED}
  .win .resize{position:absolute;right:0;bottom:0;width:44px;height:44px;cursor:nwse-resize;touch-action:none;
    background:linear-gradient(135deg,transparent 55%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.18) 60%,transparent 60%,transparent 70%,rgba(0,0,0,.18) 70%,rgba(0,0,0,.18) 75%,transparent 75%)}
  .win.moving iframe{pointer-events:none}

  /* ── PHONE SCAN ── */
  #scan{position:fixed;inset:0;z-index:55;background:rgba(40,36,30,.28);display:none;align-items:center;justify-content:center}
  #scan.open{display:flex}
  #scan .card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;gap:12px}
  #qr canvas{display:block}
  #scan .status{font-size:14px;color:var(--text-gray);font-weight:600;min-height:18px}

  .logo{position:fixed;left:18px;top:14px;z-index:20;font-weight:900;font-size:1.25rem;letter-spacing:-.05em;display:inline-flex;align-items:baseline;pointer-events:none}
  .logo-bead{width:.22em;height:.22em;margin-left:.04em;margin-bottom:.08em;border-radius:50%;display:inline-block;
    background:radial-gradient(circle at 33% 28%,rgba(255,255,255,.92) 0%,rgba(255,255,255,.3) 40%,transparent 65%),linear-gradient(135deg,#efefef 0%,#d0d0d0 25%,#a8a8a8 50%,#c0c0c0 75%,#e0e0e0 100%);
    box-shadow:inset 1px 1px 2px rgba(255,255,255,.8),inset -1px -1px 2px rgba(0,0,0,.2),0 2px 5px rgba(0,0,0,.22)}
  /* A textbook page is the sheet: taps go to the table, so the page itself stays still. */
  #sheet iframe.page-frame{position:absolute;left:0;top:0;width:100%;border:0;pointer-events:none;background:#fff;border-radius:3px}

  /* ── THE TEXTBOOK SHELF ── */
  #library{position:fixed;inset:0;z-index:50;background:rgba(40,36,30,.22);display:flex;align-items:flex-end;justify-content:center;
    padding:0 16px 104px;opacity:0;pointer-events:none;transition:opacity .2s}
  #library.open{opacity:1;pointer-events:auto}
  #library .shelf{width:min(1100px,100%);max-height:calc(100vh - 140px);display:flex;flex-direction:column;border-radius:24px;
    background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 20px 60px rgba(0,0,0,.22);overflow:hidden}
  .covers{display:flex;gap:12px;padding:18px 20px;overflow-x:auto;flex:none}
  .cover{flex:none;width:96px;height:128px;border:none;border-radius:10px;cursor:pointer;position:relative;overflow:hidden;
    background:linear-gradient(160deg,#F4F3F0,#E2E0DB);box-shadow:0 2px 6px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.08);
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:900;font-size:30px;color:#4A4A4F}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cover.on{box-shadow:0 0 0 4px var(--accent)}
  .cover .saved{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;background:#34C759;box-shadow:0 0 0 2px #fff}
  .cover.file{font-size:13px;font-weight:700;align-items:center;padding:0}
  .lib-head{display:flex;align-items:center;gap:10px;padding:0 20px 10px}
  .lib-head .title{flex:1;font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lib-head input{width:220px;height:48px;border-radius:12px;border:1px solid rgba(0,0,0,.12);padding:0 14px;font:inherit;font-size:16px;background:#fff}
  .lib-status{padding:0 20px 10px;font-size:14px;font-weight:600;color:var(--text-gray);min-height:20px}
  .lessons{overflow-y:auto;padding:0 12px 16px;flex:1}
  .lesson{display:block;width:100%;min-height:52px;border:none;background:transparent;text-align:left;cursor:pointer;
    padding:12px 14px 12px calc(14px + var(--d,0)*22px);border-radius:12px;font-size:16px;font-weight:500;color:var(--text-main)}
  .lesson[data-depth="0"]{font-weight:800}
  .lesson:hover,.lesson:focus-visible{background:rgba(0,0,0,.05)}
  .lesson.on{background:rgba(0,122,255,.12)}
  #drop{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,122,255,.08);border:4px dashed rgba(0,122,255,.5);pointer-events:none}
  #drop.show{display:flex}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:760px){:root{--key:52px}.db svg{width:24px;height:24px}#dock{gap:6px;padding:6px}}
</style>
</head>
<body>
<div class="logo" aria-hidden="true">Math Things<span class="logo-bead"></span></div>
<div id="table" role="application" aria-label="Teaching table: a worksheet or sheet of paper to work on">
  <div id="world">
    <div id="sheet" class="sheet plain">
      <svg id="marks" class="marks" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <!-- Scratch paper beside the page, as on a desk -->
    <div id="scratch" class="sheet grid">
      <svg id="marks2" class="marks" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>
<div id="windows"></div>

<!-- Paper tray: a worksheet from a file or phone, or a blank sheet -->
<div class="tray" id="paperTray" role="dialog" aria-label="Choose the page">
  <button class="tile" id="openFile" aria-label="Open a worksheet or PDF from this computer" title="Open a worksheet or PDF">

<script>
(() => {
'use strict';
// The phone-scan relay shared with the original Teaching Table.
const WORKER_URL = 'https://teaching-table-relay.ssccchef.workers.dev';
const PAGE_W = 1000;                 // every page is 1000 units wide; marks and math live in these units
const BLANK_H = 1294;                // blank paper: US Letter proportions
const INKS = {graphite:'#26262A', blue:'#1F5FD1'};
const STORE = 'math-things-teaching-table-v3';
const $ = id => document.getElementById(id);
const table=$('table'),world=$('world'),sheet=$('sheet'),marksSvg=$('marks'),keypad=$('keypad'),trash=$('trash');
const scratchEl=$('scratch'),marks2=$('marks2');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const uid=()=>Math.random().toString(36).slice(2,10);

// ── DOCUMENT ──
// doc.pages[i] = {id, w, h, paper, hasImage, lesson?, items:[...]}
// A textbook document holds one lesson page at a time: doc.book = {name, title, total}.
// Work on each lesson page is kept by book and page, so it returns when you do.
// item: {id, type:'math', x, y, size, lines:[latex…]} | {id, type:'mark', shape, ink, x1, y1, x2, y2}
//     | {id, type:'algo', alg:'add'|'sub'|'mul'|'div', x, y, size, cols, frac, rows:[{k, v?|c?, s?}]}
let doc={pages:[{id:uid(),w:PAGE_W,h:BLANK_H,paper:'plain',hasImage:false,items:[]}],page:0};
const ui={tool:'type',shape:'ellipse',ink:'graphite',size:34,editing:null,selected:null,line:0,cell:null};
const view={x:0,y:0,z:1};
const page=()=>doc.pages[doc.page];
// Scratch paper lives on the desk, not in the document: it stays while pages turn and
// worksheets change. Closing it only puts it aside.
let desk={open:false,scratch:{id:'scratch',w:PAGE_W,h:BLANK_H,paper:'grid',items:[]}};
const GAP=48;   // space between the page and the scratch paper
// A surface is one sheet on the table: its data, its element, its marks layer, its place.
const SURF={
  main:{el:sheet,svg:marksSvg,data:()=>page(),x:()=>0},
  scratch:{el:scratchEl,svg:marks2,data:()=>desk.open?desk.scratch:null,x:()=>page().w+GAP},
};
const surfaces=()=>desk.open?['main','scratch']:['main'];
function ownerOf(id){
  for(const k of ['main','scratch']){const d=SURF[k].data();if(d?.items.some(i=>i.id===id))return k}
  return null;
}
// Which sheet a point on the table falls on, in that sheet's own units.
function surfaceAt(w){
  for(const k of surfaces()){
    const d=SURF[k].data(),x=w.x-SURF[k].x();
    if(x>=0&&w.y>=0&&x<=d.w&&w.y<=d.h)return {k,x,y:w.y};
  }
  return null;
}
let lastSurf='main';

// ── IMAGE STORE (IndexedDB) ── worksheet pages are blobs; too big for localStorage.
const idb=new Promise(res=>{
  try{const r=indexedDB.open(STORE,1);
    r.onupgradeneeded=()=>r.result.createObjectStore('images');
    r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch{res(null)}
});
async function putImage(id,blob){const db=await idb;if(!db)return;
  await new Promise(r=>{const t=db.transaction('images','readwrite');t.objectStore('images').put(blob,id);t.oncomplete=t.onerror=r})}
async function getImage(id){const db=await idb;if(!db)return null;
  return new Promise(r=>{const q=db.transaction('images').objectStore('images').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}
const urls=new Map();   // page id → object URL (kept while the page is in the document)
async function imageURL(p){
  if(urls.has(p.id))return urls.get(p.id);
  const b=await getImage(p.id);if(!b)return null;
  const u=URL.createObjectURL(b);urls.set(p.id,u);return u;
}

const lessonKey=l=>STORE+':lesson:'+l.book+':'+l.index;
function save(){
  try{
    localStorage.setItem(STORE,JSON.stringify({doc,size:ui.size,ink:ui.ink}));
    const l=page().lesson;if(l)localStorage.setItem(lessonKey(l),JSON.stringify(page().items));
    localStorage.setItem(STORE+':desk',JSON.stringify(desk));
  }catch{}
}
function lessonItems(l){try{return JSON.parse(localStorage.getItem(lessonKey(l))||'[]')}catch{return []}}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(STORE)||'null');
    if(s?.doc?.pages?.length){doc=s.doc;doc.page=clamp(doc.page|0,0,doc.pages.length-1)}
    if(s?.size)ui.size=s.size;
    if(s?.ink in INKS)ui.ink=s.ink;
    const d=JSON.parse(localStorage.getItem(STORE+':desk')||'null');
    if(d?.scratch?.items)desk=d;
  }catch{}
}

// ── UNDO / REDO ── every change to the page is one step, including clearing it.
const undoStack=[],redoStack=[];
const snap=()=>JSON.stringify({page:doc.page,items:page().items,paper:page().paper,scratch:{items:desk.scratch.items,paper:desk.scratch.paper}});
function record(before){
  const after=snap();if(before===after)return;
  undoStack.push({before,after});if(undoStack.length>300)undoStack.shift();
  redoStack.length=0;syncHistory();save();
}
function restore(state){
  const s=JSON.parse(state);
  if(s.page!==doc.page){doc.page=s.page;}
  page().items=s.items;page().paper=s.paper;
  if(s.scratch){desk.scratch.items=s.scratch.items;desk.scratch.paper=s.scratch.paper}
  renderPage();save();
}
function undo(){finishEdit();const e=undoStack.pop();if(!e)return;redoStack.push(e);restore(e.before);syncHistory();say('Undone')}
function redo(){finishEdit();const e=redoStack.pop();if(!e)return;undoStack.push(e);restore(e.after);syncHistory();say('Redone')}
function syncHistory(){$('undoBtn').disabled=!undoStack.length;$('redoBtn').disabled=!redoStack.length}

// ── VIEW ──
function applyView(){
  world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`;
  placeOverlays();
}
const DOCK_SPACE=104,TOP_SPACE=58;   // the dock below, the logo above
function fit(){
  const p=page(),W=innerWidth,H=innerHeight-DOCK_SPACE-TOP_SPACE;
  // Fit the width of everything on the table: worksheets are read top to bottom, so a
  // tall page scrolls. With scratch paper out, both sheets fit side by side.
  const tw=desk.open?p.w+GAP+desk.scratch.w:p.w,th=desk.open?Math.max(p.h,desk.scratch.h):p.h;
  view.z=clamp(Math.min((W-48)/tw,1.6),.15,6);
  view.x=(W-tw*view.z)/2;
  view.y=TOP_SPACE+(th*view.z<H?(H-th*view.z)/2:0);
  applyView();
}
function zoomAt(f,cx,cy){
  const z=clamp(view.z*f,.15,6);f=z/view.z;
  view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.z=z;applyView();
}
const toPage=(cx,cy)=>({x:(cx-view.x)/view.z,y:(cy-view.y)/view.z});
const toScreen=(x,y)=>({x:view.x+x*view.z,y:view.y+y*view.z});

// ── RENDERING ──
const els=new Map();   // item id → element
async function renderPage(){
  const p=page();
  sheet.style.width=p.w+'px';sheet.style.height=p.h+'px';
  sheet.className='sheet '+(p.hasImage||p.lesson?'':p.paper);
  // The page's surface (scan or textbook page) is rebuilt only when the page changes,
  // so undo and redo never flash it.
  if(sheet.dataset.page!==p.id){
    sheet.dataset.page=p.id;
    sheet.querySelector('img.page-img')?.remove();
    sheet.querySelector('iframe.page-frame')?.remove();
    if(p.lesson)showLesson(p);
    if(p.hasImage){
      const u=await imageURL(p);
      if(u&&page()===p){const img=new Image();img.className='page-img';img.src=u;img.alt='';sheet.prepend(img)}
    }
  }
  sizeMarks(marksSvg,p);
  for(const el of els.values())el.remove();
  els.clear();marksSvg.replaceChildren();marks2.replaceChildren();
  layoutScratch();
  for(const k of surfaces())for(const it of SURF[k].data().items)drawItem(it,k);

// Clean marks: drawn from a drag's two corners, never from the stroke itself.
function markPaths(m){
  const {x1,y1,x2,y2}=m;

  switch(m.shape){
    case 'ellipse':return [`<ellipse cx="${l+w/2}" cy="${t+h/2}" rx="${Math.max(w/2,6)}" ry="${Math.max(h/2,6)}"/>`];
    case 'box':return [`<rect x="${l}" y="${t}" width="${Math.max(w,8)}" height="${Math.max(h,8)}" rx="3"/>`];
    case 'highlight':return [`<rect x="${l}" y="${t}" width="${Math.max(w,8)}" height="${Math.max(h,8)}" rx="3"/>`];
    case 'line':return [`<path d="M${x1} ${y1}L${x2} ${y2}"/>`];

      return [`<path d="M${x1} ${y1}L${x2} ${y2}M${p(.5)}L${x2} ${y2}L${p(-.5)}"/>`];
    }
    case 'check':return [`<path d="M${l} ${t+h*.55}L${l+w*.36} ${t+h}L${l+w} ${t}"/>`];
    case 'cross':return [`<path d="M${l} ${t}L${l+w} ${t+h}M${l+w} ${t}L${l} ${t+h}"/>`];

function drawMark(m,k=ownerOf(m.id)||'main'){

  }

function lineFields(){const el=ui.editing&&els.get(ui.editing);return el?[...el.querySelectorAll('math-field')]:[]}
function activeField(){const f=lineFields();return f[ui.line]||f[0]||null}
// Enter (or the New line key) starts a new line in the same box, under the line being written.

// ── COLUMN SETUPS ── addition, subtraction, multiplication and long division, laid out one

    add:[{k:'carry',c:c()},{k:'op',v:''},{k:'op',v:'',s:'+'},{k:'ans',v:''}],
    sub:[{k:'carry',c:c()},{k:'op',v:''},{k:'op',v:'',s:'−'},{k:'ans',c:c()}],
    mul:[{k:'carry',c:c()},{k:'op',v:''},{k:'op',v:'',s:'×'},{k:'part',c:c()},{k:'part',c:c()},{k:'ans',c:c()}],
    div:[{k:'quot',c:c()},{k:'dvsr',v:''},{k:'dvnd',v:''},{k:'work',c:c()},{k:'work',c:c()},{k:'work',c:c()},{k:'work',c:c()}],
  }[alg];

function cellsOf(it,row){

// More places on the left (tens, hundreds…), or decimal places on the right for addition.
function widen(it,n){

  it.cols+=n;

    if(ui.editing===it.id&&ui.cell?.r===ri)ui.cell.i+=n});

function widenFrac(it,n){

// Where the cursor sits in a number row: the ones place, or the next decimal place.

function cellKey(key){

  el.style.left=it.x+'px';el.style.top=it.y+'px';el.style.fontSize=it.size+'px';el.style.setProperty('--u',it.size+'px');

// ── KEYPAD ──
function openKeypad(){keypad.classList.add('open');placeOverlays()}
function closeKeypad(){keypad.classList.remove('open')}
keypad.addEventListener('pointerdown',e=>e.preventDefault());   // keep focus in the field
keypad.addEventListener('click',e=>{
  const k=e.target.closest('.key');if(!k)return;
  if(k.dataset.done!==undefined){finishEdit();return}
  const it=findItem(ui.editing);if(!it)return;
  if(k.dataset.size){
    it.size=clamp(it.size+Number(k.dataset.size)*4,14,120);if(it.type==='math')ui.size=it.size;
    drawItem(it);placeOverlays();save();activeField()?.focus();return;
  }

    const cmds={deleteBackward:'back',moveToPreviousChar:'left',moveToNextChar:'right'};
    if(k.dataset.nl!==undefined)cellKey('down');

let fracPart=null;   // 'top' or 'bottom' while the keypad is writing a fraction

// Overlays (keypad, delete button) follow the thing they belong to.
function placeOverlays(){

    const r=els.get(ui.editing).getBoundingClientRect();
    const kw=keypad.offsetWidth,kh=keypad.offsetHeight,W=innerWidth,H=innerHeight-DOCK_SPACE;
    // Beside the box, level with its top, so the move and delete handles above it stay clear.
    let x=r.right+24,y=r.top;
    if(x+kw>W-12)x=r.left-kw-24;                       // no room on the right: go left
    if(x<12){x=clamp(r.left,12,W-kw-12);y=r.bottom+18;  // no room either side: go below
      if(y+kh>H)y=r.top-kh-18;}
    keypad.style.left=clamp(x,12,W-kw-12)+'px';keypad.style.top=clamp(y,12,H-kh)+'px';
  }

}
// The box being written in (or the one selected) carries a move handle and a delete button

const mover=$('mover'),algoBar=$('algoBar');

  const r=el.getBoundingClientRect();

  trash.classList.add('show');

  if(isBox){mover.style.left=clamp(r.left-10,8,innerWidth-64)+'px';mover.style.top=top+'px'}
  const it=ui.editing&&findItem(ui.editing);
  algoBar.classList.toggle('show',it?.type==='algo');
  if(it?.type==='algo'){
    const ops=it.rows.filter(x=>x.k==='op').length;
    $('addendMore').hidden=$('addendLess').hidden=it.alg!=='add';
    $('addendMore').disabled=ops>=5;$('addendLess').disabled=ops<=2;$('algoWider').disabled=it.cols>=ALG_MAX;
    algoBar.style.left=clamp(r.left,8,innerWidth-algoBar.offsetWidth-8)+'px';

let moving=null;

function select(id){
  const prev=ui.selected;ui.selected=id;
  for(const x of [prev,id]){if(!x)continue;const el=els.get(x);if(!el)continue;
    if(el instanceof SVGElement)el.classList.toggle('sel',ui.selected===x);else el.classList.toggle('selected',ui.selected===x)}
  showTrash();
}
trash.addEventListener('click',()=>{
  if(ui.editing){
    // Deleting the box being written in is one undo step with its creation and typing.
    const id=ui.editing,before=editBefore||snap();ui.editing=null;editBefore=null;
    closeKeypad();removeItem(id);placeOverlays();record(before);return;
  }
  const id=ui.selected;if(!id)return;
  const before=snap();removeItem(id);select(null);record(before);
});

// ── POINTER: tap to write, drag to pan or draw, pinch to zoom ──
const ptrs=new Map();
let gesture=null;
// Which line of a box, or which place of a setup, a tap landed on.
function pickAt(id,cx,cy){
  const el=els.get(id),it=findItem(id);if(!el||!it)return null;
  if(it.type==='algo'){
    for(const c of el.querySelectorAll('.cell')){const r=c.getBoundingClientRect();
      if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom)return {r:+c.dataset.r,i:+c.dataset.i}}
    return null;
  }
  if(it.type==='math'){const f=[...el.querySelectorAll('math-field')],i=f.findIndex(m=>cy<=m.getBoundingClientRect().bottom);return i<0?f.length-1:i}
  return null;
}
function itemAt(target){
  const el=target.closest?.('.item');if(el)return el.dataset.id;
  const g=target.closest?.('.marks > g');return g?g.dataset.id:null;
}
table.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  table.setPointerCapture(e.pointerId);
  if(ptrs.size===2){
    // A second finger turns whatever was starting into a pinch.
    if(gesture?.kind==='draw')cancelDraw();
    const [a,b]=[...ptrs.values()];
    gesture={kind:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};
    return;
  }
  if(ptrs.size>2)return;
  const at=surfaceAt(toPage(e.clientX,e.clientY)),hit=itemAt(e.target);
  if(hit&&hit===ui.editing){const c=e.target.closest?.('.cell');if(c)setCell(+c.dataset.r,+c.dataset.i)}
  if(hit&&hit!==ui.editing){
    const it=findItem(hit);
    gesture={kind:'item',id:hit,sx:e.clientX,sy:e.clientY,orig:JSON.parse(JSON.stringify(it)),moved:false,at:pickAt(hit,e.clientX,e.clientY)};
  }else if(ui.tool==='mark'&&at&&!hit){
    finishEdit();select(null);lastSurf=at.k;
    gesture={kind:'draw',k:at.k,start:{x:at.x,y:at.y},sx:e.clientX,sy:e.clientY,mark:null};
  }else{
    gesture={kind:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,moved:false,onItem:!!hit};
  }
});
table.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const g=gesture;if(!g)return;
  if(g.kind==='pinch'&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    view.x+=cx-g.cx;view.y+=cy-g.cy;zoomAt(d/g.d,cx,cy);
    g.d=d;g.cx=cx;g.cy=cy;return;
  }
  const dx=e.clientX-g.sx,dy=e.clientY-g.sy,far=Math.hypot(dx,dy)>8;
  if(g.kind==='pan'){
    if(far)g.moved=true;
    if(g.moved){view.x=g.vx+dx;view.y=g.vy+dy;applyView()}
  }else if(g.kind==='item'&&(far||g.moved)){
    if(!g.moved){g.moved=true;g.before=snap();finishEdit();select(g.id);lastSurf=ownerOf(g.id)||lastSurf}
    const it=findItem(g.id),o=g.orig,ux=dx/view.z,uy=dy/view.z;
    if(it.type!=='mark'){it.x=o.x+ux;it.y=o.y+uy}
    else{it.x1=o.x1+ux;it.y1=o.y1+uy;it.x2=o.x2+ux;it.y2=o.y2+uy}
    drawItem(it);showTrash();
  }else if(g.kind==='draw'){
    const w=toPage(e.clientX,e.clientY);
    let p={x:w.x-SURF[g.k].x(),y:w.y};
    if(!g.mark&&!far)return;
    if(!g.mark){g.mark={id:uid(),type:'mark',shape:ui.shape,ink:ui.ink,x1:g.start.x,y1:g.start.y,x2:p.x,y2:p.y}}
    // Straight lines and arrows settle onto level and plumb when they are close.
    if(g.mark.shape==='line'||g.mark.shape==='arrow'){
      const a=Math.atan2(p.y-g.start.y,p.x-g.start.x),len=Math.hypot(p.x-g.start.x,p.y-g.start.y);
      const s=Math.round(a/(Math.PI/4))*(Math.PI/4);
      if(Math.abs(a-s)<.12)p={x:g.start.x+len*Math.cos(s),y:g.start.y+len*Math.sin(s)};
    }
    g.mark.x2=p.x;g.mark.y2=p.y;drawMark(g.mark,g.k);
  }
});
function endPointer(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  const g=gesture;
  if(g?.kind==='pinch'){if(ptrs.size===0)gesture=null;save();return}
  if(ptrs.size)return;
  gesture=null;if(!g)return;
  if(g.kind==='item'){
    if(g.moved){record(g.before);return}
    const it=findItem(g.id);
    if(it.type!=='mark'&&ui.tool==='type')startEdit(it.id,g.at);
    else{finishEdit();select(ui.selected===g.id?null:g.id)}
  }else if(g.kind==='draw'){
    if(g.mark){
      const before=snap(),m=g.mark;
      if(Math.hypot(m.x2-m.x1,m.y2-m.y1)<10&&!['check','cross'].includes(m.shape)){els.get(m.id)?.remove();els.delete(m.id);return}
      SURF[g.k].data().items.push(m);record(before);
    }else if(ui.shape==='check'||ui.shape==='cross'){
      // A tap stamps a check or an X at a readable size.
      const s=34,before=snap();
      const m={id:uid(),type:'mark',shape:ui.shape,ink:ui.ink,x1:g.start.x-s/2,y1:g.start.y-s/2,x2:g.start.x+s/2,y2:g.start.y+s/2};
      SURF[g.k].data().items.push(m);drawMark(m,g.k);record(before);
    }
  }else if(g.kind==='pan'&&!g.moved){
    if(g.onItem)return;   // a tap inside the box being written in only moves its cursor
    const at=surfaceAt(toPage(e.clientX,e.clientY));
    if(ui.tool==='type'&&at)newMathAt(at);
    else{finishEdit();select(null)}
  }
}
function cancelDraw(){if(gesture?.mark){els.get(gesture.mark.id)?.remove();els.delete(gesture.mark.id)}gesture=null}
table.addEventListener('pointerup',endPointer);
table.addEventListener('pointercancel',endPointer);
table.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey)zoomAt(Math.exp(-e.deltaY*.0025),e.clientX,e.clientY);
  else{view.x-=e.deltaX;view.y-=e.deltaY;applyView()}
},{passive:false});

function setTool(t){
  ui.tool=t;finishEdit();select(null);
  $('typeBtn').classList.toggle('on',t==='type');$('typeBtn').setAttribute('aria-pressed',t==='type');
  $('markBtn').classList.toggle('on',t==='mark');$('markBtn').setAttribute('aria-pressed',t==='mark');

}
// toggleTray(null) closes every tray.
function toggleTray(id,force){
  for(const t of document.querySelectorAll('.tray'))if(t.id!==id)t.classList.remove('open');
  const t=id&&$(id);if(t)t.classList.toggle('open',force??!t.classList.contains('open'));
}
$('typeBtn').onclick=()=>{setTool('type');toggleTray('markTray',false)};
$('markBtn').onclick=()=>{
  if(ui.tool==='mark'){toggleTray('markTray');return}
  setTool('mark');toggleTray('markTray',true);
};
$('pageBtn').onclick=()=>toggleTray('paperTray');
$('setupBtn').onclick=()=>toggleTray('setupTray');
// A setup is laid in the middle of what is in view, on the sheet last worked on.
for(const b of document.querySelectorAll('[data-alg]'))b.onclick=()=>{
  toggleTray(null);setTool('type');
  const it=makeAlgo(b.dataset.alg),c=toPage(innerWidth/2,(innerHeight-DOCK_SPACE)/2);
  const at=surfaceAt(c),k=at?.k||(desk.open?lastSurf:'main'),d=SURF[k].data();
  const x=at?at.x:c.x-SURF[k].x(),y=at?at.y:c.y;
  it.x=clamp(x-it.size*3,0,Math.max(0,d.w-it.size*7));it.y=clamp(y-it.size*2.5,0,Math.max(0,d.h-it.size*8));
  const before=snap();d.items.push(it);drawItem(it,k);lastSurf=k;
  // Never on top of other work: step down, then across, until the spot is clear.
  const el=els.get(it.id),gap=16;
  const boxes=d.items.filter(o=>o!==it&&o.type!=='mark').map(o=>els.get(o.id)).filter(Boolean)
    .map(e=>({l:e.offsetLeft,t:e.offsetTop+(e.classList.contains('math')?-e.offsetHeight/2:0),w:e.offsetWidth,h:e.offsetHeight}));
  const hits=()=>boxes.some(o=>it.x<o.l+o.w+gap&&o.l<it.x+el.offsetWidth+gap&&it.y<o.t+o.h+gap&&o.t<it.y+el.offsetHeight+gap);
  for(let n=0;n<60&&hits();n++){
    it.y+=el.offsetHeight/3;
    if(it.y+el.offsetHeight>d.h){it.y=gap;it.x+=el.offsetWidth+gap;if(it.x+el.offsetWidth>d.w)it.x=0}
  }
  drawItem(it,k);
  startEdit(it.id,firstCell(it));editBefore=before;
};

  for(const b of document.querySelectorAll('[data-shape]'))b.classList.toggle('on',b.dataset.shape===ui.shape);

for(const b of document.querySelectorAll('[data-paper]'))b.onclick=()=>{
  // Blank paper replaces the document with one fresh sheet; undo cannot cross documents, so
  // only switch the pattern if the current page is already blank paper.
  const p=page();
  if(desk.open){
    // With scratch paper out, the paper tiles choose its paper.
    const before=snap();desk.scratch.paper=b.dataset.paper;layoutScratch();record(before);syncPaperTiles();
    toggleTray('paperTray',false);return;
  }
  if(!p.hasImage&&!p.lesson&&doc.pages.length===1){const before=snap();p.paper=b.dataset.paper;renderPage();record(before)}
  else newDocument([{id:uid(),w:PAGE_W,h:BLANK_H,paper:b.dataset.paper,hasImage:false,items:[]}]);
  toggleTray('paperTray',false);
};
function syncPaperTiles(){
  const p=page(),cur=desk.open?desk.scratch.paper:(!p.hasImage&&!p.lesson?p.paper:null);
  for(const t of document.querySelectorAll('[data-paper]'))t.classList.toggle('on',t.dataset.paper===cur);
}

// Wiping clears the sheet you last worked on; undo brings it back.
$('clearPage').onclick=()=>{
  const k=desk.open?lastSurf:'main';
  const before=snap();SURF[k].data().items=[];renderPage();record(before);toggleTray('paperTray',false);

function newDocument(pages,book=null){
  finishEdit();
  for(const u of urls.values())URL.revokeObjectURL(u);urls.clear();
  doc={pages,page:0,book};undoStack.length=redoStack.length=0;syncHistory();
  renderPage().then(fit);save();
}

$('openFile').onclick=()=>{$('fileInput').value='';$('fileInput').click()};
$('fileInput').onchange=e=>{const f=e.target.files?.[0];if(f)openFile(f)};
async function openFile(file){
  toggleTray('paperTray',false);say('Opening…');
  try{
    let blobs;
    if(file.type==='application/pdf'||/\.pdf$/i.test(file.name))blobs=await renderPdf(file);
    else blobs=[await normaliseImage(file)];
    await openImages(blobs);
  }catch(err){say('Could not open that file.');console.error(err)}
}
async function openImages(blobs){
  const pages=[];
  for(const b of blobs){
    const bmp=await createImageBitmap(b);
    const p={id:uid(),w:PAGE_W,h:Math.round(PAGE_W*bmp.height/bmp.width),paper:'plain',hasImage:true,items:[]};
    bmp.close?.();await putImage(p.id,b);pages.push(p);
  }
  newDocument(pages);say(pages.length>1?pages.length+' pages':'Worksheet open');
}
// Large photos are scaled to a crisp, storable size.
async function normaliseImage(blob){
  const bmp=await createImageBitmap(blob),max=2400;
  if(bmp.width<=max&&bmp.height<=max){bmp.close?.();return blob}
  const s=max/Math.max(bmp.width,bmp.height),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close?.();
  return new Promise(r=>c.toBlob(r,'image/jpeg',.9));
}
// Every page of a PDF, not just the first.
async function renderPdf(file){
  const lib=window.pdfjsLib;if(!lib)throw new Error('PDF renderer did not load');
  lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const out=[];
  for(let i=1;i<=Math.min(pdf.numPages,40);i++){
    const pg=await pdf.getPage(i),v0=pg.getViewport({scale:1});
    const v=pg.getViewport({scale:clamp(1800/v0.width,1,3)});
    const c=document.createElement('canvas');c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);
    const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:ctx,viewport:v}).promise;
    out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.9)));
  }
  return out;
}

// Phone scan: the same relay as the original table. Phone uploads, the board polls.
let scanTimer=null,scanId=null;
$('openPhone').onclick=()=>{
  toggleTray('paperTray',false);
  scanId=Array.from({length:2},()=>Math.random().toString(36).substring(2,6).toUpperCase()).join('');
  const url=`${WORKER_URL}/u/${scanId}`;
  const qr=$('qr');qr.replaceChildren();
  const c=document.createElement('canvas');qr.append(c);
  if(window.QRCode)QRCode.toCanvas(c,url,{width:260,margin:1});
  $('scanStatus').textContent='';
  $('scan').classList.add('open');
  clearInterval(scanTimer);scanTimer=setInterval(pollScan,1500);pollScan();
};
async function pollScan(){
  const id=scanId;if(!id)return;
  try{
    const r=await fetch(`${WORKER_URL}/image/${id}`);
    if(r.status!==200||id!==scanId)return;
    const data=(await r.text()).trim();if(!data.startsWith('data:image/'))return;
    closeScan();
    const blob=await (await fetch(data)).blob();
    await openImages([await normaliseImage(blob)]);
  }catch{}
}
function closeScan(){clearInterval(scanTimer);scanTimer=null;scanId=null;$('scan').classList.remove('open')}
$('scan').addEventListener('click',e=>{if(e.target.id==='scan')closeScan()});

// ── TEXTBOOKS ──
// A lesson page is drawn by the book's own HTML at the page's width; its height is
// measured once it has laid out, and the marks layer grows to match.
let lessonGen=0;
async function showLesson(p){
  const gen=++lessonGen,B=window.TTBooks;
  if(!B?.book||B.book.name!==p.lesson.book){
    const ok=await B?.openSaved(p.lesson.book).catch(()=>null);
    if(!ok||gen!==lessonGen){if(gen===lessonGen)say('Open the textbook again to show this page.');return}
  }
  let html;
  try{html=await B.renderSection(p.lesson.index)}catch(e){say(e.message);return}
  if(gen!==lessonGen||page()!==p)return;
  const f=document.createElement('iframe');
  f.className='page-frame';f.title=p.lesson.label;f.tabIndex=-1;
  f.setAttribute('sandbox','allow-same-origin');
  f.style.height=p.h+'px';
  f.onload=()=>{
    const measure=()=>{
      try{
        // The body's height, not the document's: a document is never shorter than its frame.
        const d=f.contentDocument,h=Math.max(Math.ceil(d.body?.scrollHeight||0),600);
        if(Math.abs(h-p.h)>2){
          const first=p.h===BLANK_H&&!p.measured;p.h=h;p.measured=true;f.style.height=h+'px';
          sheet.style.height=h+'px';sizeMarks(marksSvg,p);layoutScratch();
          if(first)fit();save();
        }
      }catch{}
    };
    measure();setTimeout(measure,250);setTimeout(measure,1200);
    f.contentDocument?.querySelectorAll('img').forEach(i=>i.addEventListener('load',measure));
  };
  f.srcdoc=html;
  sheet.prepend(f);
}
function openLesson(i){
  const B=window.TTBooks,b=B?.book;if(!b||i<0||i>=b.toc.length)return;
  if(page().lesson)save();   // keep the page we are leaving
  const lesson={book:b.name,index:i,label:b.toc[i].label};
  const p={id:uid(),w:PAGE_W,h:BLANK_H,paper:'plain',hasImage:false,lesson,items:lessonItems(lesson)};
  newDocument([p],{name:b.name,title:b.title,total:b.toc.length});
  closeLibrary();say(lesson.label);
}

const lib={el:$('library'),covers:$('covers'),lessons:$('lessons'),status:$('libStatus'),title:$('bookTitle'),search:$('lessonSearch')};
async function openLibrary(){
  toggleTray(null);finishEdit();
  lib.el.classList.add('open');
  const B=window.TTBooks;if(!B){lib.status.textContent='The textbook reader did not load.';return}
  const saved=await B.savedNames();
  lib.covers.replaceChildren();
  for(const b of B.PACKAGED){
    const c=document.createElement('button');c.className='cover';c.setAttribute('aria-label','Grade '+b.grade+' textbook');
    c.textContent=b.grade;
    const img=new Image();img.alt='';img.onerror=()=>img.remove();img.src=new URL(b.name.replace('.epub','.webp'),B.COVERS).href;c.prepend(img);
    if(saved.has(b.name))c.append(Object.assign(document.createElement('span'),{className:'saved'}));
    c.classList.toggle('on',B.book?.name===b.name);
    c.onclick=()=>pickBook(()=>B.openPackaged(b.grade,f=>{lib.status.textContent='Downloading Grade '+b.grade+': '+Math.round(f*100)+'%'}),saved.has(b.name)?'Opening Grade '+b.grade+'…':'Downloading Grade '+b.grade+'…');
    lib.covers.append(c);
  }
  const f=document.createElement('button');f.className='cover file';f.textContent='EPUB file';
  f.setAttribute('aria-label','Open an EPUB textbook from this computer');
  f.onclick=()=>{$('epubInput').value='';$('epubInput').click()};
  lib.covers.append(f);
  showLessons();
}
$('epubInput').onchange=e=>{const file=e.target.files?.[0];if(file)pickBook(()=>window.TTBooks.openLocal(file),'Opening '+file.name+'…')};
async function pickBook(open,msg){
  lib.status.textContent=msg;lib.lessons.replaceChildren();
  try{await open();lib.status.textContent='';showLessons()}
  catch(e){lib.status.textContent=e.message||'That textbook could not be opened.'}
}
function showLessons(){
  const b=window.TTBooks?.book;
  lib.title.textContent=b?b.title:'';lib.search.hidden=!b;
  for(const c of lib.covers.children)c.classList.toggle('on',!!b&&c.getAttribute('aria-label')==='Grade '+b.grade+' textbook');
  lib.lessons.replaceChildren();if(!b)return;
  const q=lib.search.value.trim().toLowerCase(),cur=doc.book?.name===b.name?page().lesson?.index:-1;
  b.toc.forEach((t,i)=>{
    if(q&&!t.label.toLowerCase().includes(q))return;
    const r=document.createElement('button');r.className='lesson';r.textContent=t.label;
    r.dataset.depth=t.depth;r.style.setProperty('--d',Math.min(t.depth,5));
    r.classList.toggle('on',i===cur);r.onclick=()=>openLesson(i);
    lib.lessons.append(r);
  });
  lib.lessons.querySelector('.on')?.scrollIntoView({block:'center'});
}
lib.search.addEventListener('input',showLessons);
function closeLibrary(){lib.el.classList.remove('open')}
lib.el.addEventListener('click',e=>{if(e.target===lib.el)closeLibrary()});
$('openBook').onclick=openLibrary;

// ── MATH THINGS ──
// The shelf reads the home page, so new Math Things appear here as soon as they ship.
const HOME=new URL('../../../',location.href);
let shelfBuilt=false,lastTap={x:innerWidth*.55,y:innerHeight*.3};
table.addEventListener('pointerdown',e=>{lastTap={x:e.clientX,y:e.clientY}},true);
async function buildShelf(){
  if(shelfBuilt)return;shelfBuilt=true;
  const shelf=$('shelf');
  try{
    const html=await (await fetch(HOME.href)).text();
    const d=new DOMParser().parseFromString(html,'text/html');
    let group=null;
    for(const n of d.querySelectorAll('.section-heading h2, a.app-card')){
      if(n.tagName==='H2'){group=document.createElement('div');group.className='apps';
        shelf.append(Object.assign(document.createElement('h3'),{textContent:n.textContent.trim()}),group);continue}
      const href=n.getAttribute('href');if(!group||!href||/teaching-table|curriculum-hub/.test(href))continue;
      const b=document.createElement('button');b.className='app';
      b.textContent=n.querySelector('.app-name')?.textContent.trim()||href;
      const c=(n.getAttribute('style')||'').match(/--card-color:\s*var\(--([\w-]+)\)/)?.[1];
      if(c)b.style.setProperty('--c',{ones:'#DC143C',tens:'#4169E1',hundreds:'#FFD700',thousands:'#4CBB17','ten-thousands':'#FF7F00',tenths:'#64D2FF',hundredths:'#FF9F0A'}[c]||'#AEAEB2');
      b.onclick=()=>{openApp(b.textContent,new URL(href,HOME).href);closeChest()};
      group.append(b);
    }
  }catch{shelf.textContent='Math Things could not be loaded.'}
}
$('chestBtn').onclick=()=>{finishEdit();toggleTray(null);buildShelf();$('chest').classList.add('open')};
function closeChest(){$('chest').classList.remove('open')}
$('chest').addEventListener('click',e=>{if(e.target.id==='chest')closeChest()});

// A Math Thing opens beside the spot you last worked on, not in a corner.
function openApp(name,url){
  const W=innerWidth,H=innerHeight-DOCK_SPACE;
  const w=Math.min(720,W*.55),h=Math.min(540,H*.7);
  let x=lastTap.x+40,y=lastTap.y-h/2;
  if(x+w>W-12)x=lastTap.x-w-40;
  const win=document.createElement('div');win.className='win';
  win.style.cssText=`left:${clamp(x,12,W-w-12)}px;top:${clamp(y,12,H-h)}px;width:${w}px;height:${h}px`;
  win.innerHTML=`<div class="bar"><span></span><button aria-label="Close">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <iframe allow="autoplay; fullscreen" loading="eager"></iframe><div class="resize" aria-hidden="true"></div>`;
  win.querySelector('span').textContent=name;
  win.querySelector('iframe').src=url;win.querySelector('iframe').title=name;
  win.querySelector('button').onclick=()=>win.remove();
  $('windows').append(win);
  dragHandle(win.querySelector('.bar'),win,(o,dx,dy)=>{win.style.left=o.l+dx+'px';win.style.top=o.t+dy+'px'});
  dragHandle(win.querySelector('.resize'),win,(o,dx,dy)=>{win.style.width=Math.max(320,o.w+dx)+'px';win.style.height=Math.max(240,o.h+dy)+'px'});
  win.addEventListener('pointerdown',()=>$('windows').append(win));   // bring to front
}
function dragHandle(handle,win,move){
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    e.preventDefault();handle.setPointerCapture(e.pointerId);win.classList.add('moving');
    const o={x:e.clientX,y:e.clientY,l:win.offsetLeft,t:win.offsetTop,w:win.offsetWidth,h:win.offsetHeight};
    const mv=ev=>move(o,ev.clientX-o.x,ev.clientY-o.y);
    const up=()=>{win.classList.remove('moving');handle.removeEventListener('pointermove',mv);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',up)};
    handle.addEventListener('pointermove',mv);handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up);
  });
}

// ── KEYBOARD (for a laptop at the board) ──
addEventListener('keydown',e=>{
  if(ui.editing){
    // A setup has no text field of its own, so typed digits come here.
    if(findItem(ui.editing)?.type!=='algo')return;
    const keys={Backspace:'back',Delete:'back',ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'up',Enter:'down'};
    if(e.key==='Escape'){e.preventDefault();finishEdit()}
    else if(/^[0-9.]$/.test(e.key)){e.preventDefault();cellKey(e.key)}
    else if(keys[e.key]){e.preventDefault();cellKey(keys[e.key])}
    return;
  }
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
  else if((e.key==='Delete'||e.key==='Backspace')&&ui.selected){e.preventDefault();trash.click()}
  else if(e.key==='Escape'){select(null);closeChest();closeScan();closeLibrary();toggleTray(null)}
});

const announcer=$('announce');
function say(t){announcer.textContent=t}

// ── START ──
load();syncTrays();setTool('type');
addEventListener('resize',()=>{placeOverlays()});
function start(){renderPage().then(fit);syncHistory()}
// Start once every deferred script (textbooks, PDF, MathLive) has run, and MathLive has
// defined its element so restored math renders; never wait more than a few seconds.
const domReady=new Promise(r=>document.readyState==='loading'?addEventListener('DOMContentLoaded',r,{once:true}):r());
const mathReady=Promise.race([customElements.whenDefined('math-field'),new Promise(r=>setTimeout(r,4000))]);
Promise.all([domReady,mathReady]).then(start);
window.__table={doc:()=>doc,ui,view,undo,redo,openImages,goPage};
})();
