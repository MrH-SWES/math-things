<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>Math Things. | Slicing Solids</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --text-main: #1D1D1F;
      --text-gray: #86868B;
      --text-light: #AEAEB2;
      --surface: #FFFFFF;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --shadow-raised: 6px 6px 14px rgba(166,171,189,0.45), -6px -6px 14px rgba(255,255,255,0.9);
      --shadow-milled: inset 3px 3px 6px rgba(166,171,189,0.9), inset -3px -3px 6px rgba(255,255,255,1);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Lexend', sans-serif;
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      /* the mat: warm, quiet ceramic */
      background: radial-gradient(ellipse at 50% 38%, #FBF9F6 0%, #F2EFEA 58%, #E8E4DD 100%);
    }

    #stage { flex: 1; min-height: 0; position: relative; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; cursor: grab; }
    #flat { position: absolute; left: 16px; bottom: 12px; width: clamp(110px, 22vw, 190px); height: clamp(110px, 22vw, 190px); background: rgba(255,255,255,0.7); border: 1px solid rgba(60,62,68,0.15); border-radius: 16px; box-shadow: var(--shadow-raised); pointer-events: none; }
    #record { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 4; font-weight: 900; font-size: clamp(18px, 2.8vw, 30px); opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
    #record.on { opacity: 1; }
    #record .op { color: var(--text-light); font-weight: 400; margin: 0 0.2em; }
    @media (max-width: 600px) { #record { top: 62px; font-size: 15px; } }
    .dims { display: flex; gap: 10px; align-items: center; }
    .dim { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .knob { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; background: var(--surface); box-shadow: var(--shadow-raised); color: var(--text-gray); font: 600 16px 'Lexend', sans-serif; cursor: pointer; padding: 0; line-height: 1; }
    .knob:disabled { opacity: 0.35; cursor: default; }
    .knob:focus-visible { border-color: #007AFF; outline: none; }
    .dim svg { width: 26px; height: 26px; }
    #fold { -webkit-appearance: none; appearance: none; width: clamp(140px, 26vw, 260px); height: 10px; border-radius: 5px; background: linear-gradient(180deg, #D5D7DB, #ECEEF1); box-shadow: var(--shadow-milled); outline: none; }
    #fold::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #A9ADB3); box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: grab; }
    #fold::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #A9ADB3); border: none; }
    #fold:focus-visible { box-shadow: 0 0 0 3px #007AFF; }
    .foldrow { display: flex; align-items: center; gap: 8px; }
    .sliders { display: flex; flex-direction: column; gap: 8px; }
    .sliders input { -webkit-appearance: none; appearance: none; width: clamp(130px, 22vw, 230px); height: 10px; border-radius: 5px; background: linear-gradient(180deg, #D5D7DB, #ECEEF1); box-shadow: var(--shadow-milled); outline: none; }
    .sliders input::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #A9ADB3); box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: grab; }
    .sliders input::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #A9ADB3); border: none; }
    .sliders input:focus-visible { box-shadow: 0 0 0 3px #007AFF; }
    #cabinet { flex-wrap: wrap; justify-content: center; }
    /* ── CABINET ── */
    #dock { flex-shrink: 0; display: flex; justify-content: center; padding: 0 12px; }
    #cabinet {
      display: flex; align-items: center;
      gap: clamp(8px, 1.6vw, 16px);
      padding: 12px clamp(12px, 2vw, 20px);
      border-radius: 24px 24px 0 0;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.16) 0 1px, rgba(0,0,0,0.018) 1px 2px, transparent 2px 4px),
        linear-gradient(180deg, #EFF0F3 0%, #DADCE1 100%);
      border: 1px solid rgba(0,0,0,0.06);
      border-bottom: none;
      box-shadow: 0 -8px 22px rgba(110,95,75,0.12), inset 0 1px 0 rgba(255,255,255,0.95);
    }
    #bins { display: flex; gap: clamp(6px, 1.2vw, 12px); }
    .bin {
      width: clamp(58px, 11vw, 88px);
      height: clamp(52px, 9vw, 72px);
      border: 2px solid transparent; border-radius: 16px;
      background: linear-gradient(180deg, #ECEEF1 0%, #F6F7F9 100%);
      box-shadow: var(--shadow-raised);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.2s var(--spring), box-shadow 0.2s;
    }
    /* the chosen bin sits pressed into the cabinet */
    .bin[aria-pressed="true"] { background: linear-gradient(180deg, #DFE1E6 0%, #ECEEF1 100%); box-shadow: var(--shadow-milled); }
    .bin:active { transform: scale(0.97); }
    .bin:focus-visible { border-color: #007AFF; }
    .bin svg { width: 72%; height: 72%; overflow: visible; pointer-events: none; }
    .hardware { display: flex; flex-direction: column; gap: 10px; padding-left: clamp(4px, 1vw, 10px); border-left: 1px solid rgba(0,0,0,0.07); }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--surface); border: 2px solid transparent;
      box-shadow: var(--shadow-raised);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.25s var(--spring); outline: none;
      color: var(--text-gray); padding: 0;
    }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn.active { box-shadow: var(--shadow-milled); color: var(--text-main); }
    .icon-btn:focus-visible { border-color: #007AFF; }

    /* ── FOOTER ── */
    #footer {
      flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase;
      color: var(--text-light); letter-spacing: 0.5px;
      background: linear-gradient(180deg, #DADCE1 0%, #E4E6EA 100%);
    }
    .footer-bead { display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--text-light); margin: 0 4px; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @media (max-width: 600px) { #bins { display: grid; grid-template-columns: repeat(3, auto); } .bin { width: 70px; height: 50px; } }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body>
<main id="stage" aria-label="A solid and a cutting plane"><svg id="flat" aria-hidden="true"></svg></main>

<div id="dock">
  <div id="cabinet" role="toolbar" aria-label="Controls">
    <div id="bins"></div>
    <div class="sliders">
      <div class="foldrow">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 15h16M11 3v8M8 6l3-3 3 3" fill="none" stroke="#86868B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input id="height" type="range" min="0" max="100" value="45" aria-label="Move the cut">
      </div>
      <div class="foldrow">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 16L19 6" stroke="#86868B" stroke-width="1.6" stroke-linecap="round"/><path d="M3 16h16" stroke="#86868B" stroke-width="1" opacity="0.5"/></svg>
        <input id="tilt" type="range" min="0" max="90" value="0" aria-label="Tilt the cut">
      </div>
    </div>
  </div>
</div>

<div id="footer">Math Things <span class="footer-bead"></span> | Math, in your hands <span class="footer-bead"></span></div>
<div id="live" class="sr-only" aria-live="polite"></div>

<script type="module">
import * as THREE from 'three';

// A solid and a flat cutting plane. The part of the solid above the plane fades to a ghost; the cut face is painted red,
// and its true shape is drawn flat in the corner.
const CUT = 0xDC143C;
const SOLIDS = {
  box:      { name: 'rectangular prism', color: 0x4169E1, geo: () => new THREE.BoxGeometry(2.4, 1.6, 1.5) },
  triprism: { name: 'triangular prism', color: 0x4CBB17, geo: () => new THREE.CylinderGeometry(1.1, 1.1, 2.4, 3).rotateX(-Math.PI / 2) },   // lying along the depth, a corner up, so an upright cut can cross it
  pyramid:  { name: 'square pyramid', color: 0xFF9F0A, geo: () => new THREE.ConeGeometry(1.35, 2, 4).rotateY(Math.PI / 4) },
  cylinder: { name: 'cylinder', color: 0x00A3A3, geo: () => new THREE.CylinderGeometry(0.95, 0.95, 2, 64) },
  cone:     { name: 'cone', color: 0x7B00FF, geo: () => new THREE.ConeGeometry(1.05, 2, 64) },
  sphere:   { name: 'sphere', color: 0xE8559B, geo: () => new THREE.SphereGeometry(1.1, 64, 40) },
};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz = n => { if (reduceMotion || !navigator.vibrate) return; try { navigator.vibrate(n); } catch (e) {} };
const $ = id => document.getElementById(id);
const stage = $('stage'), flat = $('flat'), live = $('live'), hEl = $('height'), tEl = $('tilt');

let kind = 'box', yaw = 0.6;

// ═══════ SCENE ═══════
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.localClippingEnabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.insertBefore(renderer.domElement, flat);
const canvas = renderer.domElement;
canvas.tabIndex = 0; canvas.setAttribute('role', 'img');
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cfc2, 2.0));
const sun = new THREE.DirectionalLight(0xfff6ea, 1.8); sun.position.set(-3, 6, 5); scene.add(sun);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
const world = new THREE.Group(); scene.add(world);

// the plane keeps what is below it; a mirror plane keeps the ghost above it
const below = new THREE.Plane(), above = new THREE.Plane();
let solid, ghost, edges, verts = [], cutMesh, sheet;

function build() {
  world.clear();
  const S = SOLIDS[kind], geo = S.geo();
  solid = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: S.color, roughness: 0.5, clippingPlanes: [below], side: THREE.DoubleSide }));
  ghost = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: S.color, roughness: 0.5, transparent: true, opacity: 0.14, depthWrite: false, clippingPlanes: [above] }));
  edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), new THREE.LineBasicMaterial({ color: 0x1D1D1F, transparent: true, opacity: 0.35 }));
  world.add(solid, ghost, edges);
  // every triangle's corners, for finding where the plane cuts the surface
  const tri = geo.index ? geo.toNonIndexed() : geo, pos = tri.attributes.position;
  verts = []; for (let i = 0; i < pos.count; i++) verts.push(new THREE.Vector3().fromBufferAttribute(pos, i));
  cutMesh = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ color: CUT, side: THREE.DoubleSide, transparent: true, opacity: 0.9, polygonOffset: true, polygonOffsetFactor: -2 }));
  sheet = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 4.4), new THREE.MeshBasicMaterial({ color: 0x9EC5FF, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false }));
  sheet.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(4.4, 4.4)), new THREE.LineBasicMaterial({ color: 0x4169E1, transparent: true, opacity: 0.5 })));
  world.add(cutMesh, sheet);
  cut();
}

// ═══════ THE CUT ═══════
// The plane leans by `tilt` (0 is level, 90 is upright) and slides along its own up direction.
// Its slide is mapped onto the solid, end to end, so the slider always passes through it.
function cut() {
  const t = tEl.value * Math.PI / 180, n = new THREE.Vector3(0, Math.cos(t), Math.sin(t)).normalize();
  let lo = Infinity, hi = -Infinity; for (const v of verts) { const d = v.dot(n); lo = Math.min(lo, d); hi = Math.max(hi, d); }
  const d = lo + 0.02 + (hi - lo - 0.04) * hEl.value / 100;
  below.set(n.clone().negate(), d); above.set(n.clone(), -d);
  // the sheet: a square in the plane, through the point d·n
  sheet.position.copy(n.clone().multiplyScalar(d));
  sheet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
  // where the plane crosses each triangle edge; for these convex solids the cut is the convex hull of those points
  const pts = [];
  for (let i = 0; i < verts.length; i += 3) for (const [a, b] of [[0, 1], [1, 2], [2, 0]]) {
    const A = verts[i + a], B = verts[i + b], da = A.dot(n) - d, db = B.dot(n) - d;
    if ((da < 0) !== (db < 0)) pts.push(A.clone().lerp(B, da / (da - db)));
  }
  const u = new THREE.Vector3(1, 0, 0), w = new THREE.Vector3().crossVectors(n, u).normalize();
  const flat2 = hull(pts.map(p => [p.dot(u), p.dot(w)]));
  const g = new THREE.BufferGeometry();
  if (flat2.length >= 3) {
    const o = n.clone().multiplyScalar(d), pos = [];
    for (let k = 1; k < flat2.length - 1; k++) for (const q of [flat2[0], flat2[k], flat2[k + 1]]) { const p = o.clone().addScaledVector(u, q[0]).addScaledVector(w, q[1]); pos.push(p.x, p.y, p.z); }
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  }
  cutMesh.geometry.dispose(); cutMesh.geometry = g;
  drawFlat(flat2); drawRecord(flat2); draw();
}
// convex hull of points in the plane (monotone chain), with near-duplicates merged
function hull(P) {
  // snap to a fine grid first, so points that differ only by rounding sort and merge as one
  const key = p => p[0] + ',' + p[1], seen = new Set();
  P = P.map(p => [Math.round(p[0] * 1e5) / 1e5, Math.round(p[1] * 1e5) / 1e5]).filter(p => !seen.has(key(p)) && seen.add(key(p))).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (P.length < 3) return P;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const p of P) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 1e-6) lower.pop(); lower.push(p); }
  for (const p of P.slice().reverse()) { while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 1e-6) upper.pop(); upper.push(p); }
  // corners closer than a hair are one corner, and a corner on a straight run is no corner at all
  let H = lower.slice(0, -1).concat(upper.slice(0, -1));
  H = H.filter((p, i) => { const q = H[(i + 1) % H.length]; return Math.hypot(p[0] - q[0], p[1] - q[1]) > 1e-3; });
  return H.filter((p, i) => { const a = H[(i - 1 + H.length) % H.length], b = H[(i + 1) % H.length]; return Math.abs(cross(a, p, b)) > 1e-4 * Math.hypot(b[0] - a[0], b[1] - a[1]); });
}

// the cut's true shape, seen straight on, in the corner
function drawFlat(H) {
  const W = flat.clientWidth, s = W / 5;
  if (H.length < 3) { flat.innerHTML = ''; return; }
  const pts = H.map(([x, y]) => `${(W / 2 + x * s).toFixed(1)},${(W / 2 - y * s).toFixed(1)}`).join(' ');
  flat.innerHTML = `<polygon points="${pts}" fill="#DC143C" fill-opacity="0.85" stroke="#8A0B24" stroke-width="1.5" stroke-linejoin="round"/>`;
}
// nothing here needs a number: the cut's shape is the point, so there is no record to show
let lastHull = [];
function drawRecord(H) { lastHull = H; }

// ═══════ VIEW ═══════
function frame() {
  const w = stage.clientWidth, h = stage.clientHeight, dist = 7.5 / Math.min(1, w / h * 1.1);
  camera.position.set(Math.sin(yaw) * dist, dist * 0.55, Math.cos(yaw) * dist); camera.lookAt(0, 0, 0); camera.updateProjectionMatrix();
}
function resize() { renderer.setSize(stage.clientWidth, stage.clientHeight, false); camera.aspect = stage.clientWidth / stage.clientHeight; frame(); cut(); }
let raf = 0;
function draw() { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => renderer.render(scene, camera)); }

// ═══════ CONTROLS ═══════
let spin = null;
canvas.addEventListener('pointerdown', e => { spin = { id: e.pointerId, x: e.clientX, yaw }; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} });
canvas.addEventListener('pointermove', e => { if (spin && spin.id === e.pointerId) { yaw = spin.yaw - (e.clientX - spin.x) / 120; frame(); draw(); } });
canvas.addEventListener('pointerup', () => { spin = null; });
canvas.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); yaw += e.key === 'ArrowLeft' ? 0.2 : -0.2; frame(); draw(); } });
for (const el of [hEl, tEl]) el.addEventListener('input', () => { cut(); if (el === tEl && (+tEl.value === 0 || +tEl.value === 90)) buzz(6); });
for (const el of [hEl, tEl]) el.addEventListener('change', () => { const n = shapeSides(); live.textContent = n === 'curved' ? 'The cut has a curved edge.' : `The cut has ${n} sides.`; });
const shapeSides = () => /cylinder|cone|sphere/.test(kind) ? 'curved' : lastHull.length;

const ART = {
  box: '<path d="M6 14l10-6h22l-10 6z" fill="#8FB0FF"/><path d="M6 14h22v18H6z" fill="#4169E1"/><path d="M28 14l10-6v18l-10 6z" fill="#2F51B8"/>',
  triprism: '<path d="M13 12l22-6-9 18z" fill="#7BDB4E"/><path d="M4 30h22L13 12z" fill="#4CBB17"/><path d="M26 30l9-6V6l-9 18z" fill="#2E8A0E"/>',
  pyramid: '<path d="M22 4L6 30l16 4z" fill="#FF9F0A"/><path d="M22 4l16 26-16 4z" fill="#D67F00"/>',
  cylinder: '<path d="M12 10v18a10 4 0 0 0 20 0V10" fill="#00A3A3"/><ellipse cx="22" cy="10" rx="10" ry="4" fill="#4FD1D1"/>',
  cone: '<path d="M22 6L11 28a11 4 0 0 0 22 0z" fill="#7B00FF"/>',
  sphere: '<circle cx="22" cy="19" r="12" fill="#E8559B"/><circle cx="18" cy="14" r="4" fill="#fff" fill-opacity=".45"/>',
};
for (const k of Object.keys(SOLIDS)) {
  const b = document.createElement('button');
  b.className = 'bin'; b.dataset.kind = k; b.setAttribute('aria-label', SOLIDS[k].name); b.setAttribute('aria-pressed', String(k === kind));
  b.innerHTML = `<svg viewBox="0 0 44 38" aria-hidden="true">${ART[k]}</svg>`;
  b.addEventListener('click', () => { kind = k; document.querySelectorAll('.bin').forEach(o => o.setAttribute('aria-pressed', String(o === b))); canvas.setAttribute('aria-label', `A ${SOLIDS[k].name} and a cutting plane`); build(); buzz(6); });
  $('bins').appendChild(b);
}
canvas.setAttribute('aria-label', 'A rectangular prism and a cutting plane');
addEventListener('resize', resize);
addEventListener('contextmenu', e => e.preventDefault());
build(); resize();
window.__slice = { set: (h, t) => { hEl.value = h; tEl.value = t; cut(); }, sides: () => lastHull.length };   // used by the screen tests
</script>
<script src="../../math-things-home.js"></script>
</body>
</html>
