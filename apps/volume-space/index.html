            const top = a ? c * (1 + (state.separate ? SEP_MAX : 0)) : 0;
            // Wide screens show the whole track; portrait screens frame the build plus open track
            const portrait = canvas.clientWidth < canvas.clientHeight;
            const xMax = Math.min(visX(), Math.max(a + (portrait ? 2 : 3), portrait ? 8 : 20));
            const box = new THREE.Box3(new V3(-1.45, -BAND, -TRAY_D), new V3(xMax + 0.15, R + 0.15, Math.max(top, 3)));
            if (canY()) box.max.y = Math.max(box.max.y, visYZ(state.rows, MAX.y) + 0.15);
            if (canZ()) box.max.z = Math.max(box.max.z, visYZ(state.layers, MAX.z) + 0.1);
            return box;
        }

        // Find a camera position along `dir` that fits `box` into the open part of the screen
        function computeFit(box, dir) {
            const W = canvas.clientWidth, H = canvas.clientHeight;
            const recBottom = state.record ? recordEl.getBoundingClientRect().bottom : 64;
            const topN = 1 - 2 * ((recBottom + 14) / H), botN = -1 + 2 * (40 / H);
            const leftN = -1 + 2 * (40 / W), rightN = 1 - 2 * (40 / W);
            const cam = camera.clone();
            cam.aspect = W / H;
            cam.updateProjectionMatrix();
            const target = box.getCenter(new V3());
            let dist = box.getBoundingSphere(new THREE.Sphere()).radius / Math.sin(THREE.MathUtils.degToRad(cam.fov) / 2);
            const corners = [];
            for (let i = 0; i < 8; i++) corners.push(new V3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z));
            const right = new V3(), up = new V3(), p = new V3();
            for (let it = 0; it < 8; it++) {
                cam.position.copy(target).addScaledVector(dir, dist);
                cam.lookAt(target);
                cam.updateMatrixWorld();
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                for (const c of corners) {
                    p.copy(c).project(cam);
                    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
                    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
                }
                const halfH = Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2) * dist, halfW = halfH * cam.aspect;
                right.setFromMatrixColumn(cam.matrixWorld, 0);
                up.setFromMatrixColumn(cam.matrixWorld, 1);
                target.addScaledVector(right, ((minX + maxX) / 2 - (leftN + rightN) / 2) * halfW);
                target.addScaledVector(up, ((minY + maxY) / 2 - (topN + botN) / 2) * halfH);
                dist *= Math.max((maxX - minX) / (rightN - leftN), (maxY - minY) / (topN - botN));
                dist = clamp(dist, controls.minDistance, controls.maxDistance);
            }
            return { position: target.clone().addScaledVector(dir, dist), target };
        }

        function frameAll(dir) {
            const f = computeFit(contentBox(), dir || HOME_DIR);
            flyTo(f.position, f.target, 800);
        }

        // After an arrow-key step, reframe only if part of the object has left the open
        // screen, or the whole scene has shrunk well below the frame
        function keepInView() {
            const { a, b, c } = eff();
            const r = canvas.getBoundingClientRect();
            const top = (state.record ? recordEl.getBoundingClientRect().bottom : r.top + 64) + 8;
            const pts = [beadWorld('x', state.n, new V3())];
            for (let i = 0; i < 8; i++) pts.push(new V3(i & 1 ? a : 0, i & 2 ? b : 0, i & 4 ? c * (1 + sep) : 0));
            const out = pts.some(pt => {
                const p = toScreen(pt);
                return p.behind || p.x < r.left + 30 || p.x > r.right - 30 || p.y < top || p.y > r.bottom - 36;
            });
            const box = contentBox();
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (let i = 0; i < 8; i++) {
                const p = toScreen(new V3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z));
                minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
            }
            const speck = Math.max((maxX - minX) / r.width, (maxY - minY) / (r.bottom - top)) < 0.4;
            if (out || speck) frameAll(camera.position.clone().sub(controls.target).normalize());
        }

        function flyTo(position, target, ms) {
            if (REDUCED) ms = 1;
            camTween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: position, t1: target, start: performance.now(), ms };
            requestRender();
        }

        function stepTween(now) {
            const T = camTween;
            const t = clamp((now - T.start) / T.ms, 0, 1), e = easeInOut(t);
            camera.position.lerpVectors(T.p0, T.p1, e);
            controls.target.lerpVectors(T.t0, T.t1, e);
            camera.lookAt(controls.target);
            if (t >= 1) { camTween = null; controls.update(); }
        }

        // Keep shadows crisp around whatever exists
        function fitShadows() {
            const box = contentBox();
            const { a, b, c } = eff();
            box.expandByPoint(new V3(a, b, c * (1 + sep)));
            const sphere = box.getBoundingSphere(new THREE.Sphere());
            const r = sphere.radius + 1;
            sun.target.position.copy(sphere.center);
            sun.position.copy(sphere.center).addScaledVector(SUN_DIR, r * 2);
            const sc = sun.shadow.camera;
            sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r;
            sc.near = 0.1; sc.far = r * 4;
            sc.updateProjectionMatrix();
            sun.shadow.normalBias = clamp(0.012 * r / 12, 0.008, 0.15);
            sun.target.updateMatrixWorld();
        }

        // ── RENDER LOOP (renders only when something moves) ──
        let needsRender = true;
        function requestRender() { needsRender = true; }
        controls.addEventListener('change', requestRender);

        function updateClip() {
            const d = camera.position.distanceTo(controls.target);
            camera.near = clamp(d / 300, 0.01, 2);
            camera.far = Math.max(300, d * 30);
            camera.updateProjectionMatrix();
        }

        let lastT = performance.now();
        function frame(now) {
            requestAnimationFrame(frame);
            const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
            lastT = now;
            let dirty = needsRender;
            needsRender = false;
            if (camTween) { stepTween(now); dirty = true; }
            else if (controls.update()) dirty = true;
            if (stepEdgePan(dt)) dirty = true;
            if (stepBeads(dt)) dirty = true;
            if (stepSep(dt)) dirty = true;
            if (stepGrow(dt)) dirty = true;
            if (stepPieceAnims(now)) dirty = true;
            if (stepGhosts(now)) dirty = true;
            if (dirty) {
                updateLabelOrient();
                updateClip();
                renderer.render(scene, camera);
            }
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            AXES.forEach(ax => sizeFactor(factorEls[ax]));   // the record's type size follows the viewport
            requestRender();
        });

        // ── BOOT ──
        // Printed numerals need Lexend loaded before they're painted onto textures.
        if (document.fonts) {
            const loads = ['500', '600', '800'].map(w => document.fonts.load(`${w} 64px Lexend`));
            await Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 2500))]);
        }

        buildHub();
        updateInfra();
        rebuildPieces(false);
        updateRecord();
        syncControls();
        fitShadows();
        {
            const f = computeFit(contentBox(), HOME_DIR);
            camera.position.copy(f.position);
            controls.target.copy(f.target);
            controls.update();
        }
        requestAnimationFrame(frame);

        // A single nudge of the bead says "I move" without a word
        const nudge = () => {
            if (interacted || state.n !== 0 || REDUCED) return;
            beads.x.vel = 3.4;
            requestRender();
        };
        setTimeout(nudge, 1400);
        setTimeout(nudge, 7000);

        // Inspection hook for testing in the console; nothing in the app reads it
        window.__volume = { state, setValue, setMode, eff, camera, controls, beads, slots, frameAll, scene, renderer, sun, hemi, requestRender, grow, yGroup, zGroup, frame };
    </script>
    <script src="../../math-things-home.js"></script>
</body>
</html>
