<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Math Things. | Frog Number Line</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#F5F5F7;
      --surface:#FFFFFF;
      --ink:#1D1D1F;
      --gray:#86868B;
      --light:#AEAEB2;
      --border:rgba(0,0,0,.08);
      --line:#343438;
      --frog:#48A94B;
      --frog-dark:#276B31;
      --frog-light:#8DDA68;
      --frog-belly:#B9E687;
      --start:#4169E1;
      --answer:#48A94B;
      --jump:#FF9F0A;
      --millions:#FF00FF;
      --hundred-thousands:#6B3FA0;
      --ten-thousands:#FF7F00;
      --thousands:#4CBB17;
      --hundreds:#FFD700;
      --tens:#4169E1;
      --ones:#DC143C;
      --tenths:#64D2FF;
      --hundredths:#FF9F0A;
      --thousandths:#7B00FF;
      --ten-thousandths:#E57373;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { min-height:100%; }
    body {
      min-height:100vh;
      font-family:'Lexend',sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 7% 8%,rgba(100,210,255,.08),transparent 28rem),
        radial-gradient(circle at 95% 90%,rgba(72,169,75,.08),transparent 28rem),
        var(--bg);
      -webkit-font-smoothing:antialiased;
    }

    button,input { font:inherit; }

    header {
      height:58px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-bottom:1px solid var(--border);
      background:rgba(245,245,247,.88);
      backdrop-filter:blur(26px);
      -webkit-backdrop-filter:blur(26px);
    }

    .logo {
      display:inline-flex;
      align-items:baseline;
      font-size:1.35rem;
      font-weight:900;
      letter-spacing:-.045em;
    }

    .logo-bead {
      width:.22em;
      height:.22em;
      margin-left:.04em;
      margin-bottom:.08em;
      border-radius:50%;
      background:linear-gradient(135deg,#efefef,#a8a8a8,#dedede);
      box-shadow:inset 1px 1px 2px rgba(255,255,255,.9),inset -1px -1px 2px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.18);
    }

    main {
      width:min(1180px,100%);
      margin:0 auto;
      padding:24px 24px 34px;
    }

    .app-title-row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:14px;
    }

    .app-title {
      font-size:clamp(1.2rem,2vw,1.6rem);
      font-weight:800;
      letter-spacing:-.035em;
    }

    .frog-badge {
      width:54px;
      height:54px;
      display:grid;
      place-items:center;
      border-radius:18px;
      background:#EEF8EA;
      border:1px solid rgba(40,113,47,.12);
      box-shadow:0 8px 22px rgba(40,113,47,.09);
    }

    .panel {
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:26px;
      background:var(--surface);
      box-shadow:0 10px 34px rgba(0,0,0,.06);
    }

    .teacher-dock {
      display:grid;
      grid-template-columns:minmax(150px,1fr) auto minmax(150px,1fr) auto auto;
      gap:12px;
      align-items:end;
      padding:18px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg,#fff,#FBFBFC);
    }

    .field label {
      display:block;
      margin:0 0 6px 2px;
      color:var(--light);
      font-size:.68rem;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .field input {
      width:100%;
      min-height:56px;
      padding:8px 12px;
      border:2px solid rgba(0,0,0,.08);
      border-radius:15px;
      outline:none;
      background:#fff;
      color:var(--ink);
      font-size:1.6rem;
      font-weight:800;
      text-align:center;
      appearance:textfield;
      -moz-appearance:textfield;
    }

    .field input::-webkit-outer-spin-button,
    .field input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }

    .field input:focus {
      border-color:rgba(0,122,255,.48);
      box-shadow:0 0 0 4px rgba(0,122,255,.10);
    }

    .op-toggle { display:flex; gap:8px; }

    .op-btn,.hop-btn,.reset-btn {
      min-width:56px;
      min-height:56px;
      border:0;
      border-radius:15px;
      cursor:pointer;
      transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s ease;
    }

    .op-btn {
      background:#F1F1F4;
      color:var(--gray);
      font-size:1.6rem;
      font-weight:800;
    }

    .op-btn.active {
      background:#1D1D1F;
      color:#fff;
      box-shadow:0 6px 14px rgba(0,0,0,.15);
    }

    .hop-btn {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:0 18px;
      background:linear-gradient(180deg,#59BA59,#388C40);
      color:#fff;
      font-weight:800;
      box-shadow:0 7px 16px rgba(40,113,47,.22),inset 0 1px 0 rgba(255,255,255,.35);
      white-space:nowrap;
    }

    .reset-btn {
      background:#F1F1F4;
      color:var(--gray);
      font-size:1.35rem;
      font-weight:800;
    }

    .op-btn:hover,.hop-btn:hover:not(:disabled),.reset-btn:hover { transform:translateY(-2px); }
    .op-btn:active,.hop-btn:active:not(:disabled),.reset-btn:active { transform:translateY(0) scale(.98); }
    .hop-btn:disabled { opacity:.5; cursor:default; }

    .equation-strip {
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px 20px;
      border-bottom:1px solid var(--border);
    }

    .equation {
      font-size:clamp(1.7rem,4vw,2.6rem);
      font-weight:800;
      letter-spacing:-.045em;
      font-variant-numeric:tabular-nums;
    }

    .equation .unknown { color:var(--light); }
    .equation .result { color:var(--frog-dark); }

    .zoom-area { padding:18px 24px 10px; }

    .zoom-meta {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
      color:var(--gray);
      font-size:.72rem;
    }

    .zoom-meta strong {
      color:var(--active-color,var(--ink));
      font-size:.82rem;
      font-weight:800;
    }

    .zoom-bar-wrap {
      padding:8px 0 14px;
      cursor:pointer;
      touch-action:none;
    }

    .zoom-bar {
      position:relative;
      height:8px;
      border-radius:999px;
      background:rgba(0,0,0,.07);
    }

    .zoom-knob {
      position:absolute;
      top:50%;
      width:24px;
      height:24px;
      border-radius:50%;
      transform:translate(-50%,-50%);
      background:
        radial-gradient(circle at 33% 28%,rgba(255,255,255,.92),rgba(255,255,255,.28) 40%,transparent 65%),
        linear-gradient(135deg,#ededed,#a9a9a9 52%,#dadada);
      box-shadow:inset 1px 1px 2px rgba(255,255,255,.85),inset -1px -1px 2px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.18);
    }

    .zoom-labels {
      display:flex;
      justify-content:space-between;
      margin-top:11px;
      color:var(--light);
      font-size:.58rem;
      font-weight:600;
    }

    .stage {
      position:relative;
      min-height:430px;
      padding:14px 26px 30px;
      overflow:hidden;
      background:linear-gradient(180deg,#fff 0%,#fff 72%,#FAFCF9 100%);
    }

    .number-line-stage {
      position:relative;
      height:330px;
      margin-top:18px;
      overflow:hidden;
      user-select:none;
      touch-action:pan-y;
      border-radius:20px;
      background:#F9FCFD;
    }

    .fixed-backdrop {
      position:absolute;
      inset:0;
      z-index:0;
      overflow:hidden;
      pointer-events:none;
      background:
        linear-gradient(180deg,
          #F4FBFE 0%,
          #F7FCFE 47%,
          #F2F7ED 47%,
          #F7FAF2 100%);
    }

    .fixed-backdrop::after {
      content:'';
      position:absolute;
      left:0;
      right:0;
      top:47%;
      height:2px;
      background:rgba(72,169,75,.09);
    }

    .backdrop-cloud {
      position:absolute;
      height:18px;
      border-radius:999px;
      background:rgba(255,255,255,.92);
      box-shadow:
        16px -7px 0 2px rgba(255,255,255,.92),
        34px 0 0 -1px rgba(255,255,255,.92);
      opacity:.92;
    }

    .cloud-a { width:42px; left:10%; top:28px; }
    .cloud-b { width:34px; right:13%; top:58px; transform:scale(.82); opacity:.75; }

    .backdrop-hill {
      position:absolute;
      bottom:0;
      width:44%;
      height:118px;
      border-radius:50% 50% 0 0 / 78% 78% 0 0;
      background:rgba(116,176,96,.055);
    }

    .hill-a { left:-10%; }
    .hill-b { right:-12%; height:96px; background:rgba(87,153,77,.045); }

    .backdrop-grass {
      position:absolute;
      bottom:34px;
      width:30px;
      height:34px;
      opacity:.26;
      background:
        linear-gradient(74deg,transparent 45%,#5C9A54 46% 52%,transparent 53%) 0 0/10px 34px,
        linear-gradient(106deg,transparent 45%,#5C9A54 46% 52%,transparent 53%) 4px 2px/11px 31px;
    }

    .grass-a { left:8%; }
    .grass-b { right:9%; transform:scale(.8); }

    .backdrop-rock {
      position:absolute;
      bottom:27px;
      width:28px;
      height:13px;
      border-radius:55% 48% 42% 45%;
      background:rgba(120,126,132,.18);
      transform:rotate(-5deg);
    }

    .rock-a { left:23%; }
    .rock-b { right:25%; width:19px; height:10px; transform:rotate(7deg); opacity:.7; }

    .line {
      position:absolute;
      z-index:2;
      left:3%;
      right:3%;
      top:196px;
      height:5px;
      border-radius:99px;
      background:var(--line);
    }

    .line::before,.line::after {
      content:'';
      position:absolute;
      top:50%;
      width:0;
      height:0;
      transform:translateY(-50%);
      border-top:8px solid transparent;
      border-bottom:8px solid transparent;
    }

    .line::before { left:-1px; border-right:12px solid var(--line); }
    .line::after { right:-1px; border-left:12px solid var(--line); }

    .ticks {
      position:absolute;
      z-index:2;
      left:5%;
      width:90%;
      top:169px;
      height:112px;
    }

    .tick-wrap {
      position:absolute;
      top:0;
      transform:translateX(-50%);
      text-align:center;
    }

    .tick {
      width:2px;
      height:40px;
      margin:auto;
      border-radius:4px;
      background:rgba(0,0,0,.20);
    }

    .tick.major {
      width:3px;
      height:53px;
      background:var(--line);
    }

    .tick-label {
      margin-top:9px;
      color:var(--gray);
      font-size:.8rem;
      font-weight:600;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
    }

    .tick-wrap.major .tick-label {
      color:var(--ink);
      font-size:.9rem;
      font-weight:800;
    }

    .start-pin,.answer-pin {
      position:absolute;
      top:174px;
      width:18px;
      height:18px;
      border:3px solid #fff;
      border-radius:50%;
      transform:translateX(-50%);
      z-index:7;
      box-shadow:0 2px 7px rgba(0,0,0,.18);
    }

    .start-pin { background:var(--start); }

    .answer-pin {
      background:var(--answer);
      opacity:0;
      transform:translateX(-50%) scale(.6);
      transition:opacity .2s ease,transform .3s cubic-bezier(.34,1.56,.64,1);
    }

    .answer-pin.show {
      opacity:1;
      transform:translateX(-50%) scale(1);
    }

    .answer-label {
      position:absolute;
      top:231px;
      z-index:8;
      padding:7px 11px;
      border-radius:10px;
      transform:translateX(-50%);
      background:#ECF7EC;
      color:var(--frog-dark);
      font-size:.86rem;
      font-weight:800;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
      opacity:0;
    }

    .answer-label.show { opacity:1; }

    .hop-layer {
      position:absolute;
      left:5%;
      width:90%;
      top:64px;
      height:134px;
      overflow:visible;
      pointer-events:none;
      z-index:3;
    }

    .hop-arc {
      fill:none;
      stroke:var(--jump);
      stroke-width:3.8;
      stroke-linecap:round;
      opacity:.86;
      vector-effect:non-scaling-stroke;
    }

    .hop-arc.current { opacity:.96; stroke-width:4.6; }

    .arc-label {
      fill:#B46600;
      font-family:'Lexend',sans-serif;
      font-size:12px;
      font-weight:800;
      text-anchor:middle;
    }

    .frog-shadow {
      position:absolute;
      top:188px;
      width:66px;
      height:11px;
      z-index:5;
      border-radius:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,.12);
      filter:blur(1px);
      pointer-events:none;
    }

    .frog {
      position:absolute;
      top:105px;
      width:104px;
      height:90px;
      z-index:10;
      transform:translateX(-50%);
      filter:drop-shadow(0 8px 7px rgba(0,0,0,.16));
      pointer-events:none;
      will-change:left,top,transform;
    }

    .frog svg { width:100%; height:100%; overflow:visible; display:block; }
    .frog-part { transform-box:fill-box; }
    #frogRearLeg { transform-origin:58% 28%; }
    #frogFrontLeg { transform-origin:35% 18%; }
    #frogBodyGroup { transform-origin:center center; }

    .scale-note {
      position:absolute;
      left:50%;
      bottom:22px;
      transform:translateX(-50%);
      color:var(--light);
      font-size:.72rem;
      font-weight:600;
      white-space:nowrap;
    }

    .legend {
      display:flex;
      justify-content:center;
      gap:18px;
      padding:0 20px 18px;
      color:var(--gray);
      font-size:.7rem;
      font-weight:600;
    }

    .legend span { display:inline-flex; align-items:center; gap:6px; }
    .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
    .dot.start { background:var(--start); }
    .dot.answer { background:var(--answer); }
    .dot.jump { background:var(--jump); }

    footer {
      padding:22px;
      text-align:center;
      color:var(--light);
      font-size:.66rem;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    button:focus-visible,input:focus-visible,.zoom-bar-wrap:focus-visible {
      outline:3px solid rgba(0,122,255,.3);
      outline-offset:3px;
    }

    @media (max-width:820px) {
      main { padding:18px 14px 28px; }
      .teacher-dock { grid-template-columns:1fr auto 1fr; }
      .hop-btn { grid-column:1 / span 2; }
      .reset-btn { grid-column:3; }
      .stage { padding-inline:10px; }
    }

    @media (max-width:560px) {
      .frog-badge { display:none; }
      .teacher-dock { grid-template-columns:1fr 1fr; }
      .op-toggle { grid-column:1 / -1; justify-content:center; }
      .hop-btn,.reset-btn { grid-column:auto; }
      .field input { font-size:1.35rem; }
      .zoom-labels { display:none; }
      .stage { min-height:390px; }
      .number-line-stage { height:305px; }
      .legend { display:none; }
    }

    @media (prefers-reduced-motion:reduce) {
      .frog,.frog-part,.frog-shadow { transition:none !important; animation:none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Math Things<span class="logo-bead"></span></div>
  </header>

  <main>
    <div class="app-title-row">
      <div class="app-title">Frog Number Line</div>
      <div class="frog-badge" aria-hidden="true">
        <svg viewBox="0 0 120 90" width="50" height="42">
          <ellipse cx="55" cy="52" rx="30" ry="21" fill="#48A94B"/>
          <ellipse cx="83" cy="39" rx="20" ry="18" fill="#59BA59"/>
          <circle cx="86" cy="23" r="10" fill="#59BA59"/>
          <circle cx="88" cy="21" r="5" fill="#fff"/>
          <circle cx="90" cy="21" r="2" fill="#1D1D1F"/>
          <path d="M91 43 Q103 46 108 41" fill="none" stroke="#276B31" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <section class="panel">
      <div class="teacher-dock">
        <div class="field">
          <label for="startInput">Start</label>
          <input id="startInput" type="number" inputmode="decimal" step="any" value="30">
        </div>

        <div class="op-toggle" aria-label="Operation">
          <button class="op-btn active" id="addBtn" type="button" aria-pressed="true" aria-label="Add">+</button>
          <button class="op-btn" id="subBtn" type="button" aria-pressed="false" aria-label="Subtract">−</button>
        </div>

        <div class="field">
          <label for="jumpInput">Jump</label>
          <input id="jumpInput" type="number" inputmode="decimal" step="any" min="0" value="7">
        </div>

        <button class="hop-btn" id="hopBtn" type="button" aria-label="Hop">
          <span aria-hidden="true">🐸</span><span>Hop</span>
        </button>
        <button class="reset-btn" id="resetBtn" type="button" aria-label="Reset frog to starting number" title="Reset">↺</button>
      </div>

      <div class="equation-strip" aria-live="polite">
        <div class="equation" id="equation"></div>
      </div>

      <div class="zoom-area">
        <div class="zoom-meta">
          <span>Scale</span>
          <strong id="zoomName">Ones</strong>
        </div>
        <div class="zoom-bar-wrap" id="zoomWrap" tabindex="0" role="slider" aria-label="Number line scale" aria-valuemin="0" aria-valuemax="10" aria-valuenow="4">
          <div class="zoom-bar" id="zoomBar">
            <div class="zoom-knob" id="zoomKnob"></div>
          </div>
          <div class="zoom-labels" aria-hidden="true">
            <span>.0001</span><span>.001</span><span>.01</span><span>.1</span><span>1</span><span>10</span><span>100</span><span>1K</span><span>10K</span><span>100K</span><span>1M</span>
          </div>
        </div>
      </div>

      <div class="stage">
        <div class="number-line-stage" id="stage">
          <div class="fixed-backdrop" aria-hidden="true">
            <div class="backdrop-cloud cloud-a"></div>
            <div class="backdrop-cloud cloud-b"></div>
            <div class="backdrop-hill hill-a"></div>
            <div class="backdrop-hill hill-b"></div>
            <div class="backdrop-grass grass-a"></div>
            <div class="backdrop-grass grass-b"></div>
            <div class="backdrop-rock rock-a"></div>
            <div class="backdrop-rock rock-b"></div>
          </div>
          <svg class="hop-layer" id="hopLayer" viewBox="0 0 1000 134" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="line"></div>
          <div class="ticks" id="ticks" aria-hidden="true"></div>
          <div class="start-pin" id="startPin" aria-hidden="true"></div>
          <div class="answer-pin" id="answerPin" aria-hidden="true"></div>
          <div class="answer-label" id="answerLabel" aria-hidden="true"></div>
          <div class="frog-shadow" id="frogShadow" aria-hidden="true"></div>

          <div class="frog" id="frog" aria-hidden="true">
            <svg viewBox="0 0 120 90">
              <defs>
                <linearGradient id="frogBody" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#6CCB62"/>
                  <stop offset=".58" stop-color="#48A94B"/>
                  <stop offset="1" stop-color="#2F7E39"/>
                </linearGradient>
                <linearGradient id="frogLeg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#57B953"/>
                  <stop offset="1" stop-color="#2F7E39"/>
                </linearGradient>
              </defs>

              <!-- far hind leg -->
              <path d="M40 57 Q25 67 20 82 Q31 79 39 72 Q44 67 50 63"
                    fill="none" stroke="#2F7E39" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>

              <g id="frogRearLeg" class="frog-part">
                <path d="M46 57 Q29 65 22 77" fill="none" stroke="url(#frogLeg)" stroke-width="12" stroke-linecap="round"/>
                <path d="M22 77 Q14 82 7 78" fill="none" stroke="#3B9241" stroke-width="8" stroke-linecap="round"/>
                <path d="M11 79 L3 84 M12 80 L6 88 M14 80 L11 89"
                      fill="none" stroke="#2F7E39" stroke-width="3.5" stroke-linecap="round"/>
              </g>

              <g id="frogBodyGroup" class="frog-part">
                <ellipse cx="53" cy="52" rx="32" ry="22" fill="url(#frogBody)" stroke="#276B31" stroke-width="2.4"/>
                <ellipse cx="58" cy="58" rx="20" ry="13" fill="#B9E687" opacity=".52"/>
                <ellipse cx="83" cy="39" rx="22" ry="19" fill="#59BA59" stroke="#276B31" stroke-width="2.3"/>

                <circle cx="86" cy="23" r="11" fill="#59BA59" stroke="#276B31" stroke-width="2.2"/>
                <circle cx="88" cy="21" r="6" fill="#fff"/>
                <circle cx="90" cy="21" r="2.6" fill="#1D1D1F"/>
                <circle cx="91" cy="20" r=".8" fill="#fff"/>

                <ellipse cx="100" cy="38" rx="2.2" ry="1.4" fill="#276B31"/>
                <path d="M91 44 Q101 49 108 42" fill="none" stroke="#276B31" stroke-width="3" stroke-linecap="round"/>
                <path d="M104 43 Q110 45 113 42" fill="none" stroke="#276B31" stroke-width="2" stroke-linecap="round"/>

                <circle cx="49" cy="42" r="2.2" fill="#398D3E" opacity=".7"/>
                <circle cx="41" cy="49" r="1.8" fill="#398D3E" opacity=".6"/>
              </g>

              <g id="frogFrontLeg" class="frog-part">
                <path d="M77 55 Q89 63 94 76" fill="none" stroke="url(#frogLeg)" stroke-width="9" stroke-linecap="round"/>
                <path d="M94 76 Q101 80 108 77" fill="none" stroke="#3B9241" stroke-width="6.5" stroke-linecap="round"/>
                <path d="M105 78 L114 82 M104 79 L112 86 M102 80 L107 88"
                      fill="none" stroke="#2F7E39" stroke-width="3" stroke-linecap="round"/>
              </g>
            </svg>
          </div>

          <div class="scale-note" id="scaleNote"></div>
        </div>

        <div class="legend" aria-hidden="true">
          <span><i class="dot start"></i>start</span>
          <span><i class="dot jump"></i>movement</span>
          <span><i class="dot answer"></i>landing</span>
        </div>
      </div>
    </section>
  </main>

  <footer>Math Things. | Math, in your hands.</footer>

  <script>
    const ZOOM_LEVELS = [
      { name:'Ten Thousandths', step:.0001, color:'var(--ten-thousandths)' },
      { name:'Thousandths', step:.001, color:'var(--thousandths)' },
      { name:'Hundredths', step:.01, color:'var(--hundredths)' },
      { name:'Tenths', step:.1, color:'var(--tenths)' },
      { name:'Ones', step:1, color:'var(--ones)' },
      { name:'Tens', step:10, color:'var(--tens)' },
      { name:'Hundreds', step:100, color:'var(--hundreds)' },
      { name:'Thousands', step:1000, color:'var(--thousands)' },
      { name:'Ten Thousands', step:10000, color:'var(--ten-thousands)' },
      { name:'Hundred Thousands', step:100000, color:'var(--hundred-thousands)' },
      { name:'Millions', step:1000000, color:'var(--millions)' }
    ];

    const HOP_DURATION = 875;
    const LANDING_PAUSE = 200;
    const CAMERA_FROG_OFFSET = .06;

    const startInput = document.getElementById('startInput');
    const jumpInput = document.getElementById('jumpInput');
    const addBtn = document.getElementById('addBtn');
    const subBtn = document.getElementById('subBtn');
    const hopBtn = document.getElementById('hopBtn');
    const resetBtn = document.getElementById('resetBtn');
    const equation = document.getElementById('equation');
    const zoomWrap = document.getElementById('zoomWrap');
    const zoomBar = document.getElementById('zoomBar');
    const zoomKnob = document.getElementById('zoomKnob');
    const zoomName = document.getElementById('zoomName');
    const ticks = document.getElementById('ticks');
    const hopLayer = document.getElementById('hopLayer');
    const frog = document.getElementById('frog');
    const frogShadow = document.getElementById('frogShadow');
    const frogRearLeg = document.getElementById('frogRearLeg');
    const frogFrontLeg = document.getElementById('frogFrontLeg');
    const frogBodyGroup = document.getElementById('frogBodyGroup');
    const startPin = document.getElementById('startPin');
    const answerPin = document.getElementById('answerPin');
    const answerLabel = document.getElementById('answerLabel');
    const scaleNote = document.getElementById('scaleNote');
    const panel = document.querySelector('.panel');

    let operation = 1;
    let zoomIndex = 4;
    let landed = false;
    let animating = false;
    let dragZoom = false;

    let frogValue = 30;
    let cameraCenter = 30;
    let cameraSpan = 10;
    let frogLift = 0;
    let hopTrail = [];
    let currentHop = null;

    function roundSafe(value) {
      return Math.round((value + Number.EPSILON) * 1000000) / 1000000;
    }

    function readStart() {
      const n = Number.parseFloat(startInput.value);
      return Number.isFinite(n) ? roundSafe(n) : 0;
    }

    function readJump() {
      const n = Number.parseFloat(jumpInput.value);
      return Number.isFinite(n) ? Math.max(0,roundSafe(n)) : 0;
    }

    function resultValue() {
      return roundSafe(readStart() + operation * readJump());
    }

    function formatNumber(value) {
      if (Math.abs(value) >= 1000) {
        return Number(value.toFixed(6)).toLocaleString(undefined,{maximumFractionDigits:6});
      }
      return Number(value.toFixed(6)).toString();
    }

    function nearlyInteger(value) {
      return Math.abs(value - Math.round(value)) < 0.0000001;
    }

    function decomposeByPlace(value) {
      const n = Math.abs(roundSafe(value));
      if (n === 0) return [];

      // Work as an integer number of millionths so decimal decomposition is exact
      // for every scale this app supports.
      let scaled = Math.round(n * 1000000);
      const places = [
        { divisor:1000000000000, value:1000000 },
        { divisor:100000000000,  value:100000 },
        { divisor:10000000000,   value:10000 },
        { divisor:1000000000,    value:1000 },
        { divisor:100000000,     value:100 },
        { divisor:10000000,      value:10 },
        { divisor:1000000,       value:1 },
        { divisor:100000,        value:.1 },
        { divisor:10000,         value:.01 },
        { divisor:1000,          value:.001 },
        { divisor:100,           value:.0001 }
      ];

      const parts = [];
      for (const place of places) {
        const digit = Math.floor(scaled / place.divisor);
        if (digit > 0) {
          parts.push({
            digit,
            unit:place.value,
            amount:roundSafe(digit * place.value)
          });
          scaled -= digit * place.divisor;
        }
      }
      return parts;
    }

    function getHopPlan() {
      const jump = readJump();
      if (jump <= 0) return { mode:'none', count:0, unit:0, parts:[] };

      const parts = decomposeByPlace(jump);

      // A single non-zero place is a counting-on problem:
      // 7 = seven 1s, .7 = seven tenths, 70 = seven tens.
      if (parts.length === 1) {
        const part = parts[0];
        return {
          mode:'repeated',
          repeated:true,
          count:part.digit,
          unit:part.unit,
          parts:[part]
        };
      }

      // Multiple non-zero places are an expanded-form problem:
      // 7.32 = 7 + .3 + .02, one meaningful hop per place value.
      return {
        mode:'place-value',
        repeated:false,
        count:parts.length,
        unit:null,
        parts
      };
    }

    function zoomIndexForUnit(unit) {
      let best = 0;
      let bestError = Infinity;
      for (let i=0;i<ZOOM_LEVELS.length;i++) {
        const error = Math.abs(Math.log10(ZOOM_LEVELS[i].step) - Math.log10(unit));
        if (error < bestError) {
          bestError = error;
          best = i;
        }
      }
      return best;
    }

    function viewportSpan() {
      return cameraSpan;
    }

    function viewportMin() {
      return cameraCenter - cameraSpan / 2;
    }

    function scaleIndexForDistance(distance) {
      const d = Math.abs(distance);
      if (!Number.isFinite(d) || d <= 0) return 4;

      const unit = Math.pow(10,Math.floor(Math.log10(d)));
      return zoomIndexForUnit(unit);
    }

    function framedView(fromValue,toValue,step) {
      const low = Math.min(fromValue,toValue);
      const high = Math.max(fromValue,toValue);
      const eps = Math.max(1e-9,Math.abs(step) * 1e-7);

      let min = Math.floor((low + eps) / step) * step;
      let max = Math.ceil((high - eps) / step) * step;

      // Guarantee visible number line beyond each endpoint.
      if (Math.abs(min-low) < eps) min -= step;
      if (Math.abs(max-high) < eps) max += step;

      min = roundSafe(min);
      max = roundSafe(max);

      // Degenerate/super-small ranges still get a useful local field.
      if (!(max > min)) {
        min = roundSafe(low-step);
        max = roundSafe(high+step);
      }

      return {
        center:roundSafe((min+max)/2),
        span:roundSafe(max-min)
      };
    }

    function overviewView() {
      const start = readStart();
      const end = resultValue();
      const index = scaleIndexForDistance(Math.abs(end-start));
      const step = ZOOM_LEVELS[index].step;
      const view = framedView(start,end,step);
      return { zoomIndex:index, center:view.center, span:view.span };
    }

    function placeValueView(fromValue,toValue,unit) {
      const index = zoomIndexForUnit(unit);
      const view = framedView(fromValue,toValue,ZOOM_LEVELS[index].step);
      return { zoomIndex:index, center:view.center, span:view.span };
    }

    function worldToPct(value) {
      return 5 + ((value - viewportMin()) / viewportSpan()) * 90;
    }

    function valueIsVisible(value, pad) {
      const p = pad || 0;
      return value >= viewportMin() - p && value <= viewportMin() + viewportSpan() + p;
    }

    function worldToSvgX(value) {
      return ((worldToPct(value) - 5) / 90) * 1000;
    }

    function renderTicks() {
      ticks.innerHTML = '';
      const step = ZOOM_LEVELS[zoomIndex].step;
      const min = viewportMin();
      const max = min + viewportSpan();
      let first = Math.ceil((min - step * .000001) / step) * step;
      const approxTicks = Math.max(1,Math.ceil((max-min)/step)+1);
      const labelEvery = Math.max(1,Math.ceil(approxTicks/14));
      let guard = 0;

      for (let value = first; value <= max + step * .0001 && guard < 180; value += step, guard++) {
        const v = roundSafe(value);
        const pct = worldToPct(v);
        if (pct < 4.8 || pct > 95.2) continue;

        const multiple = Math.round(v / step);
        const major = ((multiple % 5) + 5) % 5 === 0;

        const wrap = document.createElement('div');
        wrap.className = 'tick-wrap' + (major ? ' major' : '');
        wrap.style.left = pct + '%';

        const mark = document.createElement('div');
        mark.className = 'tick' + (major ? ' major' : '');

        const label = document.createElement('div');
        label.className = 'tick-label';
        label.textContent = formatNumber(v);
        if (approxTicks > 18 && guard % labelEvery !== 0 && !major) {
          label.style.visibility = 'hidden';
        }

        wrap.append(mark,label);
        ticks.appendChild(wrap);
      }
    }

    function arcPath(fromValue,toValue) {
      const x1 = worldToSvgX(fromValue);
      const x2 = worldToSvgX(toValue);
      const mid = (x1 + x2) / 2;
      const dist = Math.abs(x2 - x1);
      const peak = Math.max(12,70 - Math.min(50,dist * .10));
      return 'M ' + x1 + ' 134 Q ' + mid + ' ' + peak + ' ' + x2 + ' 134';
    }

    function drawArc(fromValue,toValue,isCurrent,labelText) {
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',arcPath(fromValue,toValue));
      path.setAttribute('class','hop-arc' + (isCurrent ? ' current' : ''));
      hopLayer.appendChild(path);

      if (labelText) {
        const x1 = worldToSvgX(fromValue);
        const x2 = worldToSvgX(toValue);
        const label = document.createElementNS('http://www.w3.org/2000/svg','text');
        label.setAttribute('x',String((x1+x2)/2));
        label.setAttribute('y','24');
        label.setAttribute('class','arc-label');
        label.textContent = labelText;
        hopLayer.appendChild(label);
      }
    }

    function renderArcs() {
      hopLayer.innerHTML = '';
      for (const hop of hopTrail) {
        if (valueIsVisible(hop.from,viewportSpan()) || valueIsVisible(hop.to,viewportSpan())) {
          drawArc(hop.from,hop.to,false,hop.label || '');
        }
      }
      if (currentHop) {
        drawArc(currentHop.from,currentHop.to,true,currentHop.label || '');
      }
    }

    function renderMarkers() {
      const start = readStart();
      const end = resultValue();

      const startVisible = valueIsVisible(start);
      startPin.style.display = startVisible ? 'block' : 'none';
      if (startVisible) startPin.style.left = worldToPct(start) + '%';

      const answerVisible = landed && valueIsVisible(end);
      answerPin.classList.toggle('show',answerVisible);
      answerLabel.classList.toggle('show',answerVisible);
      if (answerVisible) {
        answerPin.style.left = worldToPct(end) + '%';
        answerLabel.style.left = worldToPct(end) + '%';
        answerLabel.textContent = formatNumber(end);
      }
    }

    function renderFrog() {
      const pct = worldToPct(frogValue);
      frog.style.left = pct + '%';
      frog.style.top = (105 - frogLift) + 'px';

      frogShadow.style.left = pct + '%';
      const shadowScale = Math.max(.45,1 - frogLift / 125);
      frogShadow.style.transform = 'translateX(-50%) scaleX(' + shadowScale + ')';
      frogShadow.style.opacity = String(Math.max(.05,.14 - frogLift / 900));
    }

    function renderEquation() {
      const symbol = operation === 1 ? '+' : '−';
      equation.innerHTML =
        '<span>' + formatNumber(readStart()) + ' ' + symbol + ' ' + formatNumber(readJump()) + ' = </span>' +
        (landed
          ? '<span class="result">' + formatNumber(resultValue()) + '</span>'
          : '<span class="unknown">?</span>');
    }

    function renderScale() {
      const zoom = ZOOM_LEVELS[zoomIndex];
      panel.style.setProperty('--active-color',zoom.color);
      zoomName.textContent = zoom.name;
      zoomKnob.style.left = (zoomIndex / (ZOOM_LEVELS.length - 1) * 100) + '%';
      zoomWrap.setAttribute('aria-valuenow',String(zoomIndex));
      zoomWrap.setAttribute('aria-valuetext',zoom.name);

      const plan = getHopPlan();
      if (!readJump()) {
        scaleNote.textContent = '';
      } else if (plan.mode === 'repeated') {
        scaleNote.textContent = plan.count + (plan.count === 1 ? ' hop' : ' hops') + ' × ' + formatNumber(plan.unit);
      } else if (plan.mode === 'place-value') {
        scaleNote.textContent = plan.parts.map(part => formatNumber(part.amount)).join('  +  ');
      } else {
        scaleNote.textContent = '';
      }
    }

    function renderWorld() {
      renderTicks();
      renderArcs();
      renderMarkers();
      renderFrog();
      renderEquation();
      renderScale();
    }

    function setFrogPose(raw,direction,landing) {
      const air = Math.sin(Math.PI * raw);
      const crouch = raw < .18 ? (1 - raw/.18) : raw > .82 ? ((raw-.82)/.18) : 0;
      const backward = direction < 0;

      const rearBase = backward ? -16 : 16;
      const rearSwing = rearBase + (backward ? 34 : -34) * air;
      const frontBase = backward ? 15 : -12;
      const frontSwing = frontBase + (backward ? -24 : 24) * air;

      frogRearLeg.style.transform = 'rotate(' + rearSwing + 'deg) scaleY(' + (1 + .18*air) + ')';
      frogFrontLeg.style.transform = 'rotate(' + frontSwing + 'deg) scaleY(' + (1 + .10*air) + ')';

      const squash = landing ? .86 : (1 - .10*crouch);
      const stretch = landing ? 1.08 : (1 + .06*air);
      frogBodyGroup.style.transform = 'scale(' + stretch + ',' + squash + ')';

      const tilt = (backward ? 5 : -5) * air;
      frog.style.transform = 'translateX(-50%) rotate(' + tilt + 'deg)';
    }

    function neutralFrogPose() {
      frogRearLeg.style.transform = 'rotate(8deg)';
      frogFrontLeg.style.transform = 'rotate(-4deg)';
      frogBodyGroup.style.transform = 'scale(1,1)';
      frog.style.transform = 'translateX(-50%)';
    }

    function sleep(ms) {
      return new Promise(resolve => window.setTimeout(resolve,ms));
    }

    function smooth(t) {
      return t*t*(3-2*t);
    }

    function animateViewTo(target,duration) {
      const startCenter = cameraCenter;
      const startSpan = cameraSpan;
      const targetCenter = target.center;
      const targetSpan = target.span;
      const targetZoom = target.zoomIndex;

      return new Promise(resolve => {
        const started = performance.now();

        function frame(now) {
          const raw = Math.min(1,(now-started)/duration);
          const t = smooth(raw);

          cameraCenter = startCenter + (targetCenter-startCenter)*t;
          cameraSpan = startSpan + (targetSpan-startSpan)*t;

          // Switch tick units early enough that the scale visibly becomes the
          // new place value while the camera is still zooming.
          if (raw >= .28) zoomIndex = targetZoom;

          renderWorld();

          if (raw < 1) {
            requestAnimationFrame(frame);
          } else {
            zoomIndex = targetZoom;
            cameraCenter = targetCenter;
            cameraSpan = targetSpan;
            renderWorld();
            resolve();
          }
        }

        requestAnimationFrame(frame);
      });
    }

    function animateHop(fromValue,toValue,duration,labelText) {
      const direction = toValue >= fromValue ? 1 : -1;
      const hopHeight = 68;

      return new Promise(resolve => {
        const started = performance.now();

        function frame(now) {
          const raw = Math.min(1,(now-started)/duration);
          const t = smooth(raw);

          frogValue = roundSafe(fromValue + (toValue-fromValue)*t);
          frogLift = hopHeight * Math.sin(Math.PI*raw);

          currentHop = {
            from:fromValue,
            to:frogValue,
            label:labelText || ''
          };

          setFrogPose(raw,direction,false);
          renderWorld();

          if (raw < 1) {
            requestAnimationFrame(frame);
          } else {
            frogValue = toValue;
            frogLift = 0;
            currentHop = null;
            hopTrail.push({
              from:fromValue,
              to:toValue,
              label:labelText || ''
            });

            setFrogPose(1,direction,true);
            renderWorld();

            window.setTimeout(() => {
              neutralFrogPose();
              renderWorld();
              window.setTimeout(resolve,LANDING_PAUSE);
            },140);
          }
        }

        requestAnimationFrame(frame);
      });
    }

    async function hop() {
      if (animating) return;

      const jump = readJump();
      const start = readStart();
      const end = resultValue();

      if (jump === 0) {
        landed = true;
        frogValue = start;
        const overview = overviewView();
        zoomIndex = overview.zoomIndex;
        cameraCenter = overview.center;
        cameraSpan = overview.span;
        renderWorld();
        return;
      }

      landed = false;
      animating = true;
      hopBtn.disabled = true;
      hopTrail = [];
      currentHop = null;
      frogValue = start;
      frogLift = 0;
      neutralFrogPose();

      const overview = overviewView();
      zoomIndex = overview.zoomIndex;
      cameraCenter = overview.center;
      cameraSpan = overview.span;
      renderWorld();

      const plan = getHopPlan();

      if (plan.mode === 'repeated') {
        // A single-place-value quantity is counted on one unit at a time,
        // with the entire start-to-finish distance visible throughout.
        let from = start;

        for (let i=0;i<plan.count;i++) {
          const to = roundSafe(from + operation*plan.unit);
          await animateHop(from,to,HOP_DURATION,'');
          from = to;
        }
      } else if (plan.mode === 'place-value') {
        // A mixed-place quantity is one hop per non-zero place.
        // The viewport reframes BETWEEN hops, never while the frog is airborne.
        let from = start;

        for (let i=0;i<plan.parts.length;i++) {
          const part = plan.parts[i];
          const to = roundSafe(from + operation*part.amount);
          const targetView = placeValueView(from,to,part.unit);

          const sameView =
            zoomIndex === targetView.zoomIndex &&
            Math.abs(cameraCenter-targetView.center) < 1e-9 &&
            Math.abs(cameraSpan-targetView.span) < 1e-9;

          if (!sameView) {
            await animateViewTo(targetView,620);
            await sleep(140);
          }

          const sign = operation === 1 ? '+' : '−';
          await animateHop(from,to,HOP_DURATION * 1.06,sign + formatNumber(part.amount));
          from = to;
        }

        // Let the final fine-scale landing register, then restore the complete
        // start-to-finish context. The hop trail remains in world coordinates,
        // so every completed arc survives the zoom-out.
        await sleep(420);
        await animateViewTo(overview,760);
      }

      frogValue = end;
      landed = true;
      animating = false;
      hopBtn.disabled = false;
      frogLift = 0;
      currentHop = null;
      neutralFrogPose();
      renderWorld();
    }

    function resetHop(recenter) {
      landed = false;
      animating = false;
      hopBtn.disabled = false;
      hopTrail = [];
      currentHop = null;
      frogLift = 0;
      frogValue = readStart();

      const overview = overviewView();
      zoomIndex = overview.zoomIndex;
      cameraCenter = overview.center;
      cameraSpan = overview.span;

      neutralFrogPose();
      renderWorld();
    }

    function setOperation(next) {
      operation = next;
      addBtn.classList.toggle('active',operation===1);
      subBtn.classList.toggle('active',operation===-1);
      addBtn.setAttribute('aria-pressed',operation===1 ? 'true' : 'false');
      subBtn.setAttribute('aria-pressed',operation===-1 ? 'true' : 'false');
      resetHop(true);
    }

    function normalizeInputs() {
      if (startInput.value.trim()==='') startInput.value='0';
      jumpInput.value=String(readJump());
    }

    function changeZoom(next) {
      if (animating) return;
      zoomIndex = Math.max(0,Math.min(ZOOM_LEVELS.length-1,next));

      // After the automatic sequence, the teacher owns the camera.
      cameraCenter = frogValue;
      cameraSpan = ZOOM_LEVELS[zoomIndex].step * 10;
      renderWorld();
    }

    function handleZoomPointer(clientX) {
      const rect = zoomBar.getBoundingClientRect();
      const x = Math.max(0,Math.min(rect.width,clientX-rect.left));
      changeZoom(Math.round((x/rect.width)*(ZOOM_LEVELS.length-1)));
    }

    [startInput,jumpInput].forEach(input => {
      input.addEventListener('input',() => resetHop(true));
      input.addEventListener('blur',() => {
        normalizeInputs();
        resetHop(true);
      });
      input.addEventListener('keydown',e => {
        if (e.key==='Enter') hop();
      });
    });

    addBtn.addEventListener('click',() => setOperation(1));
    subBtn.addEventListener('click',() => setOperation(-1));
    hopBtn.addEventListener('click',hop);
    resetBtn.addEventListener('click',() => resetHop(true));

    zoomWrap.addEventListener('pointerdown',e => {
      if (animating) return;
      dragZoom=true;
      zoomWrap.setPointerCapture(e.pointerId);
      handleZoomPointer(e.clientX);
    });

    zoomWrap.addEventListener('pointermove',e => {
      if (dragZoom && !animating) handleZoomPointer(e.clientX);
    });

    zoomWrap.addEventListener('pointerup',() => { dragZoom=false; });
    zoomWrap.addEventListener('pointercancel',() => { dragZoom=false; });

    zoomWrap.addEventListener('keydown',e => {
      if (animating) return;
      if (e.key==='ArrowLeft'||e.key==='ArrowDown') { e.preventDefault(); changeZoom(zoomIndex-1); }
      if (e.key==='ArrowRight'||e.key==='ArrowUp') { e.preventDefault(); changeZoom(zoomIndex+1); }
      if (e.key==='Home') { e.preventDefault(); changeZoom(0); }
      if (e.key==='End') { e.preventDefault(); changeZoom(ZOOM_LEVELS.length-1); }
    });

    document.getElementById('stage').addEventListener('wheel',e => {
      if (!animating && (e.ctrlKey||e.metaKey)) {
        e.preventDefault();
        changeZoom(zoomIndex + (e.deltaY<0 ? 1 : -1));
      }
    },{passive:false});

    window.addEventListener('resize',renderWorld);

    frogValue = readStart();
    const initialOverview = overviewView();
    zoomIndex = initialOverview.zoomIndex;
    cameraCenter = initialOverview.center;
    cameraSpan = initialOverview.span;
    neutralFrogPose();
    renderWorld();
  </script>
  <script src="../../math-things-home.js"></script>
</body>
</html>
