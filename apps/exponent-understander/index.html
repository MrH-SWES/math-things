<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exponent Understander | Math Things</title>
<style>
:root{font-family:Lexend,system-ui,sans-serif;color:#20232b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at center,#fbfaf8,#e8e4dd);overflow:hidden}#stage{position:fixed;inset:0}header{position:fixed;z-index:5;top:0;left:0;right:0;background:#f8f7f2e8;backdrop-filter:blur(15px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;box-shadow:0 1px 8px #0001}.brand{font-weight:900;font-size:20px;letter-spacing:-1px;margin-right:auto}label{font-size:12px;font-weight:700}input{width:62px;padding:7px;border:1px solid #bbb;border-radius:8px;font:700 17px inherit}button{background:white;border:1px solid #c9c9cc;border-radius:9px;padding:8px 11px;cursor:pointer;font-weight:700}button[aria-pressed=true]{background:#222c42;color:white}#equations{position:fixed;z-index:4;top:95px;left:16px;background:#fffffff0;border-radius:14px;padding:16px;max-width:min(400px,85vw);box-shadow:0 6px 25px #0002;pointer-events:none}#equations[hidden]{display:none}#equations div{margin:8px 0;overflow-wrap:anywhere}#equations strong{font-size:13px;color:#657084}#equations p{margin:5px 0;font-size:18px;font-weight:800}#note{font-size:12px;color:#555;max-width:300px}footer{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#6c6d73;font-size:11px;pointer-events:none}@media(max-width:680px){header{gap:6px;padding:7px}.brand{width:100%;font-size:16px}button{padding:6px}#equations{top:125px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head>
<body><div id="stage"></div><header><span class="brand">Math Things<span style="color:#999"> • </span>Exponent Understander</span><label>Base <input id="base" type="number" min="1" max="10" step="1" value="3"></label><label>Power / factor <input id="power" type="number" min="0" max="12" step="1" value="3"></label><button id="minus" title="Decrease exponent">−</button><button id="plus" title="Increase exponent">+</button><button id="zoomIn" title="Zoom in">＋</button><button id="zoomOut" title="Zoom out">－</button><button id="frame">Frame</button><button id="reveal" aria-pressed="true">◉ Reveal</button><button id="explode" aria-pressed="false">✳ Explode</button></header>
<div id="equations"><div><strong>FAR • EXPONENT</strong><p id="expText"></p></div><div><strong>NEAR • MULTIPLICATION</strong><p id="mulText"></p></div><div id="note"></div></div><footer>Drag to orbit · Scroll or pinch to zoom · Two lanes, one 3D space</footer>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const stage=document.querySelector('#stage'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,1e9),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);stage.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;
scene.add(new THREE.HemisphereLight(0xffffff,0xa9a6a0,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(30,80,40);scene.add(light);
const expGroup=new THREE.Group(),mulGroup=new THREE.Group();scene.add(expGroup,mulGroup);
const unit=new THREE.BoxGeometry(1,1,1),expMat=new THREE.MeshStandardMaterial({color:0x4576df,roughness:.7}),mulMat=new THREE.MeshStandardMaterial({color:0xe8a443,roughness:.7});
const edgeMatE=new THREE.LineBasicMaterial({color:0x183c81,transparent:true,opacity:.55}),edgeMatM=new THREE.LineBasicMaterial({color:0x83500e,transparent:true,opacity:.55});
const $=id=>document.getElementById(id);let currentBounds=10;
function clear(g){while(g.children.length){const c=g.children[0];g.remove(c);if(c.geometry&&c.geometry!==unit)c.geometry.dispose();}}
function dims(b,n){const d=[1,1,1];for(let i=0;i<n;i++)d[[2,0,1][i%3]]*=b;return d;}
function cuboid(group,d,material,edgeMaterial){const count=d[0]*d[1]*d[2];if(count<=65000){const mesh=new THREE.InstancedMesh(unit,material,count),m=new THREE.Matrix4();let k=0;for(let y=0;y<d[1];y++)for(let x=0;x<d[0];x++)for(let z=0;z<d[2];z++){m.makeTranslation(x+.5,y+.5,z+.5);mesh.setMatrixAt(k++,m);}mesh.instanceMatrix.needsUpdate=true;group.add(mesh);return;}
const block=new THREE.Mesh(unit,material);block.scale.set(...d);block.position.set(d[0]/2,d[1]/2,d[2]/2);group.add(block);
const edges=new THREE.LineSegments(new THREE.EdgesGeometry(unit),edgeMaterial);edges.scale.copy(block.scale);edges.position.copy(block.position);group.add(edges);
// At large powers show the last grouping boundaries without creating millions of lines.
const step=Math.max(1,Math.pow(10,Math.floor(Math.log10(Math.max(...d)))-1));let segments=[];for(let axis=0;axis<3;axis++){const n=Math.min(45,Math.floor(d[axis]/step));for(let j=1;j<n;j++){const v=j*step;if(v>=d[axis])break;const a=[0,0,0],b=[...d];a[axis]=v;b[axis]=v;for(let t=0;t<3;t++)if(t!==axis){a[t]=0;b[t]=d[t];}segments.push(...a,...b);}}
if(segments.length){const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(segments,3));group.add(new THREE.LineSegments(geom,edgeMaterial));}
}
function textSprite(s){const c=document.createElement('canvas');c.width=512;c.height=100;const ctx=c.getContext('2d');ctx.font='bold 44px Lexend, sans-serif';ctx.fillStyle='#293345';ctx.fillText(s,12,65);const texture=new THREE.CanvasTexture(c),sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true,depthTest:false}));sprite.scale.set(9,1.75,1);return sprite;}
function update(frame=true){const b=Math.max(1,Math.min(10,Math.round(Number($('base').value)||1))),n=Math.max(0,Math.min(12,Math.round(Number($('power').value)||0)));$('base').value=b;$('power').value=n;clear(expGroup);clear(mulGroup);
const d=dims(b,n),m=[n,1,b],maxD=Math.max(...d,b,n,1),gap=Math.max(5,Math.min(100,maxD*.16));expGroup.position.z=gap;mulGroup.position.z=-gap;
cuboid(expGroup,d,expMat,edgeMatE);if(n>0)cuboid(mulGroup,m,mulMat,edgeMatM);
const labelA=textSprite('EXPONENTS'),labelB=textSprite('MULTIPLICATION');labelA.position.set(4,0,-2);labelB.position.set(5,0,-2);expGroup.add(labelA);mulGroup.add(labelB);
const exploded=$('explode').getAttribute('aria-pressed')==='true';$('expText').textContent=exploded?(n===0?'1':Array(n).fill(b).join(' × ')+' = '+Math.pow(b,n).toLocaleString()):b+'^'+n+' = '+Math.pow(b,n).toLocaleString();$('mulText').textContent=exploded?(n===0?'0':Array(n).fill(b).join(' + ')+' = '+(b*n)) : b+' × '+n+' = '+(b*n);
$('note').textContent=d.reduce((a,v)=>a*v,1)>65000?'Large powers use grouped geometry; individual cubes cannot all be drawn at this scale.':'';currentBounds=Math.max(maxD,gap*3);if(frame)fit(d,m,gap);}
function fit(d,m,gap){const min=new THREE.Vector3(0,0,-gap),max=new THREE.Vector3(Math.max(d[0],m[0]),Math.max(d[1],1),gap+d[2]);const center=min.clone().add(max).multiplyScalar(.5),radius=max.clone().sub(min).length()*.5;controls.target.copy(center);const dist=Math.max(8,radius/Math.sin(camera.fov*Math.PI/360)*1.3);camera.position.copy(center).add(new THREE.Vector3(dist*.7,dist*.55,-dist));camera.near=Math.max(.01,dist/100000);camera.far=dist*100;camera.updateProjectionMatrix();controls.update();}
for(const id of ['base','power'])$(id).addEventListener('change',()=>update());$('minus').onclick=()=>{$('power').value=Number($('power').value)-1;update()};$('plus').onclick=()=>{$('power').value=Number($('power').value)+1;update()};$('frame').onclick=()=>update();$('zoomIn').onclick=()=>{camera.position.lerp(controls.target,.25)};$('zoomOut').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(1.35).add(controls.target)};
$('reveal').onclick=()=>{const on=$('reveal').getAttribute('aria-pressed')!=='true';$('reveal').setAttribute('aria-pressed',String(on));$('equations').hidden=!on};$('explode').onclick=()=>{const on=$('explode').getAttribute('aria-pressed')!=='true';$('explode').setAttribute('aria-pressed',String(on));update(false)};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}update();animate();
</script></body></html>
