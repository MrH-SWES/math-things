<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Math Things. | Fraction Number Line</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root {
      --paper:#f5f5f7;--ink:#1d1d1f;--muted:#777a81;--line:#b9bdc4;
      --steel:#92979e;--steel-dark:#585e67;--a:#ad7838;--b:#567f94;
      --shadow:0 12px 35px rgba(36,39,46,.08),0 2px 5px rgba(36,39,46,.06);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper)}
    body{font-family:Lexend,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;min-height:100dvh;-webkit-font-smoothing:antialiased}
    button,select{font:inherit;color:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible,select:focus-visible{outline:3px solid #347dca;outline-offset:3px}
    header{padding:19px clamp(16px,4vw,42px) 12px;border-bottom:1px solid rgba(50,50,55,.06);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .brand{font-size:clamp(18px,2vw,22px);font-weight:900;letter-spacing:-.055em}
    .brand small{font-size:.78em;font-weight:500;color:var(--muted);letter-spacing:-.015em}
    .home{background:#fff;border:1px solid #d9dade;padding:9px 15px;border-radius:12px;text-decoration:none;font-size:12px;font-weight:700;color:#6a6b70}
    main{flex:1;width:min(1200px,100%);margin:auto;padding:clamp(12px,2.5vw,27px);display:flex;flex-direction:column;gap:18px;justify-content:center}
    .stage{background:linear-gradient(155deg,#fff,#f7f7f9 70%);border:1px solid #fff;border-radius:25px;box-shadow:var(--shadow);padding:14px 12px 18px}
    .switchbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:4px 14px 8px}
    .switchtitle{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#85878d}
    .switches{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .segments{display:flex;gap:5px;background:#ededef;border:1px solid #d7d9dd;padding:4px;border-radius:13px}
    .segments button{border:0;border-radius:9px;min-height:35px;min-width:41px;background:transparent;font-weight:800;font-size:14px}
    .segments button[aria-pressed="true"]{background:#fff;box-shadow:0 2px 7px rgba(30,30,35,.15)}
    .button{border:1px solid #d8dade;border-radius:12px;background:linear-gradient(145deg,#fff,#f0f1f3);min-height:44px;min-width:44px;padding:9px 13px;font-weight:700;box-shadow:0 3px 7px rgba(28,29,34,.06)}
    .button:active{transform:translateY(1px)}
    .button[aria-pressed="true"]{background:#363b44;color:#fff;border-color:#363b44}
    .line-wrap{min-height:355px;position:relative}
    #numberLine{width:100%;height:355px;display:block;touch-action:none;user-select:none;overflow:visible}
    .axis{stroke:#8d929b;stroke-width:5;stroke-linecap:round}
    .whole-zone{fill:#e9ebee;stroke:#d6d9df;stroke-width:1}
    .whole-zone.alt{fill:#f5eee4;stroke:#e0d7cd}
    .tick{stroke:#9ea4ae;stroke-width:2}
    .tick.major{stroke:#565f6c;stroke-width:3}
    .integer{font:700 17px Lexend,system-ui,sans-serif;fill:#515660;text-anchor:middle}
    .lane-name{font:900 13px Lexend,system-ui,sans-serif;fill:#7e838a;text-anchor:middle}
    .trail{stroke-width:12;stroke-linecap:round;opacity:.7}
    .trail.a{stroke:var(--a)}.trail.b{stroke:var(--b)}
    .bead{cursor:grab;outline:none}
    .bead:active{cursor:grabbing}
    .bead:focus-visible .ring{stroke:#226bbd;stroke-width:4}
    .bead .ring{fill:none;stroke:transparent;stroke-width:3}
    .bead .shell{fill:url(#steel);stroke:#5a5f65;stroke-width:1.8;filter:url(#drop)}
    .bead .letter{font:900 12px Lexend,system-ui,sans-serif;fill:#363c43;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
    .fraction-label{font:800 15px Lexend,system-ui,sans-serif;fill:#30343a;text-anchor:middle;pointer-events:none}
    .fraction-panel{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;padding:10px 12px;min-height:72px}
    .fraction-panel[hidden]{display:none}
    .frac{display:inline-grid;vertical-align:middle;grid-template-rows:1fr 1fr;line-height:1;padding:0 2px;text-align:center;min-width:24px}
    .frac .num{padding:1px 3px 4px;border-bottom:2px solid currentColor}
    .frac .den{padding:4px 3px 1px}
    .fraction-group{display:flex;align-items:center;gap:9px;border-radius:14px;padding:8px 16px;font-weight:800;font-size:21px;background:rgba(243,244,247,.88);border:1px solid #e1e2e6}
    .fraction-group .badge{font-size:13px;border-radius:50%;background:#fff;width:29px;height:29px;display:grid;place-items:center;border:2px solid var(--a)}
    .fraction-group.second .badge{border-color:var(--b)}
    #comparison{font-size:26px;font-weight:800;color:#646a74;min-width:28px;text-align:center}
    .panel{display:flex;justify-content:center;gap:clamp(12px,3vw,28px);flex-wrap:wrap}
    .lane-controls{display:flex;align-items:center;gap:9px;padding:10px 12px;background:linear-gradient(145deg,#fff,#f1f2f4);border:1px solid #e7e7e9;border-radius:19px;box-shadow:var(--shadow)}
    .lane-badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900;border:3px solid var(--a);background:#fff}
    .lane-controls[data-lane="1"] .lane-badge{border-color:var(--b)}
    .lane-controls label{color:#767a81;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;white-space:nowrap}
    .lane-controls select{border:1px solid #d3d5da;border-radius:11px;background:#fff;min-height:44px;padding:6px 8px;font-size:16px;font-weight:800;max-width:110px}
    .move{display:flex;gap:4px}
    .move .button{font-size:22px;min-width:46px;padding:5px 10px}
    .legend{font-size:10px;color:#a3a5aa;letter-spacing:.08em;text-align:center;margin:0;padding:0 10px}
    footer{text-align:center;color:#a7a9af;font-size:11px;padding:18px}
    #announcer{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    @media(max-width:600px){
      header{padding:15px 17px}
      main{gap:12px;padding:12px}
      .stage{border-radius:18px;padding:7px 4px 12px}
      .switchbar{padding:8px 8px 0}
      .line-wrap,#numberLine{height:340px;min-height:340px}
      .lane-controls{width:100%;justify-content:space-between}
      .panel{gap:10px}
      .fraction-panel{gap:6px}
      .fraction-group{font-size:17px;padding:7px 12px}
      .home{padding:9px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <header>
    <div class="brand">Math Things.<small> | Fraction Number Line</small></div>
    <a class="home" href="../../">All Math Things</a>
  </header>
  <main>
    <section class="stage" aria-label="Two aligned fraction number lines">
      <div class="switchbar">
        <span class="switchtitle">Whole lengths</span>
        <div class="switches">
          <div class="segments" role="group" aria-label="Number of whole intervals">
            <button type="button" data-wholes="1" aria-pressed="false" aria-label="Show one whole">1</button>
            <button type="button" data-wholes="2" aria-pressed="true" aria-label="Show two wholes">2</button>
            <button type="button" data-wholes="3" aria-pressed="false" aria-label="Show three wholes">3</button>
          </div>
          <button type="button" class="button" id="toggle" aria-pressed="true" aria-label="Hide fraction values" title="Show or hide fraction values">⅟₂</button>
          <button type="button" class="button" id="clear" aria-label="Clear markers to zero" title="Clear">↺</button>
        </div>
      </div>
      <div class="line-wrap">
        <svg id="numberLine" aria-label="Fraction number lines A and B" viewBox="0 0 960 355" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="record" class="fraction-panel" aria-label="Current fractions"></div>
    </section>
    <div class="panel" aria-label="Fraction partitions and bead controls">
      <div class="lane-controls" data-lane="0">
        <span class="lane-badge" aria-hidden="true">A</span>
        <label for="denA">Parts / whole</label>
        <select id="denA" aria-label="Equal parts per whole on line A"></select>
        <div class="move">
          <button type="button" class="button" data-step="0:-1" aria-label="Move A left one part">−</button>
          <button type="button" class="button" data-step="0:1" aria-label="Move A right one part">+</button>
        </div>
      </div>
      <div class="lane-controls" data-lane="1">
        <span class="lane-badge" aria-hidden="true">B</span>
        <label for="denB">Parts / whole</label>
        <select id="denB" aria-label="Equal parts per whole on line B"></select>
        <div class="move">
          <button type="button" class="button" data-step="1:-1" aria-label="Move B left one part">−</button>
          <button type="button" class="button" data-step="1:1" aria-label="Move B right one part">+</button>
        </div>
      </div>
    </div>
    <p class="legend">Math Things. | Math, in your hands.</p>
    <div id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>
  <script>
  (function () {
    'use strict';
    const svg = document.getElementById('numberLine');
    const record = document.getElementById('record');
    const live = document.getElementById('announcer');
    const denominators = [4, 8];
    const numerators = [2, 4];
    const selectors = [document.getElementById('denA'), document.getElementById('denB')];
    let wholes = 2;
    let showValues = true;
    let pointerLane = -1;
    let pointerId = null;
    const LEFT = 47;
    const TOP = [99, 246];
    const SVG_H = 355;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const fractionName = (numerator, denominator) => numerator + ' over ' + denominator;
    const fractionHTML = (n, d) => '<span class="frac"><span class="num">' +
      n + '</span><span class="den">' + d + '</span></span>';

    for (let lane = 0; lane < 2; lane++) {
      for (let n = 1; n <= 12; n++) {
        const opt = document.createElement('option');
        opt.value = n;
        opt.textContent = n;
        selectors[lane].appendChild(opt);
      }
      selectors[lane].value = denominators[lane];
      selectors[lane].addEventListener('change', function () {
        const next = Number(this.value);
        const currentPosition = numerators[lane] / denominators[lane];
        denominators[lane] = next;
        numerators[lane] = clamp(Math.round(currentPosition * next), 0, wholes * next);
        render();
        announce();
      });
    }

    function announce() {
      const same = numerators[0] * denominators[1] === numerators[1] * denominators[0];
      live.textContent = 'A: ' + fractionName(numerators[0], denominators[0]) +
        '. B: ' + fractionName(numerators[1], denominators[1]) + '. ' +
        (same ? 'Equivalent fractions.' :
          (numerators[0] * denominators[1] < numerators[1] * denominators[0] ?
            'A is less than B.' : 'A is greater than B.'));
    }

    function svgWidth() {
      return Math.max(280, Math.round(svg.getBoundingClientRect().width || svg.parentElement.clientWidth || 960));
    }

    function paint() {
      const wasFocused = document.activeElement && document.activeElement.getAttribute('data-marker');
      const width = svgWidth();
      const right = width - LEFT;
      const usable = right - LEFT;
      let pieces = [
        '<defs>',
        '<linearGradient id="steel" x1="0" y1="0" x2=".85" y2="1">',
        '<stop offset="0" stop-color="#fff"/><stop offset=".23" stop-color="#d5d9df"/>',
        '<stop offset=".55" stop-color="#979da5"/><stop offset="1" stop-color="#e1e4e9"/>',
        '</linearGradient>',
        '<filter id="drop" x="-60%" y="-70%" width="220%" height="240%">',
        '<feDropShadow dx="1" dy="4" stdDeviation="4" flood-opacity=".24"/>',
        '</filter>',
        '</defs>'
      ];
      svg.setAttribute('viewBox', '0 0 ' + width + ' ' + SVG_H);

      if (numerators[0] * denominators[1] === numerators[1] * denominators[0]) {
        const eqX = LEFT + usable * numerators[0] / (denominators[0] * wholes);
        pieces.push('<line x1="' + eqX + '" y1="' + TOP[0] +
          '" x2="' + eqX + '" y2="' + TOP[1] +
          '" stroke="#b5b9bf" stroke-dasharray="4 9" stroke-width="2" opacity=".7"/>');
      }

      for (let lane = 0; lane < 2; lane++) {
        const y = TOP[lane];
        const den = denominators[lane];
        const amount = numerators[lane];
        const x = LEFT + usable * amount / (den * wholes);
        const trackColor = lane === 0 ? '#ad7838' : '#567f94';

        for (let whole = 0; whole < wholes; whole++) {
          const start = LEFT + whole * usable / wholes;
          pieces.push('<rect x="' + start + '" y="' + (y - 24) +
            '" width="' + usable / wholes + '" height="49" rx="8" class="whole-zone' +
            (whole % 2 ? ' alt' : '') + '"/>');
        }
        pieces.push('<line x1="' + LEFT + '" y1="' + y + '" x2="' + right +
          '" y2="' + y + '" class="axis"/>');
        pieces.push('<line x1="' + LEFT + '" y1="' + y + '" x2="' + x +
          '" y2="' + y + '" class="trail ' + (lane === 0 ? 'a' : 'b') + '"/>');

        for (let i = 0; i <= wholes * den; i++) {
          const tickX = LEFT + usable * i / (wholes * den);
          const major = i % den === 0;
          pieces.push('<line x1="' + tickX + '" y1="' + (y - (major ? 21 : 11)) +
            '" x2="' + tickX + '" y2="' + (y + (major ? 21 : 11)) +
            '" class="tick' + (major ? ' major' : '') + '"/>');
          if (major) pieces.push('<text x="' + tickX + '" y="' + (y + 52) +
            '" class="integer">' + i / den + '</text>');
        }

        pieces.push('<text x="20" y="' + (y - 37) + '" class="lane-name">' +
          (lane === 0 ? 'A' : 'B') + '</text>');
        pieces.push('<rect data-track="' + lane + '" x="' + LEFT +
          '" y="' + (y - 35) + '" width="' + usable + '" height="68" fill="transparent"/>');

        if (showValues) {
          pieces.push('<text x="' + clamp(x, 35, width - 35) + '" y="' + (y - 40) +
            '" class="fraction-label">' + amount + '/' + den + '</text>');
        }
        pieces.push('<g class="bead" data-track="' + lane + '" data-marker="' + lane +
          '" role="slider" tabindex="0" aria-label="Fraction marker ' + (lane === 0 ? 'A' : 'B') +
          '" aria-valuemin="0" aria-valuemax="' + (wholes * den) +
          '" aria-valuenow="' + amount + '" aria-valuetext="' + fractionName(amount, den) + '">');
        pieces.push('<circle class="ring" cx="' + x + '" cy="' + y + '" r="25"/>');
        pieces.push('<circle class="shell" cx="' + x + '" cy="' + y + '" r="19"/>');
        pieces.push('<text class="letter" x="' + x + '" y="' + (y + 1) + '">' +
          (lane === 0 ? 'A' : 'B') + '</text>');
        pieces.push('</g>');
      }
      svg.innerHTML = pieces.join('');
      if (wasFocused !== null && wasFocused !== undefined) {
        const bead = svg.querySelector('[data-marker="' + wasFocused + '"]');
        if (bead) bead.focus({ preventScroll: true });
      }
    }

    function render() {
      paint();
      record.hidden = !showValues;
      record.innerHTML = showValues ?
        '<div class="fraction-group"><span class="badge">A</span>' +
          fractionHTML(numerators[0], denominators[0]) + '</div>' +
        '<div id="comparison">' +
          (numerators[0] * denominators[1] === numerators[1] * denominators[0] ? '=' :
            (numerators[0] * denominators[1] < numerators[1] * denominators[0] ? '&lt;' : '&gt;')) +
        '</div><div class="fraction-group second"><span class="badge">B</span>' +
          fractionHTML(numerators[1], denominators[1]) + '</div>' : '';
      document.querySelectorAll('[data-wholes]').forEach(function (button) {
        button.setAttribute('aria-pressed', button.dataset.wholes === String(wholes) ? 'true' : 'false');
      });
      const toggle = document.getElementById('toggle');
      toggle.setAttribute('aria-pressed', showValues ? 'true' : 'false');
      toggle.setAttribute('aria-label', showValues ? 'Hide fraction values' : 'Show fraction values');
    }

    function setNumerator(lane, value) {
      const next = clamp(Math.round(value), 0, wholes * denominators[lane]);
      if (next !== numerators[lane]) {
        numerators[lane] = next;
        render();
        announce();
      }
    }

    function movePointer(event, lane) {
      const rect = svg.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const normalized = clamp((x - LEFT) / (rect.width - 2 * LEFT), 0, 1);
      setNumerator(lane, normalized * wholes * denominators[lane]);
    }

    svg.addEventListener('pointerdown', function (event) {
      const hit = event.target.closest('[data-track]');
      if (!hit) return;
      const lane = Number(hit.getAttribute('data-track'));
      if (lane !== 0 && lane !== 1) return;
      pointerLane = lane;
      pointerId = event.pointerId;
      event.preventDefault();
      try { svg.setPointerCapture(pointerId); } catch (error) { /* older browsers */ }
      movePointer(event, lane);
      if (hit.hasAttribute('data-marker')) {
        const focusBead = svg.querySelector('[data-marker="' + lane + '"]');
        if (focusBead) focusBead.focus({ preventScroll: true });
      }
    });
    svg.addEventListener('pointermove', function (event) {
      if (event.pointerId === pointerId && pointerLane !== -1) {
        event.preventDefault();
        movePointer(event, pointerLane);
      }
    });
    function stopPointer(event) {
      if (event.pointerId !== pointerId) return;
      pointerLane = -1;
      pointerId = null;
      try { svg.releasePointerCapture(event.pointerId); } catch (error) { /* already released */ }
    }
    svg.addEventListener('pointerup', stopPointer);
    svg.addEventListener('pointercancel', stopPointer);
    svg.addEventListener('lostpointercapture', function () {
      pointerLane = -1;
      pointerId = null;
    });
    svg.addEventListener('keydown', function (event) {
      const hit = event.target.closest('[data-marker]');
      if (!hit) return;
      const lane = Number(hit.dataset.marker);
      const den = denominators[lane];
      let target = numerators[lane];
      if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') target--;
      else if (event.key === 'ArrowRight' || event.key === 'ArrowUp') target++;
      else if (event.key === 'PageUp') target += den;
      else if (event.key === 'PageDown') target -= den;
      else if (event.key === 'Home') target = 0;
      else if (event.key === 'End') target = wholes * den;
      else return;
      event.preventDefault();
      setNumerator(lane, target);
    });

    document.querySelectorAll('[data-wholes]').forEach(function (button) {
      button.addEventListener('click', function () {
        wholes = Number(button.dataset.wholes);
        for (let i = 0; i < 2; i++) numerators[i] = clamp(numerators[i], 0, wholes * denominators[i]);
        render();
        announce();
      });
    });
    document.querySelectorAll('[data-step]').forEach(function (button) {
      button.addEventListener('click', function () {
        const details = button.dataset.step.split(':').map(Number);
        setNumerator(details[0], numerators[details[0]] + details[1]);
      });
    });
    document.getElementById('toggle').addEventListener('click', function () {
      showValues = !showValues;
      render();
    });
    document.getElementById('clear').addEventListener('click', function () {
      numerators[0] = 0;
      numerators[1] = 0;
      render();
      announce();
    });
    const observer = new ResizeObserver(render);
    observer.observe(svg.parentElement);
    render();
    announce();
  })();
  </script>
  <script src="../../math-things-home.js"></script>
</body>
</html>
