<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F7">
  <title>Math Things. | Fraction & Decimal Number Line</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700;800;900&display=swap">
  <style>
    :root {
      --paper:#F5F5F7;--surface:#fff;--ink:#1D1D1F;--quiet:#86868B;
      --ones:#DC143C;--steel:#959aa1;--spring:cubic-bezier(.34,1.56,.64,1);
      --shadow:0 15px 32px rgba(35,36,42,.08),0 2px 5px rgba(35,36,42,.06);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--paper)}
    body{font-family:Lexend,system-ui,sans-serif;color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    button,select{font:inherit;color:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible,select:focus-visible{outline:3px solid #3575bf;outline-offset:3px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px clamp(15px,3vw,34px);border-bottom:1px solid rgba(30,32,37,.07)}
    .brand{font-size:clamp(18px,2.2vw,23px);font-weight:900;letter-spacing:-.05em}
    .brand span{font-size:.75em;font-weight:400;letter-spacing:-.012em;color:var(--quiet)}
    .home{background:#fff;border:1px solid #d9dade;padding:10px 13px;border-radius:11px;text-decoration:none;font-weight:700;font-size:12px;color:#676b70}
    main{flex:1;width:min(1120px,100%);margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:17px;padding:clamp(12px,2vw,25px)}
    .stage{border-radius:23px;background:linear-gradient(155deg,#fff,#f7f7f9);border:1px solid #fff;box-shadow:var(--shadow);padding:12px 12px 18px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:6px 10px}
    .mode-toggle{display:flex;gap:3px;padding:4px;border:1px solid #d8dbe0;border-radius:13px;background:#e8e9eb}
    .mode-toggle button{min-height:35px;padding:6px 13px;border:0;border-radius:9px;background:transparent;font-weight:800;font-size:13px}
    .mode-toggle button[aria-pressed="true"]{background:white;box-shadow:0 2px 5px rgba(32,33,38,.14)}
    .choice{display:flex;align-items:center;gap:11px}
    .choice label{font-size:12px;letter-spacing:.08em;color:#7a7d83;font-weight:800;text-transform:uppercase}
    select{min-width:74px;min-height:43px;background:#fff;border:1px solid #dadde2;box-shadow:0 2px 5px rgba(0,0,0,.04);font-weight:800;font-size:17px;border-radius:11px;padding:5px 10px}
    .actions{display:flex;gap:7px}
    .button{min-height:43px;min-width:43px;padding:7px 12px;background:linear-gradient(145deg,#fff,#eff0f2);border:1px solid #d8dbe0;border-radius:12px;font-weight:800;box-shadow:0 2px 5px rgba(0,0,0,.05)}
    .button:active{transform:translateY(1px)}
    .button[aria-pressed="true"]{background:#353b45;border-color:#353b45;color:#fff}
    .drawing{width:100%;height:390px;display:block;touch-action:none;user-select:none}
    .context-track{stroke:#959ba4;stroke-width:4;stroke-linecap:round}
    .context-slot{fill:#fff;stroke:#d5d8dc;stroke-width:.75}
    .context-focus{fill:rgba(220,20,60,.13);stroke:var(--ones);stroke-width:2.5}
    .context-tick{stroke:#a6aab1;stroke-width:1.4}
    .context-tick.strong{stroke:#5e6470;stroke-width:2.3}
    .context-label{font:700 13px Lexend,system-ui,sans-serif;fill:#646a74;text-anchor:middle}
    .context-title{font:800 10px Lexend,system-ui,sans-serif;fill:#989ca3;letter-spacing:1.8px}
    .focus-connector{stroke:#b6b9be;stroke-width:1.7;stroke-dasharray:5 8;opacity:.75}
    .detail-title{font:800 10px Lexend,system-ui,sans-serif;fill:#989ca3;letter-spacing:1.8px}
    .slice{fill:url(#enamel);stroke:rgba(130,12,36,.38);stroke-width:1}
    .slice.selected{fill:url(#active)}
    .unit-rim{fill:none;stroke:var(--ones);stroke-width:3.2}
    .detail-rail{stroke:#9da1a9;stroke-width:5;stroke-linecap:round}
    .detail-tick{stroke:#959ca6;stroke-width:1.9}
    .detail-tick.major{stroke:#4c5360;stroke-width:3.1}
    .integer{font:800 24px Lexend,system-ui,sans-serif;fill:#383d45;text-anchor:middle}
    .fraction{font:800 27px Lexend,system-ui,sans-serif;fill:#393d44;text-anchor:middle}
    .fraction-quiet{font:800 12px Lexend,system-ui,sans-serif;fill:#9b9da1;letter-spacing:1.2px;text-anchor:middle}
    .bead{cursor:grab;outline:none}
    .bead:active{cursor:grabbing}
    .bead:focus-visible .focus-ring{stroke:#2277ca;stroke-width:4}
    .bead .focus-ring{fill:none;stroke:transparent;stroke-width:4}
    .bead .shell{fill:url(#steel);stroke:#717780;stroke-width:1.6;filter:url(#beadShadow)}
    .bead .grip{stroke:#60656d;stroke-width:1.4;stroke-linecap:round;pointer-events:none}
    .buttons{display:flex;justify-content:center;gap:12px}
    .movement{display:flex;align-items:center;gap:14px;padding:10px 15px;background:linear-gradient(155deg,#fff,#f0f1f3);box-shadow:var(--shadow);border-radius:16px;border:1px solid #fff}
    .movement .button{min-width:57px;font-size:23px;padding:7px}
    .record{min-width:120px;font-size:22px;text-align:center;font-weight:900;letter-spacing:-.025em}
    .record span{font-size:12px;color:var(--quiet);font-weight:700;margin-right:7px;letter-spacing:0}
    .record[hidden]{display:none}
    #announcer{position:absolute;width:1px;height:1px;clip:rect(0 0 0 0);overflow:hidden;white-space:nowrap}
    footer{text-align:center;color:#aaaeb5;font-size:11px;padding:11px 20px 17px}
    @media(max-width:540px){
      header{padding:14px 13px}
      .home{padding:9px}
      main{gap:10px;padding:10px}
      .stage{padding:8px 3px 12px;border-radius:17px}
      .toolbar{padding:7px 10px}
      .drawing{height:390px}
      .choice label{font-size:10px}
      .movement{padding:8px 11px;gap:10px}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <header>
    <div class="brand">Math Things.<span> | Fraction &amp; Decimal Number Line</span></div>
    <a class="home" href="../../">All Math Things</a>
  </header>
  <main>
    <section class="stage" aria-label="Zoomed fraction number line from zero to one">
      <div class="toolbar">
        <div class="mode-toggle" role="group" aria-label="How to read the same number line">
          <button type="button" id="fractionMode" aria-pressed="true">Fractions</button>
          <button type="button" id="decimalMode" aria-pressed="false">Decimals</button>
        </div>
        <div class="choice">
          <label for="parts" id="partsLabel">Parts of one</label>
          <select id="parts" aria-label="Number of equal parts in one whole">
            <option value="2">2</option><option value="3">3</option>
            <option value="4" selected>4</option><option value="5">5</option>
            <option value="6">6</option><option value="8">8</option>
            <option value="10">10</option><option value="12">12</option>
          </select>
        </div>
        <div class="actions">
          <button class="button" type="button" id="labels" aria-label="Hide fraction label" aria-pressed="true" title="Show or hide fraction label">½</button>
          <button class="button" type="button" id="reset" aria-label="Return bead to zero" title="Reset">↺</button>
        </div>
      </div>
      <svg class="drawing" id="numberLine" role="group" aria-label="The canonical 0 to 1 interval enlarged and divided into fraction or decimal slices" viewBox="0 0 960 390" xmlns="http://www.w3.org/2000/svg"></svg>
    </section>
    <div class="buttons">
      <div class="movement" role="group" aria-label="Step the bead along the number line">
        <button class="button" id="left" type="button" aria-label="One fraction to the left">−</button>
        <div id="record" class="record" aria-label="Current fractional position"></div>
        <button class="button" id="right" type="button" aria-label="One fraction to the right">+</button>
      </div>
    </div>
    <div id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>
  <footer>Math Things. | Math, in your hands.</footer>
  <script>
  (() => {
    'use strict';
    const svg = document.getElementById('numberLine');
    const parts = document.getElementById('parts');
    const labels = document.getElementById('labels');
    const record = document.getElementById('record');
    const live = document.getElementById('announcer');
    const LEFT = 38, HEIGHT = 390, CONTEXT_Y = 93, RAIL_Y = 300;
    const state = {
      mode:'fraction', fractionDen:4, decimalDen:10,
      denominator:4, numerator:1, showLabels:true
    };
    const clamp = (n,lo,hi) => Math.min(hi,Math.max(lo,n));
    const position = () => state.numerator / state.denominator;
    const units = () => state.mode === 'fraction' ? state.fractionDen : state.decimalDen;
    const fractionChoices = [2,3,4,5,6,8,10,12,100];
    const decimalChoices = [10,100];
    function updateChoice() {
      const opts = state.mode === 'fraction' ? fractionChoices : decimalChoices;
      parts.replaceChildren();
      for (const d of opts) {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = state.mode === 'fraction' ? d :
          d === 10 ? '0.1' : '0.01';
        parts.appendChild(opt);
      }
      parts.value = String(units());
      document.getElementById('partsLabel').textContent =
        state.mode === 'fraction' ? 'Parts of one' : 'Slice size';
      parts.setAttribute('aria-label',state.mode === 'fraction' ?
        'Equal fractional parts of one' : 'Decimal subdivisions of one');
      for (const [id,mode] of [['fractionMode','fraction'],['decimalMode','decimal']])
        document.getElementById(id).setAttribute('aria-pressed',String(state.mode===mode));
    }
    let dragging = null;

    function width() {
      return Math.max(270,Math.round(svg.getBoundingClientRect().width ||
        svg.parentElement?.clientWidth || 960));
    }
    function formula() {
      if (state.numerator === 0) return '0';
      if (state.numerator === state.denominator) return '1';
      if (state.mode === 'fraction') return state.numerator + '/' + state.denominator;
      const fixed = Number(position().toFixed(3));
      return Math.abs(fixed-position()) > 1e-8 ? '≈'+fixed : String(fixed);
    }
    function description() {
      if (state.numerator === 0) return 'zero';
      if (state.numerator === state.denominator) return 'one whole';
      if (state.mode === 'decimal') return 'decimal position within one whole';
      return state.numerator + ' out of ' + state.denominator + ' equal parts of one whole';
    }
    function announce() {
      live.textContent = 'Bead at ' + formula() + '. ' + description() + '.';
    }
    function render() {
      const wasFocused = document.activeElement?.hasAttribute('data-bead');
      const W = width();
      const R = W - LEFT, span = R - LEFT, count = units(), slice = span / count;
      const beadX = LEFT + span * position();
      // The overview is the same number-line unit system: ten consecutive slots.
      // Its first slot (0..1) is expanded below, never compared with another line.
      const overviewSlot = span / 10;
      const topX = LEFT + span * position() / 10;
      let draw = [
        '<defs>',
        '<linearGradient id="steel" x1="0" x2=".9" y1="0" y2="1">',
        '<stop stop-color="#fff"/><stop offset=".27" stop-color="#e4e5e7"/>',
        '<stop offset=".55" stop-color="#a0a5ad"/><stop offset="1" stop-color="#e1e3e6"/>',
        '</linearGradient>',
        '<linearGradient id="enamel" x1="0" x2="0.15" y1="0" y2="1">',
        '<stop stop-color="#fff"/><stop offset=".5" stop-color="#fbedf0"/><stop offset="1" stop-color="#f9dde3"/>',
        '</linearGradient>',
        '<linearGradient id="active" x1="0" x2=".2" y1="0" y2="1">',
        '<stop stop-color="#ef8b9d"/><stop offset=".38" stop-color="#dc143c"/>',
        '<stop offset="1" stop-color="#ad092b"/>',
        '</linearGradient>',
        '<filter id="beadShadow" x="-100%" y="-100%" width="300%" height="300%">',
        '<feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity=".23"/>',
        '</filter></defs>',
        '<text x="' + LEFT + '" y="42" class="context-title">NUMBER LINE</text>',
        '<rect x="' + LEFT + '" y="70" width="' + span +
          '" height="46" rx="9" fill="#E5E5EA" stroke="#d0d2d8"/>'
      ];
      for (let i=0;i<10;i++) {
        const x = LEFT + overviewSlot * i;
        if (i === 0) continue;
        draw.push('<rect class="context-slot" x="' + x +
          '" y="71" width="' + overviewSlot + '" height="44"/>');
      }
      draw.push('<rect class="context-focus" x="' + LEFT + '" y="70" width="' +
        overviewSlot + '" height="46" rx="5"/>');
      draw.push('<line class="context-track" x1="' + LEFT + '" y1="' +
        CONTEXT_Y + '" x2="' + R + '" y2="' + CONTEXT_Y + '"/>');
      for (let i=0;i<=10;i++) {
        const x = LEFT + overviewSlot * i;
        const labeled = i===0 || i===1 || i===5 || i===10;
        draw.push('<line class="context-tick' + (labeled ? ' strong' : '') +
          '" x1="' + x + '" x2="' + x + '" y1="83" y2="103"/>');
        if (labeled) draw.push('<text class="context-label" x="' + x +
          '" y="139">' + i + '</text>');
      }
      draw.push(
        '<circle cx="' + topX + '" cy="' + CONTEXT_Y + '" r="5" fill="#717780" stroke="#fff" stroke-width="1.5"/>',
        '<line class="focus-connector" x1="' + LEFT + '" y1="118" x2="' + LEFT + '" y2="218"/>',
        '<line class="focus-connector" x1="' + (LEFT + overviewSlot) +
          '" y1="118" x2="' + R + '" y2="218"/>',
        '<text class="detail-title" x="' + LEFT + '" y="209">ONE WHOLE, MAGNIFIED</text>'
      );
      // Every view partitions the same red 0..1 object. Changing reading mode
      // never changes the bead's mathematical position.
      draw.push('<rect x="' + LEFT +
        '" y="227" width="' + span +
        '" height="65" fill="url(#enamel)"/>');
      draw.push('<rect x="' + LEFT +
        '" y="227" width="' + (span*position()) +
        '" height="65" fill="url(#active)"/>');

      // In hundredths, keep subtle unit seams and stronger tenth seams.
      // The same point stays anchored when switching fractional or decimal scales.
      const visualParts = Math.min(count,100);
      for(let i=1;i<visualParts;i++) {
        const x=LEFT+span*i/visualParts;
        const major = i % (visualParts/10) === 0;
        draw.push('<line x1="'+x+'" x2="'+x+'" y1="227" y2="291" stroke="' +
          (major?'rgba(91,9,29,.55)':'rgba(91,9,29,.21)') +
          '" stroke-width="'+(major?'2':'0.7')+'"/>');
      }
      draw.push('<rect class="unit-rim" x="' + LEFT +
        '" y="227" width="' + span + '" height="65" rx="6"/>');
      draw.push('<line class="detail-rail" x1="' + LEFT + '" y1="' +
        RAIL_Y + '" x2="' + R + '" y2="' + RAIL_Y + '"/>');
      for(let i=0;i<=visualParts;i++) {
        const x=LEFT+span*i/visualParts;
        const major=i===0 || i===visualParts ||
          (state.mode==='decimal' && i % (visualParts/10)===0);
        draw.push('<line class="detail-tick' + (major?' major':'') +
          '" x1="' + x + '" x2="' + x + '" y1="' +
          (major?282:291) + '" y2="' + (major?322:311) + '"/>');
      }
      draw.push('<text class="integer" x="' + LEFT +
        '" y="347">0</text><text class="integer" x="' + R + '" y="347">1</text>');
      if (state.showLabels) {
        draw.push('<text class="fraction-quiet" x="' + (W/2) +
          '" y="371">POSITION</text>');
        draw.push('<text class="fraction" x="' + (W/2) +
          '" y="389">' + formula() + '</text>');
      }
      draw.push(
        '<rect data-rail="true" x="' + LEFT + '" y="218" width="' + span +
        '" height="112" fill="transparent"/>',
        '<g class="bead" data-bead="true" data-rail="true" role="slider" tabindex="0"',
        ' aria-label="Number line bead" aria-valuemin="0" aria-valuemax="1"' +
          ' aria-valuenow="' + position() + '" aria-valuetext="' + formula() + '">',
        '<circle class="focus-ring" cx="' + beadX + '" cy="' + RAIL_Y + '" r="26"/>',
        '<circle class="shell" cx="' + beadX + '" cy="' + RAIL_Y + '" r="18"/>',
        '<path class="grip" d="M' + (beadX-5) + ' ' + (RAIL_Y-4) +
          ' v8 M' + beadX + ' ' + (RAIL_Y-4) + ' v8 M' +
          (beadX+5) + ' ' + (RAIL_Y-4) + ' v8"/>',
        '</g>'
      );
      svg.setAttribute('viewBox','0 0 '+W+' '+HEIGHT);
      svg.innerHTML=draw.join('');
      if(wasFocused) svg.querySelector('[data-bead]')?.focus({preventScroll:true});
      record.hidden = !state.showLabels;
      record.innerHTML = state.showLabels ? '<span>0 — 1</span>' + formula() : '';
      labels.setAttribute('aria-pressed',String(state.showLabels));
      labels.setAttribute('aria-label',state.showLabels?'Hide fraction label':'Show fraction label');
    }
    function setPosition(value) {
      const d = units(), next=clamp(Math.round(value),0,d);
      if(next===state.numerator && d===state.denominator)return;
      state.numerator=next;
      state.denominator=d;
      render();
      announce();
    }
    function step(direction) {
      const d = units(), scaled=position()*d;
      const next = direction>0 ?
        Math.floor(scaled+1e-9)+1 : Math.ceil(scaled-1e-9)-1;
      setPosition(next);
    }
    function clientToParts(clientX) {
      const rect=svg.getBoundingClientRect();
      const W=width();
      const coord=(clientX-rect.left)*(W/rect.width);
      return clamp((coord-LEFT)/(W-2*LEFT),0,1)*units();
    }
    svg.addEventListener('pointerdown',event=>{
      if(!event.target.closest('[data-rail]'))return;
      dragging=event.pointerId;
      event.preventDefault();
      try{svg.setPointerCapture(event.pointerId)}catch{}
      setPosition(clientToParts(event.clientX));
      svg.querySelector('[data-bead]')?.focus({preventScroll:true});
    });
    svg.addEventListener('pointermove',event=>{
      if(event.pointerId!==dragging)return;
      event.preventDefault();
      setPosition(clientToParts(event.clientX));
    });
    function release(event) {
      if(event.pointerId!==dragging)return;
      dragging=null;
      try{svg.releasePointerCapture(event.pointerId)}catch{}
    }
    svg.addEventListener('pointerup',release);
    svg.addEventListener('pointercancel',release);
    svg.addEventListener('lostpointercapture',()=>dragging=null);
    svg.addEventListener('keydown',event=>{
      if(!event.target.closest('[data-bead]'))return;
      if(event.key==='ArrowLeft'||event.key==='ArrowDown') {
        event.preventDefault();step(-1);
      } else if(event.key==='ArrowRight'||event.key==='ArrowUp') {
        event.preventDefault();step(1);
      } else if(event.key==='Home'||event.key==='PageDown') {
        event.preventDefault();setPosition(0);
      } else if(event.key==='End'||event.key==='PageUp') {
        event.preventDefault();setPosition(units());
      }
    });
    parts.addEventListener('change',()=>{
      const d=Number(parts.value);
      if (!(state.mode==='fraction' ? fractionChoices : decimalChoices).includes(d))return;
      if(state.mode==='fraction')state.fractionDen=d;
      else state.decimalDen=d;
      // The selected position stays constant even as new cuts are drawn.
      render();
      announce();
    });
    function toggle(mode){
      if(state.mode===mode)return;
      state.mode=mode;
      updateChoice();
      render();
      announce();
    }
    document.getElementById('fractionMode').addEventListener('click',()=>toggle('fraction'));
    document.getElementById('decimalMode').addEventListener('click',()=>toggle('decimal'));
    document.getElementById('left').addEventListener('click',()=>step(-1));
    document.getElementById('right').addEventListener('click',()=>step(1));
    labels.addEventListener('click',()=>{
      state.showLabels=!state.showLabels;
      render();
    });
    document.getElementById('reset').addEventListener('click',()=>{
      setPosition(0);
      announce();
    });
    if('ResizeObserver' in window) new ResizeObserver(render).observe(svg.parentElement);
    else window.addEventListener('resize',render);
    updateChoice();render();announce();
  })();
  </script>
  <script src="../../math-things-home.js"></script>
</body>
</html>
